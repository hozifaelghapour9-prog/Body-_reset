<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#071a33;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .container{
      width:100%;
      max-width:1100px;
      min-height:650px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
    }

    /* LEFT IMAGE */

    .left{
      position:relative;
      min-height:650px;
      background-image:
        linear-gradient(
          rgba(7,26,51,.25),
          rgba(7,26,51,.8)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85");

      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:50px;
      color:white;
    }

    .left h1{
      font-size:42px;
      margin-bottom:12px;
      font-weight:800;
    }

    .left p{
      font-size:21px;
      line-height:1.5;
      margin-bottom:5px;
    }

    .left .brand{
      color:#2563eb;
      font-weight:bold;
    }

    /* RIGHT */

    .right{
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:white;
    }

    .logo{
      font-size:32px;
      font-weight:800;
      color:#071a33;
      margin-bottom:35px;
    }

    .logo span{
      color:#2563eb;
    }

    .title{
      font-size:34px;
      color:#071a33;
      margin-bottom:10px;
    }

    .switch{
      margin-bottom:30px;
      font-size:16px;
      color:#64748b;
    }

    .switch a{
      color:#2563eb;
      font-weight:bold;
      cursor:pointer;
      text-decoration:none;
    }

    .form-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      font-size:16px;
      font-weight:bold;
      color:#071a33;
      margin-bottom:8px;
    }

    input,
    select{
      width:100%;
      height:50px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      padding:0 15px;
      font-size:16px;
      color:#071a33;
      background:white;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.1);
    }

    .password-box{
      position:relative;
    }

    .password-box input{
      padding-right:85px;
    }

    .show-password{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:none;
      color:#2563eb;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn{
      width:100%;
      height:52px;
      border:0;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    .main-btn:hover{
      background:#0d2a50;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:25px 0;
      color:#94a3b8;
      font-size:14px;
    }

    .divider::before,
    .divider::after{
      content:"";
      height:1px;
      background:#e2e8f0;
      flex:1;
    }

    .social-btn{
      width:100%;
      height:50px;
      border:0;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }

    .social-btn:hover{
      background:#0d2a50;
    }

    .google-icon{
      width:20px;
      height:20px;
      background:white;
      border-radius:50%;
      padding:2px;
    }

    .apple-icon{
      width:20px;
      height:20px;
      fill:white;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-size:15px;
      font-weight:bold;
      min-height:20px;
    }

    /* SIGN UP */

    #signupForm{
      display:none;
    }

    .signup-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .signup-grid .form-group{
      margin-bottom:15px;
    }

    .full-width{
      grid-column:1 / -1;
    }

    /* MOBILE */

    @media(max-width:800px){

      body{
        padding:15px;
      }

      .container{
        grid-template-columns:1fr;
        max-width:550px;
      }

      .left{
        min-height:300px;
        padding:30px;
      }

      .left h1{
        font-size:32px;
      }

      .left p{
        font-size:17px;
      }

      .right{
        padding:35px 25px;
      }

      .signup-grid{
        grid-template-columns:1fr;
        gap:0;
      }

      .full-width{
        grid-column:auto;
      }
    }

    @media(max-width:500px){

      body{
        padding:0;
        align-items:flex-start;
      }

      .container{
        border-radius:0;
        min-height:100vh;
      }

      .left{
        min-height:260px;
      }

      .right{
        padding:30px 20px;
      }

      .logo{
        font-size:28px;
      }

      .title{
        font-size:30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- IMAGE + TEXT -->

    <div class="left">

      <h1>
        <span class="brand">BodyReset</span>
      </h1>

      <p>
        Build a stronger body.
      </p>

      <p>
        Build a healthier life.
      </p>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right">

      <div class="logo">
        Body<span>Reset</span>
      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="title">
          Login
        </h2>

        <div class="switch">
          Don't have an account?
          <a onclick="showSignup()">Sign up</a>
        </div>


        <div class="form-group">

          <label for="loginUsername">
            Username
          </label>

          <input
            type="text"
            id="loginUsername"
            placeholder="Enter your username"
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('loginPassword', this)"
            >
              Show
            </button>

          </div>

        </div>


        <button
          class="main-btn"
          onclick="loginUser()"
        >
          Login
        </button>


        <div class="divider">
          OR
        </div>


        <button
          class="social-btn"
          onclick="loginGoogle()"
        >

          <img
            class="google-icon"
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google"
          >

          Continue with Google

        </button>


        <button
          class="social-btn"
          onclick="loginApple()"
        >

          <svg
            class="apple-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53-1.71-2.47-3.02-7.01-1.26-10.01a4.9 4.9 0 0 1 4.14-2.51c1.29-.02 2.51.87 3.28.87.77 0 2.22-1.08 3.74-.92.64.03 2.44.26 3.59 1.94-.09.06-2.14 1.24-2.12 3.69.03 2.93 2.57 3.91 2.6 3.92-.02.07-.4 1.37-1.31 2.71zM15.53 4.25c.68-.83 1.14-1.99 1.01-3.15-.98.04-2.17.65-2.88 1.48-.63.73-1.18 1.9-1.03 3.03 1.1.08 2.22-.56 2.9-1.36z"/>
          </svg>

          Continue with Apple

        </button>

      </div>


      <!-- SIGN UP -->

      <div id="signupForm">

        <h2 class="title">
          Create Account
        </h2>

        <div class="switch">
          Already have an account?
          <a onclick="showLogin()">Login</a>
        </div>


        <div class="signup-grid">


          <!-- FULL NAME -->

          <div class="form-group full-width">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
            >

          </div>


          <!-- USERNAME -->

          <div class="form-group">

            <label for="username">
              Username
            </label>

            <input
              type="text"
              id="username"
              placeholder="Username"
            >

          </div>


          <!-- AGE -->

          <div class="form-group">

            <label for="age">
              Age
            </label>

            <input
              type="number"
              id="age"
              placeholder="Age"
              min="10"
              max="100"
            >

          </div>


          <!-- GENDER -->

          <div class="form-group">

            <label for="gender">
              Gender
            </label>

            <select id="gender">

              <option value="">
                Select Gender
              </option>

              <option value="Male">
                Male
              </option>

              <option value="Female">
                Female
              </option>

            </select>

          </div>


          <!-- HEIGHT -->

          <div class="form-group">

            <label for="height">
              Height
            </label>

            <input
              type="number"
              id="height"
              placeholder="Height (cm)"
            >

          </div>


          <!-- WEIGHT -->

          <div class="form-group">

            <label for="weight">
              Weight
            </label>

            <input
              type="number"
              id="weight"
              placeholder="Weight (kg)"
            >

          </div>


          <!-- EMAIL -->

          <div class="form-group full-width">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
            >

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label for="signupPassword">
              Password
            </label>

            <div class="password-box">

              <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword('signupPassword', this)"
              >
                Show
              </button>

            </div>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="form-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <div class="password-box">

              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword('confirmPassword', this)"
              >
                Show
              </button>

            </div>

          </div>


        </div>


        <button
          class="main-btn"
          onclick="createAccount()"
        >
          Create Account
        </button>

      </div>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


  <script>

    /* SUPABASE */

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* URLS */

    const AUTH_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html";

    const DASHBOARD_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html";


    /* SHOW LOGIN */

    function showLogin(){

      document.getElementById("loginForm").style.display =
        "block";

      document.getElementById("signupForm").style.display =
        "none";

      clearMessage();
    }


    /* SHOW SIGNUP */

    function showSignup(){

      document.getElementById("loginForm").style.display =
        "none";

      document.getElementById("signupForm").style.display =
        "block";

      clearMessage();
    }


    /* SHOW / HIDE PASSWORD */

    function togglePassword(
      inputId,
      button
    ){

      const input =
        document.getElementById(inputId);

      if(input.type === "password"){

        input.type = "text";

        button.textContent = "Hide";

      }else{

        input.type = "password";

        button.textContent = "Show";
      }
    }


    /* MESSAGE */

    function showMessage(
      text,
      success = false
    ){

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.style.color =
        success ? "#16a34a" : "#dc2626";
    }


    function clearMessage(){

      document.getElementById("message").textContent =
        "";
    }


    /* LOGIN */

    async function loginUser(){

      const username =
        document
          .getElementById("loginUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      if(!username || !password){

        showMessage(
          "Please enter your username and password."
        );

        return;
      }


      showMessage(
        "Logging in...",
        true
      );


      /*
        Currently the Username field
        is used as the Supabase email.
      */

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: username,

          password: password

        });


      if(error){

        showMessage(
          error.message
        );

        return;
      }


      if(data.user){

        window.location.href =
          DASHBOARD_URL;
      }

    }


    /* CREATE ACCOUNT */

    async function createAccount(){

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const age =
        document
          .getElementById("age")
          .value;

      const gender =
        document
          .getElementById("gender")
          .value;

      const height =
        document
          .getElementById("height")
          .value;

      const weight =
        document
          .getElementById("weight")
          .value;

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      /* VALIDATION */

      if(
        !fullName ||
        !username ||
        !age ||
        !gender ||
        !height ||
        !weight ||
        !email ||
        !password ||
        !confirmPassword
      ){

        showMessage(
          "Please complete all fields."
        );

        return;
      }


      if(password !== confirmPassword){

        showMessage(
          "Passwords do not match."
        );

        return;
      }


      if(password.length < 6){

        showMessage(
          "Password must be at least 6 characters."
        );

        return;
      }


      showMessage(
        "Creating your account...",
        true
      );


      /* SUPABASE SIGN UP */

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options:{

            emailRedirectTo: AUTH_URL,

            data:{

              full_name:
                fullName,

              username:
                username,

              age:
                Number(age),

              gender:
                gender,

              height:
                Number(height),

              weight:
                Number(weight)

            }

          }

        });


      if(error){

        showMessage(
          error.message
        );

        return;
      }


      /*
        If email confirmation is enabled,
        Supabase will send a confirmation email.
      */

      if(
        data.user &&
        !data.session
      ){

        showMessage(
          "Account created. Please check your email to confirm your account.",
          true
        );

        return;
      }


      /* DIRECT LOGIN */

      if(data.session){

        window.location.href =
          DASHBOARD_URL;

      }

    }


    /* GOOGLE LOGIN */

    async function loginGoogle(){

      showMessage(
        "Connecting to Google...",
        true
      );


      const {
        error
      } =
        await supabaseClient.auth.signInWithOAuth({

          provider:"google",

          options:{

            redirectTo:
              DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message
        );

      }

    }


    /* APPLE LOGIN */

    async function loginApple(){

      showMessage(
        "Connecting to Apple...",
        true
      );


      const {
        error
      } =
        await supabaseClient.auth.signInWithOAuth({

          provider:"apple",

          options:{

            redirectTo:
              DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message
        );

      }

    }


    /* CHECK EXISTING SESSION */

    async function checkSession(){

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if(
        data &&
        data.session
      ){

        /*
          Don't automatically redirect
          while user is opening the auth page
          if they want to login again.
        */

      }

    }


    checkSession();

  </script>

</body>
  </html>
