<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #071a33;
    }

    header {
      width: 100%;
      height: 85px;
      background: #071a33;
      padding: 22px 7%;
    }

    .header-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .auth-section {
      width: 100%;
      min-height: calc(100vh - 85px);
      display: flex;
      justify-content: center;
    }

    .auth-box {
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 15px 45px rgba(7,26,51,.15);
    }

    .auth-image {
      min-height: 620px;
      padding: 45px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;
      color: white;

      background:
        linear-gradient(
          rgba(7,26,51,.30),
          rgba(7,26,51,.60)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=90")
        center/cover no-repeat;
    }

    .image-content {
      width: 100%;
      direction: rtl;
      text-align: right;
    }

    .image-content h2 {
      font-size: 38px;
      margin-bottom: 15px;
      color: white;
    }

    .image-content p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 430px;
      margin-left: auto;
      color: white;
    }

    .auth-form {
      padding: 50px 45px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #071a33;
      font-size: 15px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #071a33;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .input-group input::placeholder {
      color: #cbd5e1;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #2563eb;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #0b2547;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 15px;
    }

    .switch button {
      background: none;
      border: none;
      color: #2563eb;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: #071a33;
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    #signupForm {
      display: none;
    }

    .signup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 750px) {
      .auth-box {
        grid-template-columns: 1fr;
        border-radius: 0;
      }

      .auth-image {
        min-height: 300px;
        height: 300px;
        padding: 30px;
      }

      .auth-form {
        padding: 35px 25px;
      }
    }

    @media (max-width: 500px) {
      header {
        height: 68px;
        padding: 16px 5%;
      }

      .logo {
        font-size: 25px;
      }

      .home-link {
        font-size: 15px;
      }

      .auth-image {
        min-height: 245px;
        height: 245px;
        padding: 25px;
      }

      .image-content h2 {
        font-size: 27px;
      }

      .image-content p {
        font-size: 16px;
      }

      .auth-form {
        padding: 30px 20px;
      }

      .signup-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">

    <a href="index.html" class="home-link">
      Home
    </a>

    <div class="logo">
      Body<span>Reset</span>
    </div>

  </div>
</header>

<section class="auth-section">

  <div class="auth-box">

    <div class="auth-image">
      <div class="image-content">
        <h2>ابدأ تغيير جسمك</h2>

        <p>
          التزم بخطتك، تابع تقدمك، وابني نظام حياة صحي يناسب هدفك.
        </p>
      </div>
    </div>


    <div class="auth-form">

      <!-- LOGIN -->

      <div id="loginForm">

        <div class="input-group">
          <label>Email</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
          >
        </div>


        <div class="input-group">
          <label>Password</label>

          <div class="password-box">

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('loginPassword', this)"
            >
              Show
            </button>

          </div>
        </div>


        <button
          class="main-btn"
          onclick="loginUser()"
        >
          Login
        </button>


        <div class="switch">
          Don't have an account?

          <button onclick="showSignup()">
            Sign up
          </button>
        </div>


        <div class="divider">
          OR
        </div>


        <button
          class="social-btn"
          onclick="googleLogin()"
        >

          <svg viewBox="0 0 48 48">

            <path
              fill="#FFC107"
              d="M43.61 20.08H42V20H24v8h11.3C33.65 32.66 29.28 36 24 36c-6.63 0-12-5.37-12-12s5.37-12 12-12c3.06 0 5.84 1.15 7.96 3.04l5.66-5.66C34.05 6.06 29.3 4 24 4 12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20c0-1.34-.14-2.65-.39-3.92z"
            />

            <path
              fill="#FF3D00"
              d="M6.31 14.69l6.57 4.82C14.56 16.15 18.92 12 24 12c3.06 0 5.84 1.15 7.96 3.04l5.66-5.66C34.05 6.06 29.3 4 24 4 16.32 4 9.66 8.34 6.31 14.69z"
            />

            <path
              fill="#4CAF50"
              d="M24 44c5.2 0 9.86-1.99 13.4-5.23l-6.19-5.24C29.1 35.09 26.7 36 24 36c-5.25 0-9.59-3.35-11.19-8.03l-6.52 5.02C9.62 39.53 16.29 44 24 44z"
            />

            <path
              fill="#1976D2"
              d="M43.61 20.08H42V20H24v8h11.3a12.02 12.02 0 0 1-4.09 5.54l6.19 5.24C36.97 39.09 44 34 44 24c0-1.34-.14-2.65-.39-3.92z"
            />

          </svg>

          Continue with Google

        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>

      </div>


      <!-- SIGN UP -->

      <div id="signupForm">

        <div class="input-group">
          <label>Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Full name"
          >
        </div>


        <div class="input-group">
          <label>Username</label>
          <input
            type="text"
            id="username"
            placeholder="Username"
          >
        </div>


        <div class="signup-grid">

          <div class="input-group">
            <label>Age</label>
            <input
              type="number"
              id="age"
              placeholder="Age"
            >
          </div>


          <div class="input-group">
            <label>Gender</label>

            <select id="gender">

              <option value="">
                Select gender
              </option>

              <option value="male">
                Male
              </option>

              <option value="female">
                Female
              </option>

            </select>
          </div>


          <div class="input-group">
            <label>Height (cm)</label>

            <input
              type="number"
              id="height"
              placeholder="Height"
            >
          </div>


          <div class="input-group">
            <label>Weight (kg)</label>

            <input
              type="number"
              id="weight"
              placeholder="Weight"
            >
          </div>

        </div>


        <div class="input-group">
          <label>Email</label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Email"
          >
        </div>


        <div class="input-group">
          <label>Password</label>

          <div class="password-box">

            <input
              type="password"
              id="signupPassword"
              placeholder="Password"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('signupPassword', this)"
            >
              Show
            </button>

          </div>
        </div>


        <div class="input-group">
          <label>Confirm Password</label>

          <div class="password-box">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('confirmPassword', this)"
            >
              Show
            </button>

          </div>
        </div>


        <button
          class="main-btn"
          onclick="createAccount()"
        >
          Create Account
        </button>


        <div class="switch">

          Already have an account?

          <button onclick="showLogin()">
            Login
          </button>

        </div>


        <div
          id="signupMessage"
          class="message"
        ></div>

      </div>

    </div>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://byodeoaluspphqduxmlh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  window.togglePassword = function(id, button) {

    const input =
      document.getElementById(id);

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "Hide";

    } else {

      input.type = "password";
      button.textContent = "Show";

    }
  };


  window.showSignup = function() {

    document.getElementById("loginForm").style.display =
      "none";

    document.getElementById("signupForm").style.display =
      "block";

  };


  window.showLogin = function() {

    document.getElementById("signupForm").style.display =
      "none";

    document.getElementById("loginForm").style.display =
      "block";

  };


  window.loginUser = async function() {

    const email =
      document.getElementById("loginEmail")
      .value
      .trim();

    const password =
      document.getElementById("loginPassword")
      .value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    message.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
      await supabase.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    if (data.session) {

      window.location.href =
        "dashboard.html";

    }

  };


  window.googleLogin = async function() {

    const {
      error
    } =
      await supabase.auth.signInWithOAuth({

        provider: "google",

        options: {

          redirectTo:
            "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"

        }

      });


    if (error) {

      document.getElementById(
        "loginMessage"
      ).textContent =
        error.message;

    }

  };


  window.createAccount = async function() {

    const fullName =
      document.getElementById("fullName").value.trim();

    const username =
      document.getElementById("username").value.trim();

    const age =
      document.getElementById("age").value;

    const gender =
      document.getElementById("gender").value;

    const height =
      document.getElementById("height").value;

    const weight =
      document.getElementById("weight").value;

    const email =
      document.getElementById("signupEmail")
      .value
      .trim();

    const password =
      document.getElementById("signupPassword")
      .value;

    const confirmPassword =
      document.getElementById("confirmPassword")
      .value;

    const message =
      document.getElementById("signupMessage");


    if (
      !fullName ||
      !username ||
      !age ||
      !gender ||
      !height ||
      !weight ||
      !email ||
      !password ||
      !confirmPassword
    ) {

      message.textContent =
        "Please complete all fields.";

      return;
    }


    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      return;
    }


    message.textContent =
      "Creating account...";


    const {
      data,
      error
    } =
      await supabase.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo:
            "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html",

          data: {

            full_name: fullName,
            username: username,
            age: age,
            gender: gender,
            height: height,
            weight: weight

          }

        }

      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Account created. Please check your email to confirm your account.";

  };

</script>

</body>
  </html>
