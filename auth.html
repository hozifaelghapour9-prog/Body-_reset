<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset - Login</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f1f5f9;
      min-height:100vh;
    }

    /* HEADER */

    header{
      width:100%;
      background:#071a33;
      padding:22px 7%;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;

      display:flex;
      align-items:center;
      justify-content:space-between;

      direction:rtl;
    }

    .logo{
      color:white;
      font-size:30px;
      font-weight:bold;
    }

    .logo span{
      color:#2563eb;
    }

    .home{
      color:#071a33;
      background:white;
      text-decoration:none;

      padding:10px 20px;
      border-radius:8px;

      font-size:17px;
      font-weight:bold;
    }

    /* MAIN */

    main{
      width:100%;

      min-height:calc(100vh - 82px);

      display:flex;
      align-items:center;
      justify-content:center;

      padding:40px 25px;
    }

    /* WHITE CARD */

    .container{
      width:100%;
      max-width:1050px;

      min-height:620px;

      background:white;

      border-radius:18px;

      overflow:hidden;

      display:grid;
      grid-template-columns:1fr 1fr;

      box-shadow:0 15px 40px rgba(7,26,51,.12);
    }

    /* IMAGE */

    .left{

      position:relative;

      min-height:620px;

      background:
        linear-gradient(
          rgba(7,26,51,.20),
          rgba(7,26,51,.65)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=90");

      background-size:cover;
      background-position:center;

      display:flex;
      flex-direction:column;
      justify-content:flex-end;

      padding:35px;
    }

    /* TEXT ON IMAGE */

    .hero-text{

      direction:rtl;
      text-align:right;

      margin-top:auto;
    }

    .hero-text p{

      color:white;

      font-size:27px;

      font-weight:bold;

      margin-top:9px;

      text-shadow:
        0 2px 8px rgba(0,0,0,.5);
    }

    /* FORM */

    .right{

      padding:55px;

      display:flex;

      align-items:center;
      justify-content:center;
    }

    .form-box{

      width:100%;
      max-width:420px;
    }

    .form-box h1{

      color:#071a33;

      font-size:36px;

      margin-bottom:18px;
    }

    .switch-text{

      color:#64748b;

      font-size:14px;

      margin-bottom:25px;
    }

    .switch-text span{

      color:#2563eb;

      font-weight:bold;

      cursor:pointer;
    }

    /* FIELDS */

    .field{

      margin-bottom:17px;
    }

    .field label{

      display:block;

      color:#071a33;

      font-size:16px;

      font-weight:bold;

      margin-bottom:7px;
    }

    .field input,
    .field select{

      width:100%;

      height:48px;

      border:1px solid #cbd5e1;

      border-radius:8px;

      padding:0 14px;

      font-size:16px;

      outline:none;

      background:white;
    }

    .field input:focus,
    .field select:focus{

      border-color:#2563eb;
    }

    /* PASSWORD */

    .password-wrap{

      position:relative;
    }

    .password-wrap input{

      padding-right:70px;
    }

    .show-password{

      position:absolute;

      right:12px;

      top:50%;

      transform:translateY(-50%);

      border:none;

      background:none;

      color:#2563eb;

      font-size:13px;

      font-weight:bold;

      cursor:pointer;
    }

    /* MAIN BUTTON */

    .main-btn{

      width:100%;

      height:50px;

      border:none;

      border-radius:8px;

      background:#071a33;

      color:white;

      font-size:17px;

      font-weight:bold;

      cursor:pointer;

      margin-top:4px;
    }

    .main-btn:hover{

      background:#0d2a50;
    }

    /* DIVIDER */

    .divider{

      display:flex;

      align-items:center;

      gap:12px;

      margin:21px 0;

      color:#94a3b8;

      font-size:13px;
    }

    .divider::before,
    .divider::after{

      content:"";

      height:1px;

      background:#e2e8f0;

      flex:1;
    }

    /* SOCIAL BUTTONS */

    .social-btn{

      width:100%;

      height:48px;

      border:none;

      border-radius:8px;

      background:#071a33;

      color:white;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:11px;

      font-size:15px;

      font-weight:bold;

      cursor:pointer;

      margin-bottom:11px;
    }

    .social-btn img{

      width:20px;

      height:20px;

      object-fit:contain;
    }

    .apple-icon{

      width:20px;
      height:20px;

      fill:white;
    }

    /* SIGN UP */

    .signup-form{

      display:none;
    }

    /* MESSAGE */

    .message{

      margin-top:14px;

      text-align:center;

      font-size:13px;

      font-weight:bold;
    }

    .success{

      color:#16a34a;
    }

    .error{

      color:#dc2626;
    }

    /* TABLET */

    @media(max-width:850px){

      main{

        padding:30px 18px;
      }

      .container{

        max-width:650px;

        grid-template-columns:1fr;
      }

      .left{

        min-height:320px;
      }

      .right{

        padding:45px 35px;
      }
    }

    /* MOBILE */

    @media(max-width:500px){

      header{

        padding:19px 5%;
      }

      .logo{

        font-size:25px;
      }

      .home{

        font-size:15px;

        padding:9px 15px;
      }

      main{

        padding:20px 10px;
      }

      .container{

        border-radius:14px;
      }

      .left{

        min-height:270px;

        padding:25px;
      }

      .hero-text p{

        font-size:21px;
      }

      .right{

        padding:35px 22px;
      }

      .form-box h1{

        font-size:31px;
      }
    }

  </style>
</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <div class="logo">

        Body<span>Reset</span>

      </div>


      <a
        class="home"
        href="index.html"
      >
        Home
      </a>

    </div>

  </header>


  <!-- MAIN -->

  <main>


    <div class="container">


      <!-- IMAGE -->

      <div class="left">


        <div class="hero-text">

          <p>
            ابنِ جسمًا أقوى.
          </p>

          <p>
            ابنِ حياة صحية أفضل.
          </p>

        </div>


      </div>


      <!-- FORM -->

      <div class="right">


        <div class="form-box">


          <!-- LOGIN -->

          <div id="loginBox">


            <h1>
              Login
            </h1>


            <div class="field">

              <label>
                Username
              </label>

              <input
                type="text"
                id="loginUsername"
                placeholder="Enter username"
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>


              <div class="password-wrap">

                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter password"
                >


                <button
                  type="button"
                  class="show-password"
                  onclick="togglePassword('loginPassword',this)"
                >
                  Show
                </button>

              </div>

            </div>


            <button
              class="main-btn"
              onclick="loginUser()"
            >
              Login
            </button>


            <div
              class="switch-text"
              style="margin-top:16px;"
            >

              Don't have an account?

              <span onclick="showSignup()">
                Sign up
              </span>

            </div>


            <div class="divider">

              OR

            </div>


            <!-- GOOGLE -->

            <button
              class="social-btn"
              onclick="loginGoogle()"
            >

              <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
              >

              Continue with Google

            </button>


            <!-- APPLE -->

            <button
              class="social-btn"
              onclick="loginApple()"
            >

              <svg
                class="apple-icon"
                viewBox="0 0 24 24"
              >

                <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.08-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.39 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.96-2.52 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"/>

              </svg>


              Continue with Apple

            </button>


          </div>


          <!-- SIGN UP -->

          <div
            id="signupBox"
            class="signup-form"
          >


            <h1>
              Create Account
            </h1>


            <div class="switch-text">

              Already have an account?

              <span onclick="showLogin()">
                Login
              </span>

            </div>


            <div class="field">

              <label>
                Full Name
              </label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter full name"
              >

            </div>


            <div class="field">

              <label>
                Username
              </label>

              <input
                type="text"
                id="signupUsername"
                placeholder="Enter username"
              >

            </div>


            <div class="field">

              <label>
                Age
              </label>

              <input
                type="number"
                id="age"
                placeholder="Enter age"
              >

            </div>


            <div class="field">

              <label>
                Gender
              </label>

              <select id="gender">

                <option value="">
                  Select gender
                </option>

                <option value="male">
                  Male
                </option>

                <option value="female">
                  Female
                </option>

              </select>

            </div>


            <div class="field">

              <label>
                Height
              </label>

              <input
                type="number"
                id="height"
                placeholder="Height in cm"
              >

            </div>


            <div class="field">

              <label>
                Weight
              </label>

              <input
                type="number"
                id="weight"
                placeholder="Weight in kg"
              >

            </div>


            <div class="field">

              <label>
                Email
              </label>

              <input
                type="email"
                id="signupEmail"
                placeholder="Enter email"
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>


              <div class="password-wrap">

                <input
                  type="password"
                  id="signupPassword"
                  placeholder="Create password"
                >


                <button
                  type="button"
                  class="show-password"
                  onclick="togglePassword('signupPassword',this)"
                >
                  Show
                </button>

              </div>

            </div>


            <div class="field">

              <label>
                Confirm Password
              </label>


              <div class="password-wrap">

                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm password"
                >


                <button
                  type="button"
                  class="show-password"
                  onclick="togglePassword('confirmPassword',this)"
                >
                  Show
                </button>

              </div>

            </div>


            <button
              class="main-btn"
              onclick="createAccount()"
            >
              Create Account
            </button>


          </div>


          <div
            id="message"
            class="message"
          ></div>


        </div>

      </div>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";


    const DASHBOARD_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html";


    const AUTH_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function showMessage(text,type){

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function showSignup(){

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("signupBox").style.display =
        "block";

      document.getElementById("message").textContent =
        "";

    }


    function showLogin(){

      document.getElementById("signupBox").style.display =
        "none";

      document.getElementById("loginBox").style.display =
        "block";

      document.getElementById("message").textContent =
        "";

    }


    function togglePassword(id,button){

      const input =
        document.getElementById(id);


      if(input.type === "password"){

        input.type = "text";

        button.textContent =
          "Hide";

      }else{

        input.type = "password";

        button.textContent =
          "Show";

      }

    }


    async function loginUser(){

      const username =
        document
          .getElementById("loginUsername")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      if(!username || !password){

        showMessage(
          "Please enter username and password.",
          "error"
        );

        return;

      }


      showMessage(
        "Logging in...",
        ""
      );


      const {data,error} =
        await supabaseClient.auth.signInWithPassword({

          email:username,

          password:password

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

        return;

      }


      window.location.href =
        DASHBOARD_URL;

    }


    async function createAccount(){

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      const username =
        document
          .getElementById("signupUsername")
          .value
          .trim();


      const age =
        document
          .getElementById("age")
          .value;


      const gender =
        document
          .getElementById("gender")
          .value;


      const height =
        document
          .getElementById("height")
          .value;


      const weight =
        document
          .getElementById("weight")
          .value;


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if(
        !fullName ||
        !username ||
        !age ||
        !gender ||
        !height ||
        !weight ||
        !email ||
        !password ||
        !confirmPassword
      ){

        showMessage(
          "Please fill in all fields.",
          "error"
        );

        return;

      }


      if(password !== confirmPassword){

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      showMessage(
        "Creating account...",
        ""
      );


      const {data,error} =
        await supabaseClient.auth.signUp({

          email:email,

          password:password,

          options:{

            emailRedirectTo:AUTH_URL,

            data:{

              full_name:fullName,

              username:username,

              age:Number(age),

              gender:gender,

              height:Number(height),

              weight:Number(weight)

            }

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

        return;

      }


      if(data.session){

        window.location.href =
          DASHBOARD_URL;

      }else{

        showMessage(
          "Account created. Please confirm your email.",
          "success"
        );

      }

    }


    async function loginGoogle(){

      const {error} =
        await supabaseClient.auth.signInWithOAuth({

          provider:"google",

          options:{

            redirectTo:DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

      }

    }


    async function loginApple(){

      const {error} =
        await supabaseClient.auth.signInWithOAuth({

          provider:"apple",

          options:{

            redirectTo:DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

      }

    }

  </script>

</body>
  </html>
