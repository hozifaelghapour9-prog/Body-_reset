<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - تسجيل الدخول</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f5f9;
      color:#071a33;
      min-height:100vh;
    }

    /* Header */
    header{
      background:#071a33;
      padding:22px 7%;
    }

    .top-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      direction:rtl;
    }

    .logo{
      color:white;
      font-size:30px;
      font-weight:bold;
    }

    .logo span{
      color:#2563eb;
    }

    .home-link{
      color:white;
      text-decoration:none;
      font-size:17px;
      font-weight:bold;
    }

    /* Main */
    .auth-section{
      min-height:calc(100vh - 85px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:45px 20px;
    }

    .auth-box{
      width:100%;
      max-width:1050px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 15px 45px rgba(7,26,51,.15);
    }

    /* Image */
    .auth-image{
      min-height:620px;
      background:
        linear-gradient(rgba(7,26,51,.35),rgba(7,26,51,.55)),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=85")
        center/cover;
      display:flex;
      align-items:flex-end;
      padding:45px;
      color:white;
    }

    .image-content h2{
      font-size:38px;
      margin-bottom:12px;
      line-height:1.3;
    }

    .image-content p{
      font-size:18px;
      line-height:1.8;
      max-width:400px;
    }

    /* Form */
    .auth-form{
      padding:45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .auth-form h1{
      font-size:32px;
      margin-bottom:10px;
      color:#071a33;
    }

    .subtitle{
      color:#64748b;
      font-size:16px;
      margin-bottom:28px;
      line-height:1.7;
    }

    /* Toggle */
    .switch{
      display:flex;
      background:#e2e8f0;
      border-radius:10px;
      padding:4px;
      margin-bottom:25px;
    }

    .switch button{
      width:50%;
      border:none;
      padding:12px;
      border-radius:8px;
      background:transparent;
      color:#071a33;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .switch button.active{
      background:#071a33;
      color:white;
    }

    /* Inputs */
    .input-group{
      margin-bottom:17px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:15px;
      font-weight:bold;
      color:#071a33;
    }

    .input-wrapper{
      position:relative;
    }

    .input-wrapper input{
      width:100%;
      height:52px;
      border:2px solid #071a33;
      background:#071a33;
      color:white;
      border-radius:9px;
      padding:0 15px;
      font-size:16px;
      outline:none;
    }

    .input-wrapper input::placeholder{
      color:#cbd5e1;
    }

    .input-wrapper input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .password-toggle{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      color:#cbd5e1;
      cursor:pointer;
      font-size:13px;
      font-weight:bold;
    }

    /* Main button */
    .main-btn{
      width:100%;
      height:52px;
      border:none;
      border-radius:9px;
      background:#2563eb;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
      transition:.2s;
    }

    .main-btn:hover{
      background:#1d4ed8;
    }

    /* Divider */
    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:25px 0 18px;
      color:#94a3b8;
      font-size:14px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#cbd5e1;
    }

    /* Social buttons */
    .social-btn{
      width:100%;
      height:52px;
      border-radius:9px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:12px;
      transition:.2s;
    }

    .google-btn{
      background:white;
      color:#071a33;
      border:2px solid #071a33;
    }

    .google-btn:hover{
      background:#f8fafc;
    }

    .apple-btn{
      background:#071a33;
      color:white;
      border:2px solid #071a33;
    }

    .apple-btn:hover{
      background:#102a4a;
    }

    .apple-logo{
      width:21px;
      height:21px;
      fill:white;
    }

    .google-logo{
      width:20px;
      height:20px;
    }

    /* Message */
    .message{
      min-height:24px;
      text-align:center;
      margin-top:15px;
      font-size:14px;
      line-height:1.6;
    }

    .success{
      color:#15803d;
    }

    .error{
      color:#dc2626;
    }

    /* Footer text */
    .bottom-text{
      text-align:center;
      color:#64748b;
      font-size:14px;
      margin-top:20px;
    }

    /* Mobile */
    @media(max-width:800px){

      .auth-box{
        grid-template-columns:1fr;
      }

      .auth-image{
        min-height:260px;
        padding:30px;
      }

      .image-content h2{
        font-size:28px;
      }

      .image-content p{
        font-size:16px;
      }

      .auth-form{
        padding:32px 24px;
      }
    }

    @media(max-width:500px){

      header{
        padding:19px 5%;
      }

      .logo{
        font-size:25px;
      }

      .home-link{
        font-size:15px;
      }

      .auth-section{
        padding:25px 12px;
      }

      .auth-form{
        padding:28px 20px;
      }

      .auth-form h1{
        font-size:27px;
      }

      .auth-image{
        min-height:220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="top-header">

      <div class="logo">
        Body<span>Reset</span>
      </div>

      <a href="index.html" class="home-link">
        الرئيسية
      </a>

    </div>
  </header>


  <main class="auth-section">

    <div class="auth-box">

      <!-- Image -->
      <div class="auth-image">

        <div class="image-content">

          <h2>
            ابدأ تغيير جسمك
          </h2>

          <p>
            التزم بخطتك، تابع تقدمك، وابني نظام حياة صحي يناسب هدفك.
          </p>

        </div>

      </div>


      <!-- Form -->
      <div class="auth-form">

        <h1 id="formTitle">
          تسجيل الدخول
        </h1>

        <p class="subtitle" id="formSubtitle">
          سجل دخولك وكمل رحلتك مع BodyReset.
        </p>


        <!-- Login / Signup -->
        <div class="switch">

          <button
            id="loginTab"
            class="active"
            type="button"
            onclick="showLogin()">
            تسجيل الدخول
          </button>

          <button
            id="signupTab"
            type="button"
            onclick="showSignup()">
            إنشاء حساب
          </button>

        </div>


        <!-- Email -->
        <div class="input-group">

          <label for="email">
            البريد الإلكتروني
          </label>

          <div class="input-wrapper">

            <input
              id="email"
              type="email"
              placeholder="example@email.com"
              autocomplete="email">

          </div>

        </div>


        <!-- Password -->
        <div class="input-group">

          <label for="password">
            كلمة المرور
          </label>

          <div class="input-wrapper">

            <input
              id="password"
              type="password"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password">

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword()"
              id="passwordToggle">
              إظهار
            </button>

          </div>

        </div>


        <!-- Main Button -->
        <button
          class="main-btn"
          id="mainBtn"
          type="button"
          onclick="handleAuth()">
          تسجيل الدخول
        </button>


        <!-- Divider -->
        <div class="divider">
          أو
        </div>


        <!-- Google -->
        <button
          class="social-btn google-btn"
          type="button"
          onclick="loginWithGoogle()">

          <svg
            class="google-logo"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">

            <path
              fill="#4285F4"
              d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.64z"/>

            <path
              fill="#34A853"
              d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.87-3c-1.07.72-2.44 1.15-4.06 1.15-3.12 0-5.76-2.11-6.7-4.95H1.3v3.09A12 12 0 0 0 12 24z"/>

            <path
              fill="#FBBC05"
              d="M5.3 14.3A7.2 7.2 0 0 1 4.92 12c0-.8.14-1.58.38-2.3V6.61H1.3A12 12 0 0 0 0 12c0 1.94.46 3.78 1.3 5.39l4-3.09z"/>

            <path
              fill="#EA4335"
              d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.94 1.08 15.24 0 12 0A12 12 0 0 0 1.3 6.61l4 3.09c.94-2.84 3.58-4.95 6.7-4.95z"/>

          </svg>

          Continue with Google

        </button>


        <!-- Apple -->
        <button
          class="social-btn apple-btn"
          type="button"
          onclick="loginWithApple()">

          <svg
            class="apple-logo"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">

            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.39 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.52 4.09zM12.03 7.25C11.88 5.02 13.69 3.18 15.75 3c.29 2.58-2.34 4.5-3.72 4.25z"/>

          </svg>

          Continue with Apple

        </button>


        <!-- Message -->
        <div
          id="message"
          class="message">
        </div>


        <div class="bottom-text">
          BodyReset — طريقك لحياة صحية أفضل
        </div>

      </div>

    </div>

  </main>


  <!-- Supabase -->
  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    const supabase = createClient(
      "https://byodeoaluspphqduxmlh.supabase.co",
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92"
    );


    let isSignup = false;


    window.showLogin = function(){

      isSignup = false;

      document.getElementById("loginTab").classList.add("active");
      document.getElementById("signupTab").classList.remove("active");

      document.getElementById("formTitle").textContent =
        "تسجيل الدخول";

      document.getElementById("formSubtitle").textContent =
        "سجل دخولك وكمل رحلتك مع BodyReset.";

      document.getElementById("mainBtn").textContent =
        "تسجيل الدخول";

      document.getElementById("password").autocomplete =
        "current-password";

      clearMessage();
    };


    window.showSignup = function(){

      isSignup = true;

      document.getElementById("signupTab").classList.add("active");
      document.getElementById("loginTab").classList.remove("active");

      document.getElementById("formTitle").textContent =
        "إنشاء حساب";

      document.getElementById("formSubtitle").textContent =
        "أنشئ حسابك وابدأ رحلتك مع BodyReset.";

      document.getElementById("mainBtn").textContent =
        "إنشاء الحساب";

      document.getElementById("password").autocomplete =
        "new-password";

      clearMessage();
    };


    window.togglePassword = function(){

      const password =
        document.getElementById("password");

      const toggle =
        document.getElementById("passwordToggle");

      if(password.type === "password"){

        password.type = "text";
        toggle.textContent = "إخفاء";

      }else{

        password.type = "password";
        toggle.textContent = "إظهار";

      }

    };


    function showMessage(text, type){

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage(){

      const message =
        document.getElementById("message");

      message.textContent = "";
      message.className = "message";

    }


    window.handleAuth = async function(){

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if(!email || !password){

        showMessage(
          "اكتب البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;
      }


      if(password.length < 6){

        showMessage(
          "كلمة المرور لازم تكون 6 أحرف على الأقل.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById("mainBtn");

      button.disabled = true;

      button.textContent =
        isSignup ? "جاري إنشاء الحساب..." : "جاري تسجيل الدخول...";


      try{

        if(isSignup){

          const { data, error } =
            await supabase.auth.signUp({

              email: email,

              password: password,

              options:{
                emailRedirectTo:
                  "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html"
              }

            });


          if(error) throw error;


          if(data.user && !data.session){

            showMessage(
              "تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب.",
              "success"
            );

          }else{

            window.location.href =
              "dashboard.html";

          }

        }else{

          const { error } =
            await supabase.auth.signInWithPassword({

              email: email,

              password: password

            });


          if(error) throw error;


          window.location.href =
            "dashboard.html";

        }

      }catch(error){

        showMessage(
          error.message || "حدث خطأ، حاول مرة أخرى.",
          "error"
        );

      }finally{

        button.disabled = false;

        button.textContent =
          isSignup ? "إنشاء الحساب" : "تسجيل الدخول";

      }

    };


    window.loginWithGoogle = async function(){

      try{

        const { error } =
          await supabase.auth.signInWithOAuth({

            provider:"google",

            options:{
              redirectTo:
                "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"
            }

          });


        if(error) throw error;

      }catch(error){

        showMessage(
          error.message || "تعذر تسجيل الدخول باستخدام Google.",
          "error"
        );

      }

    };


    window.loginWithApple = async function(){

      try{

        const { error } =
          await supabase.auth.signInWithOAuth({

            provider:"apple",

            options:{
              redirectTo:
                "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"
            }

          });


        if(error) throw error;

      }catch(error){

        showMessage(
          error.message || "تعذر تسجيل الدخول باستخدام Apple.",
          "error"
        );

      }

    };


    /* Enter key */
    document.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Enter"){

          window.handleAuth();

        }

      }
    );

  </script>

</body>
  </html>
