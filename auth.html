<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset | تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #131a22;
      border: 1px solid #26313c;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #39e75f;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #b9c2cc;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #34404d;
      background: #0b0f14;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #39e75f;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 30px;
      background: #39e75f;
      color: #07100a;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #aeb8c2;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #39e75f;
      font-size: inherit;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      color: #39e75f;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <span>Body</span>Reset
    </div>

    <h1 id="title">إنشاء حساب</h1>

    <form id="authForm">

      <label for="email">البريد الإلكتروني</label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        placeholder="••••••••"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">
        إنشاء حساب
      </button>

    </form>

    <div class="switch">

      <span id="switchText">
        لديك حساب بالفعل؟
      </span>

      <button type="button" id="switchBtn">
        تسجيل الدخول
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>

  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";
      

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form =
      document.getElementById("authForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const switchBtn =
      document.getElementById("switchBtn");

    const title =
      document.getElementById("title");

    const submitBtn =
      document.getElementById("submitBtn");

    const switchText =
      document.getElementById("switchText");

    let isLogin = false;

    switchBtn.addEventListener("click", () => {

      isLogin = !isLogin;

      if (isLogin) {

        title.textContent = "تسجيل الدخول";

        submitBtn.textContent = "تسجيل الدخول";

        switchText.textContent =
          "ليس لديك حساب؟";

        switchBtn.textContent =
          "إنشاء حساب";

      } else {

        title.textContent = "إنشاء حساب";

        submitBtn.textContent = "إنشاء حساب";

        switchText.textContent =
          "لديك حساب بالفعل؟";

        switchBtn.textContent =
          "تسجيل الدخول";
      }

      message.textContent = "";

    });

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent =
        "جاري المعالجة...";

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;

      let result;

      if (isLogin) {

        result =
          await supabase.auth.signInWithPassword({
            email: userEmail,
            password: userPassword
          });

      } else {

        result =
          await supabase.auth.signUp({
            email: userEmail,
            password: userPassword
          });

      }

      if (result.error) {

        message.textContent =
          result.error.message;

        return;
      }

      if (isLogin) {

        message.textContent =
          "تم تسجيل الدخول بنجاح ✅";

        window.location.href =
          "dashboard.html";

      } else {

        message.textContent =
          "تم إنشاء الحساب بنجاح. راجع بريدك الإلكتروني لتأكيد الحساب.";

        form.reset();
      }

    });

  </script>

</body>
</html>
