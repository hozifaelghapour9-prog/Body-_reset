<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BodyReset - Login</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial, sans-serif;
}

body{
background:#f5f7fa;
color:#071a33;
min-height:100vh;
}

header{
height:70px;
background:#071a33;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.logo{
font-size:25px;
font-weight:bold;
}

.home-btn{
background:white;
color:#071a33;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.container{
width:100%;
max-width:500px;
margin:50px auto;
padding:20px;
}

.card{
background:white;
border-radius:18px;
padding:35px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
text-align:center;
margin-bottom:25px;
color:#071a33;
}

h2{
margin-bottom:20px;
color:#071a33;
}

.form-group{
margin-bottom:16px;
}

label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

input,
select{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus,
select:focus{
border-color:#082F49;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:70px;
}

.show-password{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
cursor:pointer;
color:#082F49;
font-weight:bold;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#082F49;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:8px;
}

.btn:hover{
background:#0b4568;
}

.switch{
text-align:center;
margin-top:20px;
}

.switch button{
border:none;
background:none;
color:#082F49;
font-weight:bold;
cursor:pointer;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
min-height:20px;
}

.forgot{
display:none;
width:100%;
border:none;
background:none;
color:#dc2626;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.hidden{
display:none;
}

@media(max-width:600px){

header{
padding:0 15px;
}

.logo{
font-size:21px;
}

.container{
margin:25px auto;
padding:15px;
}

.card{
padding:25px 20px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
BodyReset
</div>

<a
href="index.html"
class="home-btn">
Home
</a>

</header>


<div class="container">

<div class="card">

<h1>BodyReset</h1>


<!-- LOGIN -->

<div id="loginSection">

<h2>Login</h2>


<div class="form-group">

<label for="loginUsername">
Username
</label>

<input
type="text"
id="loginUsername"
placeholder="Enter your username"
autocomplete="username">

</div>


<div class="form-group">

<label for="loginPassword">
Password
</label>

<div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
autocomplete="current-password">

<button
type="button"
class="show-password"
onclick="togglePassword('loginPassword',this)">
Show
</button>

</div>

</div>


<button
class="btn"
onclick="loginUser()">
Login
</button>


<button
id="forgotButton"
class="forgot"
onclick="forgotPassword()">
Forgot your password?
</button>


<div
id="loginMessage"
class="message">
</div>


<div class="switch">

Don't have an account?

<button onclick="showSignup()">
Create Account
</button>

</div>

</div>


<!-- SIGNUP -->

<div
id="signupSection"
class="hidden">

<h2>Create Account</h2>


<div class="form-group">

<label for="signupUsername">
Username
</label>

<input
type="text"
id="signupUsername"
placeholder="Choose a username">

</div>


<div class="form-group">

<label for="signupEmail">
Email
</label>

<input
type="email"
id="signupEmail"
placeholder="Enter your email">

</div>


<div class="form-group">

<label for="signupPhone">
Phone
</label>

<input
type="tel"
id="signupPhone"
placeholder="Enter your phone number">

</div>


<div class="form-group">

<label for="signupAge">
Age
</label>

<input
type="number"
id="signupAge"
placeholder="Enter your age">

</div>


<div class="form-group">

<label for="signupGender">
Gender
</label>

<select id="signupGender">

<option value="">
Select gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

</div>


<div class="form-group">

<label for="signupPassword">
Password
</label>

<div class="password-box">

<input
type="password"
id="signupPassword"
placeholder="Create a password">

<button
type="button"
class="show-password"
onclick="togglePassword('signupPassword',this)">
Show
</button>

</div>

</div>


<button
class="btn"
onclick="createAccount()">
Create Account
</button>


<div
id="signupMessage"
class="message">
</div>


<div class="switch">

Already have an account?

<button onclick="showLogin()">
Login
</button>

</div>

</div>

</div>

</div>


<script type="module">

import {
createClient
}
from
"https://esm.sh/@supabase/supabase-js@2";



/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://byodeoaluspphqduxmlh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* =========================
   SELECTED PLAN
========================= */

const urlParams =
new URLSearchParams(
window.location.search
);

const selectedPlan =
urlParams.get("plan");



/* =========================
   GO TO DASHBOARD
========================= */

function goAfterAuth(){

console.log("GOING TO DASHBOARD");

if(selectedPlan){

window.location.replace(
"dashboard.html?plan=" +
encodeURIComponent(selectedPlan)
);

}else{

window.location.replace(
"dashboard.html"
);

}

}



/* =========================
   SHOW LOGIN
========================= */

window.showLogin =
function(){

document
.getElementById("loginSection")
.classList
.remove("hidden");

document
.getElementById("signupSection")
.classList
.add("hidden");

};



/* =========================
   SHOW SIGNUP
========================= */

window.showSignup =
function(){

document
.getElementById("loginSection")
.classList
.add("hidden");

document
.getElementById("signupSection")
.classList
.remove("hidden");

};



/* =========================
   TOGGLE PASSWORD
========================= */

window.togglePassword =
function(inputId,button){

const input =
document.getElementById(inputId);

if(input.type === "password"){

input.type = "text";

button.textContent = "Hide";

}else{

input.type = "password";

button.textContent = "Show";

}

};



/* =========================
   CREATE ACCOUNT
========================= */

window.createAccount =
async function(){

const username =
document
.getElementById("signupUsername")
.value
.trim();

const email =
document
.getElementById("signupEmail")
.value
.trim();

const phone =
document
.getElementById("signupPhone")
.value
.trim();

const age =
document
.getElementById("signupAge")
.value
.trim();

const gender =
document
.getElementById("signupGender")
.value;

const password =
document
.getElementById("signupPassword")
.value;

const message =
document
.getElementById("signupMessage");


message.style.color =
"#071a33";



/* VALIDATION */

if(
!username ||
!email ||
!phone ||
!age ||
!gender ||
!password
){

message.style.color =
"#dc2626";

message.textContent =
"Please fill in all fields.";

return;

}


if(password.length < 6){

message.style.color =
"#dc2626";

message.textContent =
"Password must be at least 6 characters.";

return;

}


if(phone.length < 8){

message.style.color =
"#dc2626";

message.textContent =
"Please enter a valid phone number.";

return;

}



message.textContent =
"Creating your account...";



try{


/* CHECK USERNAME */

const {
data:usernameData,
error:usernameError
} =
await supabase.rpc(
"get_email_by_username",
{
username_input:username
}
);


if(usernameError){

console.error(
"Username check error:",
usernameError
);

message.style.color =
"#dc2626";

message.textContent =
"Username check failed: " +
usernameError.message;

return;

}


if(
usernameData &&
usernameData.length > 0
){

message.style.color =
"#dc2626";

message.textContent =
"Username already exists.";

return;

}



/* SIGN UP */

const {
data,
error
} =
await supabase.auth.signUp({

email:email,

password:password,

options:{
data:{
username:username,
phone:phone,
age:age,
gender:gender
}
}

});


if(error){

console.error(
"Signup error:",
error
);

message.style.color =
"#dc2626";

message.textContent =
error.message;

return;

}


console.log(
"SIGNUP RESPONSE:",
data
);



/* SESSION ALREADY EXISTS */

if(data && data.session){

message.style.color =
"#16a34a";

message.textContent =
"Account created successfully.";

goAfterAuth();

return;

}



/* CHECK SESSION */

const {
data:sessionData,
error:sessionError
} =
await supabase.auth.getSession();


console.log(
"SESSION AFTER SIGNUP:",
sessionData?.session
);


if(sessionError){

console.error(
"Session error:",
sessionError
);

}


if(sessionData?.session){

message.style.color =
"#16a34a";

message.textContent =
"Account created successfully.";

goAfterAuth();

return;

}



/* EMAIL CONFIRMATION */

message.style.color =
"#16a34a";

message.textContent =
"Account created. Please check your email to confirm your account.";

}catch(error){

console.error(
"CREATE ACCOUNT ERROR:",
error
);

message.style.color =
"#dc2626";

message.textContent =
error.message ||
"Something went wrong.";

}

};



/* =========================
   LOGIN
========================= */

window.loginUser =
async function(){

const username =
document
.getElementById("loginUsername")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const message =
document
.getElementById("loginMessage");

const forgotButton =
document
.getElementById("forgotButton");


forgotButton.style.display =
"none";


message.style.color =
"#071a33";



if(!username || !password){

message.style.color =
"#dc2626";

message.textContent =
"Please enter username and password.";

return;

}


message.textContent =
"Checking username...";



try{


/* =========================
   GET EMAIL FROM USERNAME
========================= */

const {
data:emailData,
error:emailError
} =
await supabase.rpc(
"get_email_by_username",
{
username_input:username
}
);


console.log(
"USERNAME LOOKUP:",
emailData,
emailError
);



if(emailError){

console.error(
"Username lookup error:",
emailError
);

message.style.color =
"#dc2626";

message.textContent =
"Username lookup error: " +
emailError.message;

return;

}



let email = null;



/*
   RPC can return either:
   - a string
   - an object
   - an array
*/

if(typeof emailData === "string"){

email = emailData;

}else if(
Array.isArray(emailData)
){

if(emailData.length > 0){

if(typeof emailData[0] === "string"){

email =
emailData[0];

}else if(
emailData[0]?.email
){

email =
emailData[0].email;

}

}

}else if(emailData?.email){

email =
emailData.email;

}



if(!email){

message.style.color =
"#dc2626";

message.textContent =
"Username not found.";

return;

}



console.log(
"EMAIL FOUND:",
email
);



/* =========================
   LOGIN
========================= */

message.style.color =
"#071a33";

message.textContent =
"Logging in...";


const {
data,
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


console.log(
"LOGIN RESPONSE:",
data,
error
);



if(error){

console.error(
"LOGIN ERROR:",
error
);

message.style.color =
"#dc2626";

message.textContent =
error.message;

forgotButton.style.display =
"block";

return;

}



/* =========================
   CHECK SESSION DIRECTLY
========================= */

console.log(
"LOGIN RESPONSE SESSION:",
data?.session
);


if(data && data.session){

console.log(
"LOGIN SUCCESS - SESSION EXISTS"
);

goAfterAuth();

return;

}



/* =========================
   WAIT FOR SESSION
========================= */

message.style.color =
"#071a33";

message.textContent =
"Checking login session...";


let sessionFound =
false;


for(
let i = 0;
i < 10;
i++
){

const {
data:checkData,
error:checkError
} =
await supabase.auth.getSession();


console.log(
"SESSION CHECK",
i + 1,
checkData?.session
);


if(checkError){

console.error(
"SESSION CHECK ERROR:",
checkError
);

}


if(
checkData &&
checkData.session
){

sessionFound =
true;

break;

}


await new Promise(
function(resolve){

setTimeout(
resolve,
300
);

}
);

}



if(sessionFound){

console.log(
"SESSION FOUND"
);

goAfterAuth();

return;

}



message.style.color =
"#dc2626";

message.textContent =
"Login succeeded, but the session could not be saved. Please try again.";


}catch(error){

console.error(
"LOGIN EXCEPTION:",
error
);

message.style.color =
"#dc2626";

message.textContent =
error.message ||
"Something went wrong.";

}

};



/* =========================
   FORGOT PASSWORD
========================= */

window.forgotPassword =
function(){

window.location.href =
"forgot-password.html";

};



/* =========================
   AUTH STATE
========================= */

supabase.auth.onAuthStateChange(
function(event,session){

console.log(
"AUTH EVENT:",
event,
session
);


if(event === "SIGNED_OUT"){

console.log(
"User signed out."
);

}

});



/* =========================
   INITIAL SESSION CHECK
========================= */

(async function(){

try{

const {
data,
error
} =
await supabase.auth.getSession();


console.log(
"INITIAL AUTH SESSION:",
data?.session
);

console.log(
"INITIAL AUTH ERROR:",
error
);

}catch(error){

console.error(
"INITIAL SESSION ERROR:",
error
);

}

})();

</script>

</body>

   </html>
