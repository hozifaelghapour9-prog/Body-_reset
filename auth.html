<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset | تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #131a22;
      border: 1px solid #26313c;
      border-radius: 24px;
      padding: 30px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #39e75f;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #b9c2cc;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #34404d;
      border-radius: 12px;
      background: #0b0f14;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 25px;
      background: #39e75f;
      color: #07100a;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #aeb8c2;
    }

    #switchBtn {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #39e75f;
      font-size: 16px;
    }

    #message {
      min-height: 25px;
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <span>Body</span>Reset
    </div>

    <h1 id="title">إنشاء حساب</h1>

    <form id="authForm">

      <label for="email">البريد الإلكتروني</label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        placeholder="••••••••"
        minlength="6"
        required
      >

      <button id="submitBtn" type="submit">
        إنشاء حساب
      </button>

    </form>

    <div class="switch">
      <span id="switchText">لديك حساب بالفعل؟</span>

      <button id="switchBtn" type="button">
        تسجيل الدخول
      </button>
    </div>

    <div id="message"></div>

  </div>

  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form =
      document.getElementById("authForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const title =
      document.getElementById("title");

    const submitBtn =
      document.getElementById("submitBtn");

    const switchBtn =
      document.getElementById("switchBtn");

    const switchText =
      document.getElementById("switchText");

    let loginMode = false;

    switchBtn.addEventListener("click", () => {

      loginMode = !loginMode;

      message.textContent = "";

      if (loginMode) {

        title.textContent = "تسجيل الدخول";

        submitBtn.textContent = "تسجيل الدخول";

        switchText.textContent =
          "ليس لديك حساب؟";

        switchBtn.textContent =
          "إنشاء حساب";

      } else {

        title.textContent = "إنشاء حساب";

        submitBtn.textContent = "إنشاء حساب";

        switchText.textContent =
          "لديك حساب بالفعل؟";

        switchBtn.textContent =
          "تسجيل الدخول";
      }

    });

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent = "جاري المعالجة...";

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;

      if (loginMode) {

        const { error } =
          await supabase.auth.signInWithPassword({
            email: userEmail,
            password: userPassword
          });

        if (error) {

          message.textContent =
            error.message;

          return;
        }

        message.textContent =
          "تم تسجيل الدخول بنجاح ✅";

        window.location.href =
          "dashboard.html";

      } else {

        const { data, error } =
          await supabase.auth.signUp({
            email: userEmail,
            password: userPassword
          });

        if (error) {

          message.textContent =
            error.message;

          return;
        }

        if (data.user) {

          message.textContent =
            "تم إنشاء الحساب بنجاح. راجع بريدك الإلكتروني لتأكيد الحساب.";

          form.reset();
        }

      }

    });

  </script>

</body>
</html>ر
