<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset | إنشاء حساب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #131a22;
      border: 1px solid #26313c;
      border-radius: 24px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #39e75f;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #b9c2cc;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #34404d;
      border-radius: 12px;
      background: #0b0f14;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 30px;
      background: #39e75f;
      color: #07100a;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <span>Body</span>Reset
    </div>

    <h1>إنشاء حساب</h1>

    <form id="signupForm">

      <label for="email">البريد الإلكتروني</label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        minlength="6"
        placeholder="••••••••"
        required
      >

      <button type="submit">
        إنشاء حساب
      </button>

    </form>
<button type="button" id="loginBtn">تسجيل الدخول</button>
    <div id="message"></div>

  </div>

  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form =
      document.getElementById("signupForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent =
        "جاري إنشاء الحساب...";

      const { data, error } =
        await supabase.auth.signUp({
          email: email.value.trim(),
          password: password.value
        });

      if (error) {

        message.textContent =
          error.message;

        return;
      }

      if (data.user) {

        message.textContent =
          "تم إنشاء الحساب بنجاح. راجع بريدك الإلكتروني لتأكيد الحساب.";

        form.reset();
      }

    });
const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {
  message.textContent = "جاري تسجيل الدخول...";

  const { error } = await supabase.auth.signInWithPassword({
    email: email.value.trim(),
    password: password.value
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent = "تم تسجيل الدخول بنجاح ✅";

  window.location.href = "dashboard.html";
});
  </script>

</body>
</html>
