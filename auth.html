<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Auth</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f1f5f9;
      color:#071a33;
      min-height:100vh;
    }

    header{
      background:#071a33;
      padding:22px 7%;
    }

    .top-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      color:white;
      font-size:30px;
      font-weight:bold;
    }

    .logo span{
      color:#2563eb;
    }

    .home-link{
      color:white;
      text-decoration:none;
      font-size:17px;
      font-weight:bold;
    }

    .auth-section{
      min-height:calc(100vh - 85px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:45px 20px;
    }

    .auth-box{
      width:100%;
      max-width:1050px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 15px 45px rgba(7,26,51,.15);
    }

    .auth-image{
      min-height:620px;
      background:
        linear-gradient(
          rgba(7,26,51,.35),
          rgba(7,26,51,.55)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=85")
        center/cover;
      display:flex;
      align-items:flex-end;
      padding:45px;
      color:white;
    }

    .image-content h2{
      font-size:38px;
      margin-bottom:12px;
      line-height:1.3;
    }

    .image-content p{
      font-size:18px;
      line-height:1.8;
      max-width:400px;
    }

    .auth-form{
      padding:45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .form-title{
      font-size:32px;
      font-weight:bold;
      margin-bottom:25px;
      color:#071a33;
    }

    .signup-title{
      display:none;
    }

    .input-group{
      margin-bottom:17px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:16px;
      font-weight:bold;
      color:#071a33;
      text-align:left;
    }

    .input-wrapper{
      position:relative;
    }

    .input-wrapper input,
    .input-wrapper select{
      width:100%;
      height:52px;
      background:white;
      color:#071a33;
      border:2px solid #071a33;
      border-radius:9px;
      padding:0 15px;
      font-size:16px;
      outline:none;
      text-align:left;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .password-toggle{
      position:absolute;
      right:14px;
      left:auto;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      color:#071a33;
      cursor:pointer;
      font-size:13px;
      font-weight:bold;
    }

    .signup-fields{
      display:none;
    }

    .signup-fields.active{
      display:block;
    }

    .two-fields{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .main-btn{
      width:100%;
      height:54px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    .main-btn:hover{
      background:#102a4a;
    }

    .switch-account{
      text-align:center;
      margin:18px 0 4px;
      color:#64748b;
      font-size:15px;
    }

    .switch-account button{
      border:none;
      background:none;
      color:#2563eb;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:23px 0 17px;
      color:#94a3b8;
      font-size:14px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#cbd5e1;
    }

    .social-btn{
      width:100%;
      height:52px;
      border-radius:9px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:12px;
      transition:.2s;
    }

    .google-btn,
    .apple-btn{
      background:#071a33;
      color:white;
      border:2px solid #071a33;
    }

    .google-btn:hover,
    .apple-btn:hover{
      background:#102a4a;
    }

    .google-logo{
      width:20px;
      height:20px;
    }

    .apple-logo{
      width:21px;
      height:21px;
      fill:white;
    }

    .message{
      min-height:24px;
      text-align:center;
      margin-top:10px;
      font-size:14px;
      line-height:1.6;
    }

    .success{
      color:#15803d;
    }

    .error{
      color:#dc2626;
    }

    @media(max-width:800px){

      .auth-box{
        grid-template-columns:1fr;
      }

      .auth-image{
        min-height:260px;
        padding:30px;
      }

      .image-content h2{
        font-size:28px;
      }

      .image-content p{
        font-size:16px;
      }

      .auth-form{
        padding:32px 24px;
      }
    }

    @media(max-width:500px){

      header{
        padding:19px 5%;
      }

      .logo{
        font-size:25px;
      }

      .home-link{
        font-size:15px;
      }

      .auth-section{
        padding:25px 12px;
      }

      .auth-form{
        padding:28px 20px;
      }

      .form-title{
        font-size:27px;
      }

      .two-fields{
        grid-template-columns:1fr;
        gap:0;
      }

      .auth-image{
        min-height:220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top-header">
    <div class="logo">
      Body<span>Reset</span>
    </div>

    <a href="index.html" class="home-link">
      Home
    </a>
  </div>
</header>


<main class="auth-section">

  <div class="auth-box">

    <!-- IMAGE -->
    <div class="auth-image">

      <div class="image-content">

        <h2>
          ابدأ تغيير جسمك
        </h2>

        <p>
          التزم بخطتك، تابع تقدمك، وابني نظام حياة صحي يناسب هدفك.
        </p>

      </div>

    </div>


    <!-- FORM -->
    <div class="auth-form">

      <!-- LOGIN -->
      <div id="loginForm">

        <div class="form-title">
          Login
        </div>


        <div class="input-group">

          <label for="loginUsername">
            Username
          </label>

          <div class="input-wrapper">

            <input
              id="loginUsername"
              type="text"
              placeholder="Enter your username"
              autocomplete="username">

          </div>

        </div>


        <div class="input-group">

          <label for="loginPassword">
            Password
          </label>

          <div class="input-wrapper">

            <input
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password">

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('loginPassword','loginShow')"
              id="loginShow">

              Show

            </button>

          </div>

        </div>


        <button
          class="main-btn"
          type="button"
          onclick="loginUser()">

          Login

        </button>


        <div class="switch-account">

          Don't have an account?

          <button
            type="button"
            onclick="showSignup()">

            Sign up

          </button>

        </div>


        <div class="divider">
          OR
        </div>


        <button
          class="social-btn google-btn"
          type="button"
          onclick="loginWithGoogle()">

          <svg
            class="google-logo"
            viewBox="0 0 24 24">

            <path
              fill="white"
              d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.64z"/>

            <path
              fill="white"
              d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.87-3c-1.07.72-2.44 1.15-4.06 1.15-3.12 0-5.76-2.11-6.7-4.95H1.3v3.09A12 12 0 0 0 12 24z"/>

            <path
              fill="white"
              d="M5.3 14.3A7.2 7.2 0 0 1 4.92 12c0-.8.14-1.58.38-2.3V6.61H1.3A12 12 0 0 0 0 12c0 1.94.46 3.78 1.3 5.39l4-3.09z"/>

            <path
              fill="white"
              d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.94 1.08 15.24 0 12 0A12 12 0 0 0 1.3 6.61l4 3.09c.94-2.84 3.58-4.95 6.7-4.95z"/>

          </svg>

          Continue with Google

        </button>


        <button
          class="social-btn apple-btn"
          type="button"
          onclick="loginWithApple()">

          <svg
            class="apple-logo"
            viewBox="0 0 24 24">

            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.39 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.52 4.09zM12.03 7.25C11.88 5.02 13.69 3.18 15.75 3c.29 2.58-2.34 4.5-3.72 4.25z"/>

          </svg>

          Continue with Apple

        </button>

      </div>


      <!-- SIGN UP -->
      <div id="signupForm" style="display:none;">

        <div class="form-title">
          Create Account
        </div>


        <div class="signup-fields active">

          <!-- Full Name -->
          <div class="input-group">

            <label for="fullName">
              Full Name
            </label>

            <div class="input-wrapper">

              <input
                id="fullName"
                type="text"
                placeholder="Enter your full name">

            </div>

          </div>


          <!-- Username -->
          <div class="input-group">

            <label for="username">
              Username
            </label>

            <div class="input-wrapper">

              <input
                id="username"
                type="text"
                placeholder="Choose a username">

            </div>

          </div>


          <!-- Age + Gender -->
          <div class="two-fields">

            <div class="input-group">

              <label for="age">
                Age
              </label>

              <div class="input-wrapper">

                <input
                  id="age"
                  type="number"
                  min="13"
                  max="100"
                  placeholder="Age">

              </div>

            </div>


            <div class="input-group">

              <label for="gender">
                Gender
              </label>

              <div class="input-wrapper">

                <select id="gender">

                  <option value="">
                    Select
                  </option>

                  <option value="male">
                    Male
                  </option>

                  <option value="female">
                    Female
                  </option>

                </select>

              </div>

            </div>

          </div>


          <!-- Height + Weight -->
          <div class="two-fields">

            <div class="input-group">

              <label for="height">
                Height (cm)
              </label>

              <div class="input-wrapper">

                <input
                  id="height"
                  type="number"
                  placeholder="Height">

              </div>

            </div>


            <div class="input-group">

              <label for="weight">
                Weight (kg)
              </label>

              <div class="input-wrapper">

                <input
                  id="weight"
                  type="number"
                  placeholder="Weight">

              </div>

            </div>

          </div>


          <!-- Email -->
          <div class="input-group">

            <label for="signupEmail">
              Email
            </label>

            <div class="input-wrapper">

              <input
                id="signupEmail"
                type="email"
                placeholder="Enter your email"
                autocomplete="email">

            </div>

          </div>


          <!-- Password -->
          <div class="input-group">

            <label for="signupPassword">
              Password
            </label>

            <div class="input-wrapper">

              <input
                id="signupPassword"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password">

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('signupPassword','signupShow')"
                id="signupShow">

                Show

              </button>

            </div>

          </div>


          <!-- Confirm Password -->
          <div class="input-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <div class="input-wrapper">

              <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                autocomplete="new-password">

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword','confirmShow')"
                id="confirmShow">

                Show

              </button>

            </div>

          </div>

        </div>


        <button
          class="main-btn"
          type="button"
          onclick="createAccount()">

          Create Account

        </button>


        <div class="switch-account">

          Already have an account?

          <button
            type="button"
            onclick="showLogin()">

            Login

          </button>

        </div>

      </div>


      <div
        id="message"
        class="message">
      </div>

    </div>

  </div>

</main>


<script type="module">

  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";


  const supabase = createClient(
    "https://byodeoaluspphqduxmlh.supabase.co",
    "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92"
  );


  function showMessage(text,type){

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function clearMessage(){

    const message =
      document.getElementById("message");

    message.textContent = "";

    message.className = "message";

  }


  window.showSignup = function(){

    document.getElementById("loginForm").style.display =
      "none";

    document.getElementById("signupForm").style.display =
      "block";

    clearMessage();

  };


  window.showLogin = function(){

    document.getElementById("signupForm").style.display =
      "none";

    document.getElementById("loginForm").style.display =
      "block";

    clearMessage();

  };


  window.togglePassword = function(inputId,buttonId){

    const input =
      document.getElementById(inputId);

    const button =
      document.getElementById(buttonId);


    if(input.type === "password"){

      input.type = "text";

      button.textContent = "Hide";

    }else{

      input.type = "password";

      button.textContent = "Show";

    }

  };


  window.createAccount = async function(){

    const fullName =
      document.getElementById("fullName").value.trim();

    const username =
      document.getElementById("username").value.trim();

    const age =
      document.getElementById("age").value;

    const gender =
      document.getElementById("gender").value;

    const height =
      document.getElementById("height").value;

    const weight =
      document.getElementById("weight").value;

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if(
      !fullName ||
      !username ||
      !age ||
      !gender ||
      !height ||
      !weight ||
      !email ||
      !password ||
      !confirmPassword
    ){

      showMessage(
        "Please fill in all fields.",
        "error"
      );

      return;

    }


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    if(password !== confirmPassword){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    try{

      const { data, error } =
        await supabase.auth.signUp({

          email:email,

          password:password,

          options:{
            emailRedirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html",

            data:{
              full_name:fullName,
              username:username,
              age:Number(age),
              gender:gender,
              height:Number(height),
              weight:Number(weight)
            }

          }

        });


      if(error) throw error;


      if(data.user && !data.session){

        showMessage(
          "Account created. Check your email to confirm your account.",
          "success"
        );

      }else{

        window.location.href =
          "dashboard.html";

      }


    }catch(error){

      showMessage(
        error.message ||
        "Something went wrong. Please try again.",
        "error"
      );

    }

  };


  window.loginUser = async function(){

    const username =
      document.getElementById("loginUsername").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if(!username || !password){

      showMessage(
        "Please enter your username and password.",
        "error"
      );

      return;

    }


    /*
      مؤقتًا:
      Supabase Auth يحتاج Email للدخول.
      لذلك Username هنا لن يتمكن من تسجيل الدخول
      حتى نربطه بقاعدة البيانات.
    */

    showMessage(
      "Username login will be connected to the database next.",
      "error"
    );

  };


  window.loginWithGoogle = async function(){

    try{

      const { error } =
        await supabase.auth.signInWithOAuth({

          provider:"google",

          options:{
            redirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"
          }

        });


      if(error) throw error;

    }catch(error){

      showMessage(
        error.message ||
        "Unable to continue with Google.",
        "error"
      );

    }

  };


  window.loginWithApple = async function(){

    try{

      const { error } =
        await supabase.auth.signInWithOAuth({

          provider:"apple",

          options:{
            redirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"
          }

        });


      if(error) throw error;

    }catch(error){

      showMessage(
        error.message ||
        "Unable to continue with Apple.",
        "error"
      );

    }

  };

</script>

</body>
  </html>
