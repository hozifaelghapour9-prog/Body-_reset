<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BodyReset | تسجيل الدخول</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
font-family:Arial,sans-serif;
}

body{
background:#eef3f8;
color:#071a33;
min-height:100vh;
}

/* HEADER */

header{
height:80px;
background:#071a33;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 7%;
}

.logo{
font-size:30px;
font-weight:bold;
color:white;
}

.logo span{
color:#2563eb;
}

.home-link{
color:white;
text-decoration:none;
font-size:16px;
font-weight:bold;
}

.home-link:hover{
color:#60a5fa;
}

/* MAIN */

.auth-page{
min-height:calc(100vh - 80px);
display:flex;
align-items:center;
justify-content:center;
padding:50px 20px;
}

.auth-wrapper{
width:100%;
max-width:1000px;
background:white;
border-radius:18px;
overflow:hidden;
display:grid;
grid-template-columns:1fr 1fr;
box-shadow:0 20px 60px rgba(7,26,51,.14);
}

/* IMAGE SIDE */

.auth-visual{
min-height:650px;

background:
linear-gradient(
rgba(7,26,51,.58),
rgba(7,26,51,.78)
),
url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85")
center/cover;

display:flex;
align-items:flex-end;
padding:45px;
color:white;
}

.visual-content{
max-width:420px;
}

.visual-content .small-title{
color:#60a5fa;
font-size:15px;
font-weight:bold;
margin-bottom:10px;
}

.visual-content h2{
font-size:42px;
line-height:1.25;
margin-bottom:15px;
}

.visual-content p{
font-size:18px;
color:#e2e8f0;
line-height:1.8;
}

/* FORM SIDE */

.auth-content{
padding:50px 45px;
display:flex;
flex-direction:column;
justify-content:center;
}

.auth-heading{
margin-bottom:28px;
}

.auth-heading h1{
font-size:34px;
margin-bottom:8px;
}

.auth-heading p{
color:#64748b;
font-size:16px;
}

/* SOCIAL */

.social-login{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:25px;
}

.social-btn{
width:100%;
height:50px;
border:1px solid #dbe3ec;
border-radius:8px;
background:white;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
font-size:16px;
font-weight:bold;
color:#071a33;
cursor:pointer;
transition:.2s;
}

.social-btn:hover{
background:#f8fafc;
border-color:#94a3b8;
}

.google-icon{
width:20px;
height:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:19px;
font-weight:bold;
color:#4285f4;
}

.apple-icon{
font-size:21px;
color:#000;
line-height:1;
}

/* DIVIDER */

.divider{
display:flex;
align-items:center;
gap:12px;
margin:5px 0 23px;
color:#94a3b8;
font-size:13px;
}

.divider::before,
.divider::after{
content:"";
height:1px;
background:#e2e8f0;
flex:1;
}

/* FORM */

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
font-size:14px;
font-weight:bold;
margin-bottom:7px;
}

.form-group input{
width:100%;
height:50px;
border:1px solid #cbd5e1;
border-radius:8px;
padding:0 15px;
font-size:16px;
outline:none;
direction:ltr;
text-align:left;
}

.form-group input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

/* PASSWORD */

.password-box{
position:relative;
}

.password-box input{
padding-left:65px;
}

.password-toggle{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
border:0;
background:none;
color:#64748b;
cursor:pointer;
font-size:13px;
}

/* SUBMIT */

.submit-btn{
width:100%;
height:50px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.submit-btn:hover{
background:#1d4ed8;
}

.submit-btn:disabled{
opacity:.7;
cursor:not-allowed;
}

/* SWITCH */

.switch{
text-align:center;
margin-top:20px;
color:#64748b;
font-size:15px;
}

.switch button{
border:0;
background:none;
color:#2563eb;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

/* MESSAGE */

.message{
min-height:22px;
margin-top:14px;
text-align:center;
font-size:14px;
color:#dc2626;
}

/* FOOTER TEXT */

.security-text{
text-align:center;
margin-top:18px;
color:#94a3b8;
font-size:12px;
}

/* MOBILE */

@media(max-width:800px){

header{
height:70px;
padding:0 5%;
}

.logo{
font-size:25px;
}

.auth-page{
padding:25px 15px;
}

.auth-wrapper{
grid-template-columns:1fr;
max-width:500px;
}

.auth-visual{
display:none;
}

.auth-content{
padding:40px 25px;
}

}

@media(max-width:500px){

.auth-heading h1{
font-size:29px;
}

.auth-content{
padding:35px 20px;
}

.social-btn{
height:48px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
Body<span>Reset</span>
</div>

<a class="home-link" href="index.html">
الرئيسية
</a>

</header>


<main class="auth-page">

<div class="auth-wrapper">


<!-- VISUAL -->

<div class="auth-visual">

<div class="visual-content">

<div class="small-title">
BODYRESET
</div>

<h2>
ابدأ رحلتك نحو جسم أقوى
</h2>

<p>
خطتك تبدأ من هنا. سجّل دخولك وابدأ بناء نظام يناسب هدفك.
</p>

</div>

</div>


<!-- AUTH -->

<div class="auth-content">

<div class="auth-heading">

<h1 id="title">
تسجيل الدخول
</h1>

<p id="subtitle">
سجّل دخولك وكمل رحلتك مع BodyReset
</p>

</div>


<!-- SOCIAL -->

<div class="social-login">

<button
class="social-btn"
id="googleBtn"
type="button">

<span class="google-icon">
G
</span>

<span>
المتابعة باستخدام Google
</span>

</button>


<button
class="social-btn"
id="appleBtn"
type="button">

<span class="apple-icon">
●
</span>

<span>
المتابعة باستخدام Apple
</span>

</button>

</div>


<!-- DIVIDER -->

<div class="divider">
أو باستخدام البريد الإلكتروني
</div>


<!-- FORM -->

<form id="authForm">


<div class="form-group">

<label for="email">
البريد الإلكتروني
</label>

<input
id="email"
type="email"
placeholder="example@email.com"
autocomplete="email"
required>

</div>


<div class="form-group">

<label for="password">
كلمة المرور
</label>

<div class="password-box">

<input
id="password"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
required>

<button
class="password-toggle"
id="passwordToggle"
type="button">

إظهار

</button>

</div>

</div>


<button
class="submit-btn"
id="submitBtn"
type="submit">

تسجيل الدخول

</button>

</form>


<div
class="message"
id="message">
</div>


<div class="switch">

<span id="switchText">
ليس لديك حساب؟
</span>

<button
id="switchBtn"
type="button">

إنشاء حساب

</button>

</div>


<div class="security-text">
بياناتك محمية ويتم تسجيل الدخول بأمان.
</div>

</div>

</div>

</main>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


const supabaseUrl =
"https://byodeoaluspphqduxmlh.supabase.co";


const supabaseKey =
"sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";


const supabase =
createClient(
supabaseUrl,
supabaseKey
);


const authForm =
document.getElementById("authForm");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const submitBtn =
document.getElementById("submitBtn");

const title =
document.getElementById("title");

const subtitle =
document.getElementById("subtitle");

const switchText =
document.getElementById("switchText");

const switchBtn =
document.getElementById("switchBtn");

const message =
document.getElementById("message");

const passwordToggle =
document.getElementById("passwordToggle");

const googleBtn =
document.getElementById("googleBtn");

const appleBtn =
document.getElementById("appleBtn");


let isSignup = false;


/* PASSWORD */

passwordToggle.addEventListener("click",()=>{

if(password.type === "password"){

password.type = "text";
passwordToggle.textContent = "إخفاء";

}else{

password.type = "password";
passwordToggle.textContent = "إظهار";

}

});


/* LOGIN / SIGNUP */

switchBtn.addEventListener("click",()=>{

isSignup = !isSignup;

message.textContent = "";

password.value = "";

if(isSignup){

title.textContent =
"إنشاء حساب";

subtitle.textContent =
"أنشئ حسابك وابدأ رحلتك مع BodyReset";

submitBtn.textContent =
"إنشاء حساب";

switchText.textContent =
"لديك حساب بالفعل؟";

switchBtn.textContent =
"تسجيل الدخول";

password.setAttribute(
"autocomplete",
"new-password"
);

}else{

title.textContent =
"تسجيل الدخول";

subtitle.textContent =
"سجّل دخولك وكمل رحلتك مع BodyReset";

submitBtn.textContent =
"تسجيل الدخول";

switchText.textContent =
"ليس لديك حساب؟";

switchBtn.textContent =
"إنشاء حساب";

password.setAttribute(
"autocomplete",
"current-password"
);

}

});


/* EMAIL AUTH */

authForm.addEventListener(
"submit",
async(event)=>{

event.preventDefault();

message.textContent = "";

submitBtn.disabled = true;

if(isSignup){

submitBtn.textContent =
"جاري إنشاء الحساب...";

}else{

submitBtn.textContent =
"جاري تسجيل الدخول...";

}


try{

if(isSignup){

const {data,error} =
await supabase.auth.signUp({

email:email.value.trim(),

password:password.value,

options:{

emailRedirectTo:
"https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html"

}

});

if(error){
throw error;
}


if(data.user){

message.style.color =
"#16a34a";

message.textContent =
"تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب.";

}

}else{

const {error} =
await supabase.auth.signInWithPassword({

email:email.value.trim(),

password:password.value

});

if(error){
throw error;
}

window.location.href =
"dashboard.html";

}

}catch(error){

message.style.color =
"#dc2626";

message.textContent =
error.message;

}finally{

submitBtn.disabled = false;

if(isSignup){

submitBtn.textContent =
"إنشاء حساب";

}else{

submitBtn.textContent =
"تسجيل الدخول";

}

}

});


/* GOOGLE */

googleBtn.addEventListener(
"click",
async()=>{

message.style.color =
"#64748b";

message.textContent =
"جاري فتح Google...";

const {error} =
await supabase.auth.signInWithOAuth({

provider:"google",

options:{

redirectTo:
"https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"

}

});

if(error){

message.style.color =
"#dc2626";

message.textContent =
error.message;

}

});


/* APPLE */

appleBtn.addEventListener(
"click",
async()=>{

message.style.color =
"#64748b";

message.textContent =
"جاري فتح Apple...";

const {error} =
await supabase.auth.signInWithOAuth({

provider:"apple",

options:{

redirectTo:
"https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"

}

});

if(error){

message.style.color =
"#dc2626";

message.textContent =
error.message;

}

});

</script>

</body>

  </html>
