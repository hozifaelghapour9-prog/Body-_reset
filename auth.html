<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #071a33;
    }

    /* HEADER */
    header {
      background: #071a33;
      padding: 20px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: rtl;
    }

    .logo {
      color: white;
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    .home {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 8px;
    }

    /* MAIN */
    main {
      padding: 0 7% 40px;
    }

    .auth-container {
      max-width: 1050px;
      min-height: 620px;
      margin: 0 auto;
      background: white;
      display: grid;
      grid-template-columns: 1fr 1fr;
      direction: ltr;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(7, 26, 51, 0.12);
    }

    /* IMAGE */
    .image-side {
      position: relative;
      width: 100%;
      min-height: 620px;
      overflow: hidden;
    }

    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(7, 26, 51, 0.78),
        rgba(7, 26, 51, 0.05)
      );
    }

    .image-text {
      position: absolute;
      bottom: 55px;
      left: 35px;
      right: 35px;
      color: white;
      direction: rtl;
      text-align: right;
    }

    .image-text h2 {
      font-size: 34px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .image-text p {
      font-size: 20px;
      line-height: 1.7;
    }

    /* FORM */
    .form-side {
      padding: 55px 45px;
      direction: rtl;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #071a33;
      direction: ltr;
      text-align: left;
    }

    /* SWITCH */
    .switch {
      font-size: 18px;
      margin-bottom: 30px;
      width: 115%;
      transform: translateX(-7%);
      text-align: center;
      direction: ltr;
    }

    .switch a {
      color: #2563eb;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    /* INPUTS */
    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #071a33;
      direction: ltr;
      text-align: left;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      color: #071a33;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
    }

    /* PASSWORD */
    .password-box {
      position: relative;
    }

    .password-box input {
      padding-left: 65px;
    }

    .show-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      direction: ltr;
    }

    /* MAIN BUTTON */
    .main-btn {
      width: 100%;
      border: none;
      background: #071a33;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #0b274b;
    }

    /* SOCIAL */
    .social-buttons {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .social-btn {
      width: 100%;
      border: none;
      background: #071a33;
      color: white;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      direction: ltr;
    }

    .social-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 50%;
      font-weight: bold;
    }

    .google-icon {
      color: #4285f4;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .apple-icon {
      color: #071a33;
      font-size: 18px;
      font-family: Arial, sans-serif;
    }

    /* SIGN UP */
    .signup-form {
      display: none;
    }

    .signup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    .signup-grid .full {
      grid-column: 1 / -1;
    }

    /* MOBILE */
    @media (max-width: 750px) {

      header {
        padding: 18px 5%;
      }

      .logo {
        font-size: 25px;
      }

      .home {
        font-size: 15px;
        padding: 8px 14px;
      }

      main {
        padding: 0 4% 25px;
      }

      .auth-container {
        grid-template-columns: 1fr;
        margin: 0 auto;
      }

      .image-side {
        min-height: 360px;
        height: 360px;
      }

      .form-side {
        padding: 40px 25px;
      }

      .image-text {
        bottom: 35px;
      }

      .image-text h2 {
        font-size: 28px;
      }

      .image-text p {
        font-size: 18px;
      }

      .signup-grid {
        grid-template-columns: 1fr;
      }

      .signup-grid .full {
        grid-column: auto;
      }

      .switch {
        width: 115%;
        transform: translateX(-7%);
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      Body<span>Reset</span>
    </div>

    <a class="home" href="index.html">
      Home
    </a>
  </header>


  <main>

    <div class="auth-container">

      <!-- IMAGE -->
      <div class="image-side">

        <img
          src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=85"
          alt="Fitness"
        >

        <div class="image-overlay"></div>

        <div class="image-text">
          <h2>ابنِ جسمًا أقوى.</h2>
          <p>ابنِ حياة صحية أفضل.</p>
        </div>

      </div>


      <!-- FORMS -->
      <div class="form-side">

        <!-- LOGIN FORM -->
        <div id="loginForm">

          <h1>Login</h1>

          <div class="switch">
            Don't have an account?
            <a onclick="showSignup()">Sign up</a>
          </div>


          <div class="form-group">
            <label>Username</label>

            <input
              id="loginUsername"
              type="text"
              placeholder="Enter your username"
            >
          </div>


          <div class="form-group">
            <label>Password</label>

            <div class="password-box">

              <input
                id="loginPassword"
                type="password"
                placeholder="Enter your password"
              >

              <span
                class="show-password"
                onclick="togglePassword('loginPassword', this)"
              >
                Show
              </span>

            </div>
          </div>


          <button
            class="main-btn"
            onclick="loginUser()"
          >
            Login
          </button>


          <!-- GOOGLE + APPLE -->
          <div class="social-buttons">

            <button
              class="social-btn"
              onclick="googleLogin()"
            >
              <span class="social-icon google-icon">
                G
              </span>

              Continue with Google
            </button>


            <button
              class="social-btn"
              onclick="appleLogin()"
            >
              <span class="social-icon apple-icon">
                
              </span>

              Continue with Apple
            </button>

          </div>

        </div>


        <!-- SIGN UP FORM -->
        <div
          id="signupForm"
          class="signup-form"
        >

          <h1>Create Account</h1>

          <div class="switch">
            Already have an account?
            <a onclick="showLogin()">Login</a>
          </div>


          <div class="signup-grid">

            <div class="form-group full">
              <label>Full Name</label>

              <input
                id="fullName"
                type="text"
                placeholder="Enter your full name"
              >
            </div>


            <div class="form-group">
              <label>Username</label>

              <input
                id="username"
                type="text"
                placeholder="Username"
              >
            </div>


            <div class="form-group">
              <label>Age</label>

              <input
                id="age"
                type="number"
                placeholder="Age"
              >
            </div>


            <div class="form-group">
              <label>Gender</label>

              <select id="gender">

                <option value="">
                  Select
                </option>

                <option value="male">
                  Male
                </option>

                <option value="female">
                  Female
                </option>

              </select>
            </div>


            <div class="form-group">
              <label>Height</label>

              <input
                id="height"
                type="number"
                placeholder="Height (cm)"
              >
            </div>


            <div class="form-group">
              <label>Weight</label>

              <input
                id="weight"
                type="number"
                placeholder="Weight (kg)"
              >
            </div>


            <div class="form-group">
              <label>Email</label>

              <input
                id="email"
                type="email"
                placeholder="Email"
              >
            </div>


            <div class="form-group">
              <label>Password</label>

              <div class="password-box">

                <input
                  id="password"
                  type="password"
                  placeholder="Password"
                >

                <span
                  class="show-password"
                  onclick="togglePassword('password', this)"
                >
                  Show
                </span>

              </div>
            </div>


            <div class="form-group full">
              <label>Confirm Password</label>

              <div class="password-box">

                <input
                  id="confirmPassword"
                  type="password"
                  placeholder="Confirm Password"
                >

                <span
                  class="show-password"
                  onclick="togglePassword('confirmPassword', this)"
                >
                  Show
                </span>

              </div>
            </div>

          </div>


          <button
            class="main-btn"
            onclick="signupUser()"
          >
            Create Account
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";

    const AUTH_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html";

    const DASHBOARD_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* SHOW SIGN UP */

    function showSignup() {

      document.getElementById("loginForm").style.display =
        "none";

      document.getElementById("signupForm").style.display =
        "block";

    }


    /* SHOW LOGIN */

    function showLogin() {

      document.getElementById("signupForm").style.display =
        "none";

      document.getElementById("loginForm").style.display =
        "block";

    }


    /* SHOW / HIDE PASSWORD */

    function togglePassword(id, element) {

      const input =
        document.getElementById(id);

      if (input.type === "password") {

        input.type = "text";

        element.textContent = "Hide";

      } else {

        input.type = "password";

        element.textContent = "Show";

      }

    }


    /* LOGIN */

    async function loginUser() {

      const username =
        document
          .getElementById("loginUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!username || !password) {

        alert(
          "Please enter username and password."
        );

        return;
      }


      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: username,

          password: password

        });


      if (error) {

        alert(error.message);

        return;
      }


      window.location.href =
        DASHBOARD_URL;

    }


    /* SIGN UP */

    async function signupUser() {

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const age =
        document.getElementById("age").value;

      const gender =
        document.getElementById("gender").value;

      const height =
        document.getElementById("height").value;

      const weight =
        document.getElementById("weight").value;

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (
        !fullName ||
        !username ||
        !age ||
        !gender ||
        !height ||
        !weight ||
        !email ||
        !password ||
        !confirmPassword
      ) {

        alert(
          "Please complete all fields."
        );

        return;
      }


      if (password !== confirmPassword) {

        alert(
          "Passwords do not match."
        );

        return;
      }


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              AUTH_URL,

            data: {

              full_name:
                fullName,

              username:
                username,

              age:
                Number(age),

              gender:
                gender,

              height:
                Number(height),

              weight:
                Number(weight)

            }

          }

        });


      if (error) {

        alert(error.message);

        return;
      }


      alert(
        "Account created successfully. Please check your email to confirm your account."
      );


      showLogin();

    }


    /* GOOGLE */

    async function googleLogin() {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              DASHBOARD_URL

          }

        });


      if (error) {

        alert(error.message);

      }

    }


    /* APPLE */

    async function appleLogin() {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({

          provider: "apple",

          options: {

            redirectTo:
              DASHBOARD_URL

          }

        });


      if (error) {

        alert(error.message);

      }

    }

  </script>

</body>
            </html>
