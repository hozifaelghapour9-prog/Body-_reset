<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Login</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#071a33;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:1250px;
      min-height:760px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      box-shadow:0 25px 60px rgba(0,0,0,.3);
    }

    /* IMAGE */

    .left{
      position:relative;
      background:
        linear-gradient(
          rgba(7,26,51,.30),
          rgba(7,26,51,.68)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=90");
      background-size:cover;
      background-position:center;
      color:white;
      padding:40px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
    }

    .image-header{
      position:absolute;
      top:32px;
      left:40px;
      right:40px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      direction:rtl;
    }

    .image-logo{
      color:white;
      font-size:34px;
      font-weight:bold;
    }

    .image-logo span{
      color:#2563eb;
    }

    .image-home{
      color:white;
      text-decoration:none;
      font-size:19px;
      font-weight:bold;
    }

    .hero-text{
      margin-top:auto;
      direction:rtl;
      text-align:right;
    }

    .hero-text p{
      font-size:30px;
      font-weight:bold;
      margin-top:10px;
      text-shadow:0 3px 10px rgba(0,0,0,.5);
    }

    /* FORM */

    .right{
      padding:70px 65px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .form-box{
      width:100%;
      max-width:470px;
    }

    .form-box h1{
      color:#071a33;
      font-size:40px;
      margin-bottom:25px;
    }

    .switch-text{
      color:#64748b;
      font-size:17px;
      margin-bottom:28px;
    }

    .switch-text span{
      color:#2563eb;
      font-weight:bold;
      cursor:pointer;
    }

    .field{
      margin-bottom:20px;
    }

    .field label{
      display:block;
      color:#071a33;
      font-size:17px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .field input,
    .field select{
      width:100%;
      height:54px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      padding:0 15px;
      font-size:17px;
      outline:none;
      background:white;
    }

    .field input:focus,
    .field select:focus{
      border-color:#2563eb;
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:75px;
    }

    .show-password{
      position:absolute;
      right:13px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:none;
      color:#2563eb;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn{
      width:100%;
      height:54px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:4px;
    }

    .main-btn:hover{
      background:#0d2a50;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:14px;
      margin:25px 0;
      color:#94a3b8;
      font-size:14px;
    }

    .divider::before,
    .divider::after{
      content:"";
      height:1px;
      background:#e2e8f0;
      flex:1;
    }

    .social-btn{
      width:100%;
      height:52px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;

      font-size:16px;
      font-weight:bold;
      cursor:pointer;

      margin-bottom:13px;
    }

    .social-btn img{
      width:21px;
      height:21px;
      object-fit:contain;
    }

    .apple-icon{
      width:21px;
      height:21px;
      fill:white;
    }

    .signup-form{
      display:none;
    }

    .message{
      margin-top:16px;
      text-align:center;
      font-size:14px;
      font-weight:bold;
    }

    .success{
      color:#16a34a;
    }

    .error{
      color:#dc2626;
    }

    /* TABLET */

    @media(max-width:900px){

      .container{
        max-width:760px;
        grid-template-columns:1fr;
      }

      .left{
        min-height:380px;
      }

      .right{
        padding:55px 45px;
      }
    }

    /* MOBILE */

    @media(max-width:500px){

      body{
        padding:10px;
      }

      .container{
        border-radius:15px;
      }

      .left{
        min-height:300px;
        padding:25px;
      }

      .image-header{
        top:22px;
        left:25px;
        right:25px;
      }

      .image-logo{
        font-size:25px;
      }

      .image-home{
        font-size:15px;
      }

      .hero-text p{
        font-size:21px;
      }

      .right{
        padding:40px 22px;
      }

      .form-box h1{
        font-size:32px;
      }

      .field input,
      .field select{
        height:50px;
      }

      .main-btn{
        height:50px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- IMAGE SIDE -->

    <div class="left">

      <div class="image-header">

        <div class="image-logo">
          Body<span>Reset</span>
        </div>

        <a class="image-home" href="index.html">
          Home
        </a>

      </div>

      <div class="hero-text">

        <p>ابنِ جسمًا أقوى.</p>
        <p>ابنِ حياة صحية أفضل.</p>

      </div>

    </div>


    <!-- FORM SIDE -->

    <div class="right">

      <div class="form-box">

        <!-- LOGIN -->

        <div id="loginBox">

          <!-- Login heading removed as requested -->

          <div class="field">
            <label>Username</label>

            <input
              type="text"
              id="loginUsername"
              placeholder="Enter username"
            >
          </div>


          <div class="field">

            <label>Password</label>

            <div class="password-wrap">

              <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword('loginPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <button
            class="main-btn"
            onclick="loginUser()"
          >
            Login
          </button>


          <div
            class="switch-text"
            style="margin-top:18px;"
          >
            Don't have an account?
            <span onclick="showSignup()">
              Sign up
            </span>
          </div>


          <div class="divider">
            OR
          </div>


          <button
            class="social-btn"
            onclick="loginGoogle()"
          >

            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
            >

            Continue with Google

          </button>


          <button
            class="social-btn"
            onclick="loginApple()"
          >

            <svg
              class="apple-icon"
              viewBox="0 0 24 24"
            >
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.08-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.39 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.96-2.52 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>

            Continue with Apple

          </button>

        </div>


        <!-- SIGN UP -->

        <div
          id="signupBox"
          class="signup-form"
        >

          <h1>Create Account</h1>


          <div class="switch-text">

            Already have an account?

            <span onclick="showLogin()">
              Login
            </span>

          </div>


          <div class="field">
            <label>Full Name</label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter full name"
            >
          </div>


          <div class="field">
            <label>Username</label>

            <input
              type="text"
              id="signupUsername"
              placeholder="Enter username"
            >
          </div>


          <div class="field">
            <label>Age</label>

            <input
              type="number"
              id="age"
              placeholder="Enter age"
            >
          </div>


          <div class="field">
            <label>Gender</label>

            <select id="gender">

              <option value="">
                Select gender
              </option>

              <option value="male">
                Male
              </option>

              <option value="female">
                Female
              </option>

            </select>

          </div>


          <div class="field">
            <label>Height</label>

            <input
              type="number"
              id="height"
              placeholder="Height in cm"
            >
          </div>


          <div class="field">
            <label>Weight</label>

            <input
              type="number"
              id="weight"
              placeholder="Weight in kg"
            >
          </div>


          <div class="field">
            <label>Email</label>

            <input
              type="email"
              id="signupEmail"
              placeholder="Enter email"
            >
          </div>


          <div class="field">

            <label>Password</label>

            <div class="password-wrap">

              <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword('signupPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <div class="field">

            <label>Confirm Password</label>

            <div class="password-wrap">

              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
              >

              <button
                type="button"
                class="show-password"
                onclick="togglePassword('confirmPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <button
            class="main-btn"
            onclick="createAccount()"
          >
            Create Account
          </button>

        </div>


        <div
          id="message"
          class="message"
        ></div>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";

    const DASHBOARD_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html";

    const AUTH_URL =
      "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function showMessage(text,type){

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function showSignup(){

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("signupBox").style.display =
        "block";

      document.getElementById("message").textContent =
        "";

    }


    function showLogin(){

      document.getElementById("signupBox").style.display =
        "none";

      document.getElementById("loginBox").style.display =
        "block";

      document.getElementById("message").textContent =
        "";

    }


    function togglePassword(id,button){

      const input =
        document.getElementById(id);

      if(input.type === "password"){

        input.type = "text";

        button.textContent = "Hide";

      }else{

        input.type = "password";

        button.textContent = "Show";

      }

    }


    async function loginUser(){

      const username =
        document.getElementById("loginUsername").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if(!username || !password){

        showMessage(
          "Please enter username and password.",
          "error"
        );

        return;

      }


      showMessage(
        "Logging in...",
        ""
      );


      const {data,error} =
        await supabaseClient.auth.signInWithPassword({

          email:username,
          password:password

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

        return;

      }


      window.location.href =
        DASHBOARD_URL;

    }


    async function createAccount(){

      const fullName =
        document.getElementById("fullName").value.trim();

      const username =
        document.getElementById("signupUsername").value.trim();

      const age =
        document.getElementById("age").value;

      const gender =
        document.getElementById("gender").value;

      const height =
        document.getElementById("height").value;

      const weight =
        document.getElementById("weight").value;

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if(
        !fullName ||
        !username ||
        !age ||
        !gender ||
        !height ||
        !weight ||
        !email ||
        !password ||
        !confirmPassword
      ){

        showMessage(
          "Please fill in all fields.",
          "error"
        );

        return;

      }


      if(password !== confirmPassword){

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      showMessage(
        "Creating account...",
        ""
      );


      const {data,error} =
        await supabaseClient.auth.signUp({

          email:email,

          password:password,

          options:{

            emailRedirectTo:AUTH_URL,

            data:{

              full_name:fullName,

              username:username,

              age:Number(age),

              gender:gender,

              height:Number(height),

              weight:Number(weight)

            }

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

        return;

      }


      if(data.session){

        window.location.href =
          DASHBOARD_URL;

      }else{

        showMessage(
          "Account created. Please confirm your email.",
          "success"
        );

      }

    }


    async function loginGoogle(){

      const {error} =
        await supabaseClient.auth.signInWithOAuth({

          provider:"google",

          options:{

            redirectTo:DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

      }

    }


    async function loginApple(){

      const {error} =
        await supabaseClient.auth.signInWithOAuth({

          provider:"apple",

          options:{

            redirectTo:DASHBOARD_URL

          }

        });


      if(error){

        showMessage(
          error.message,
          "error"
        );

      }

    }

  </script>

</body>
</html>
