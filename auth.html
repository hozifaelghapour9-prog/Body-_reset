<!DOCTYPE html><html lang="en" dir="ltr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Login</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #071a33;
    }

    header {
      width: 100%;
      height: 85px;
      background: #071a33;
      padding: 22px 7%;
    }

    .header-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .auth-section {
      width: 100%;
      min-height: calc(100vh - 85px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .auth-box {
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 15px 45px rgba(7, 26, 51, 0.15);
    }

    .auth-image {
      min-height: 620px;
      padding: 45px;
      color: white;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;

      background:
        linear-gradient(
          rgba(7, 26, 51, 0.30),
          rgba(7, 26, 51, 0.60)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=90")
        center center / cover no-repeat;
    }

    .image-content {
      width: 100%;
      direction: rtl;
      text-align: right;
    }

    .image-content h2 {
      font-size: 38px;
      margin-bottom: 15px;
      color: white;
    }

    .image-content p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 430px;
      margin-left: auto;
      color: white;
    }

    .auth-form {
      width: 100%;
      padding: 50px 45px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #071a33;
      font-size: 15px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 15px;
      border: 2px solid #071a33;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .input-group input::placeholder {
      color: #cbd5e1;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #2563eb;
    }

    .input-group select option {
      background: #071a33;
      color: white;
    }

    .password-box {
      position: relative;
      width: 100%;
    }

    .password-box input {
      padding-right: 75px;
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 3px 5px;
      z-index: 2;
    }

    .password-box:has(input:-webkit-autofill) .show-password {
      color: #071a33;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #0b2547;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 15px;
    }

    .switch button {
      background: none;
      border: none;
      color: #2563eb;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    #signupForm {
      display: none;
    }

    .signup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 750px) {

      header {
        height: 75px;
        padding: 18px 5%;
      }

      .auth-section {
        min-height: calc(100vh - 75px);
      }

      .auth-box {
        grid-template-columns: 1fr;
        border-radius: 0;
      }

      .auth-image {
        min-height: 300px;
        height: 300px;
        padding: 30px;
      }

      .image-content h2 {
        font-size: 30px;
      }

      .image-content p {
        font-size: 17px;
      }

      .auth-form {
        padding: 35px 25px;
      }
    }

    @media (max-width: 500px) {

      header {
        height: 68px;
        padding: 16px 5%;
      }

      .logo {
        font-size: 25px;
      }

      .home-link {
        font-size: 15px;
      }

      .auth-section {
        min-height: calc(100vh - 68px);
      }

      .auth-image {
        min-height: 245px;
        height: 245px;
        padding: 25px;
      }

      .image-content h2 {
        font-size: 27px;
      }

      .image-content p {
        font-size: 16px;
      }

      .auth-form {
        padding: 30px 20px;
      }

      .signup-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style></head><body><header>  <div class="header-content"><a href="index.html" class="home-link">
  Home
</a>

<div class="logo">
  Body<span>Reset</span>
</div>

  </div></header><section class="auth-section">  <div class="auth-box"><div class="auth-image">

  <div class="image-content">

    <h2>
      ابدأ تغيير جسمك
    </h2>

    <p>
      التزم بخطتك، تابع تقدمك، وابني نظام حياة صحي يناسب هدفك.
    </p>

  </div>

</div>


<div class="auth-form">


  <!-- LOGIN -->

  <div id="loginForm">


    <div class="input-group">

      <label>
        Username
      </label>

      <input
        type="text"
        id="loginUsername"
        autocomplete="username"
        placeholder="Enter your username"
      >

    </div>


    <div class="input-group">

      <label>
        Password
      </label>

      <div class="password-box">

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          placeholder="Enter your password"
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('loginPassword', this)"
        >
          Show
        </button>

      </div>

    </div>


    <button
      class="main-btn"
      onclick="loginUser()"
    >
      Login
    </button>


    <div class="switch">

      Don't have an account?

      <button onclick="showSignup()">
        Sign up
      </button>

    </div>


    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- SIGNUP -->

  <div id="signupForm">

    <h1>
      Create Account
    </h1>


    <div class="signup-grid">


      <div class="input-group">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Username"
        >

      </div>


      <div class="input-group">

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="signupEmail"
          autocomplete="email"
          placeholder="Email address"
        >

      </div>


      <div class="input-group">

        <label>
          Age
        </label>

        <input
          type="number"
          id="age"
          placeholder="Age"
        >

      </div>


      <div class="input-group">

        <label>
          Gender
        </label>

        <select id="gender">

          <option value="">
            Select gender
          </option>

          <option value="male">
            Male
          </option>

          <option value="female">
            Female
          </option>

        </select>

      </div>

    </div>


    <div class="input-group">

      <label>
        Create Password
      </label>

      <div class="password-box">

        <input
          type="password"
          id="signupPassword"
          autocomplete="new-password"
          placeholder="Create password"
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('signupPassword', this)"
        >
          Show
        </button>

      </div>

    </div>


    <button
      class="main-btn"
      onclick="createAccount()"
    >
      Create Account
    </button>


    <div class="switch">

      Already have an account?

      <button onclick="showLogin()">
        Login
      </button>

    </div>


    <div
      id="signupMessage"
      class="message"
    ></div>

  </div>

</div>

  </div></section><script type="module">

  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";


  const SUPABASE_URL =
    "https://byodeoaluspphqduxmlh.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  window.showSignup = function() {

    document.getElementById("loginForm").style.display =
      "none";

    document.getElementById("signupForm").style.display =
      "block";

  };


  window.showLogin = function() {

    document.getElementById("signupForm").style.display =
      "none";

    document.getElementById("loginForm").style.display =
      "block";

  };


  window.togglePassword = function(id, button) {

    const input =
      document.getElementById(id);


    if (input.type === "password") {

      input.type = "text";

      button.textContent = "Hide";

    } else {

      input.type = "password";

      button.textContent = "Show";

    }


    updateShowColor(input, button);

  };


  function updateShowColor(input, button) {

    const background =
      window.getComputedStyle(input).backgroundColor;


    if (
      background === "rgb(7, 26, 51)" ||
      background === "rgb(11, 37, 71)"
    ) {

      button.style.color = "white";

    } else {

      button.style.color = "#071a33";

    }

  }


  document.querySelectorAll(".password-box input").forEach(function(input) {

    const button =
      input.parentElement.querySelector(".show-password");


    updateShowColor(input, button);


    input.addEventListener("input", function() {

      updateShowColor(input, button);

    });


    input.addEventListener("change", function() {

      updateShowColor(input, button);

    });


    input.addEventListener("focus", function() {

      setTimeout(function() {

        updateShowColor(input, button);

      }, 100);

    });

  });


  window.createAccount = async function() {

    const username =
      document.getElementById("username").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const age =
      document.getElementById("age").value.trim();

    const gender =
      document.getElementById("gender").value;

    const password =
      document.getElementById("signupPassword").value;

    const message =
      document.getElementById("signupMessage");


    message.textContent = "";


    if (
      !username ||
      !email ||
      !age ||
      !gender ||
      !password
    ) {

      message.style.color = "#dc2626";

      message.textContent =
        "Please complete all fields.";

      return;

    }


    if (password.length < 6) {

      message.style.color = "#dc2626";

      message.textContent =
        "Password must be at least 6 characters.";

      return;

    }


    message.style.color = "#071a33";

    message.textContent =
      "Creating account...";


    const {
      data,
      error
    } = await supabase.auth.signUp({

      email: email,

      password: password,

      options: {

        emailRedirectTo:
          "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html",

        data: {

          username: username,

          age: age,

          gender: gender

        }

      }

    });


    if (error) {

      message.style.color = "#dc2626";

      message.textContent =
        error.message;

      return;

    }


    if (data.session) {

      window.location.href =
        "dashboard.html";

    } else {

      message.style.color = "#16a34a";

      message.textContent =
        "Account created. Please check your email to confirm your account.";

    }

  };


  window.loginUser = async function() {

    const username =
      document.getElementById("loginUsername").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");


    message.textContent = "";


    if (!username || !password) {

      message.style.color = "#dc2626";

      message.textContent =
        "Please enter your username and password.";

      return;

    }


    message.style.color = "#071a33";

    message.textContent =
      "Logging in...";


    const {
      data: profile,
      error: profileError
    } = await supabase
      .from("profiles")
      .select("email")
      .eq("username", username)
      .single();


    if (profileError || !profile) {

      message.style.color = "#dc2626";

      message.textContent =
        "Username or password is incorrect.";

      return;

    }


    const {
      data,
      error
    } = await supabase.auth.signInWithPassword({

      email: profile.email,

      password: password

    });


    if (error) {

      message.style.color = "#dc2626";

      message.textContent =
        "Username or password is incorrect.";

      return;

    }


    if (data.session) {

      window.location.href =
        "dashboard.html";

    }

  };

</script></body></html>
