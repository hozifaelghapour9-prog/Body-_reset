<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background:#071a33;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:25px;
    }

    .auth-container{
      width:100%;
      max-width:1000px;
      min-height:650px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
    }

    .auth-image{
      width:50%;
      background:
        linear-gradient(rgba(7,26,51,.25),rgba(7,26,51,.55)),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=85")
        center/cover;
      display:flex;
      align-items:flex-end;
      padding:45px;
    }

    .image-content{
      color:white;
    }

    .image-content h2{
      font-size:38px;
      margin-bottom:12px;
    }

    .image-content p{
      font-size:18px;
      line-height:1.6;
    }

    .auth-box{
      width:50%;
      padding:50px 45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .logo{
      color:#071a33;
      font-size:30px;
      font-weight:bold;
      margin-bottom:35px;
    }

    .logo span{
      color:#2563eb;
    }

    .title{
      color:#071a33;
      font-size:32px;
      margin-bottom:10px;
    }

    .switch-text{
      color:#64748b;
      font-size:15px;
      margin-bottom:28px;
    }

    .switch-text button{
      border:none;
      background:none;
      color:#2563eb;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
    }

    .form-group{
      margin-bottom:17px;
    }

    label{
      display:block;
      color:#071a33;
      font-weight:bold;
      font-size:15px;
      margin-bottom:7px;
    }

    input,
    select{
      width:100%;
      height:48px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      padding:0 14px;
      font-size:15px;
      outline:none;
      background:white;
      color:#071a33;
    }

    input:focus,
    select:focus{
      border-color:#2563eb;
    }

    .password-box{
      position:relative;
    }

    .password-box input{
      padding-right:75px;
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:none;
      color:#2563eb;
      font-size:13px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn{
      width:100%;
      height:50px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      margin-top:7px;
    }

    .main-btn:hover{
      background:#0d294d;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:23px 0;
      color:#94a3b8;
      font-size:13px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#e2e8f0;
    }

    .social-buttons{
      display:flex;
      flex-direction:column;
      gap:11px;
    }

    .social-btn{
      width:100%;
      height:49px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .social-btn:hover{
      background:#0d294d;
    }

    .google-logo{
      width:20px;
      height:20px;
    }

    .apple-logo{
      width:20px;
      height:20px;
    }

    .message{
      min-height:20px;
      margin-top:15px;
      text-align:center;
      font-size:14px;
      color:#2563eb;
    }

    .signup-form{
      display:none;
    }

    .signup-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0 14px;
    }

    @media(max-width:800px){
      .auth-container{
        max-width:520px;
      }

      .auth-image{
        display:none;
      }

      .auth-box{
        width:100%;
        padding:40px 30px;
      }
    }

    @media(max-width:500px){
      body{
        padding:15px;
      }

      .auth-container{
        min-height:auto;
        border-radius:15px;
      }

      .auth-box{
        padding:30px 22px;
      }

      .logo{
        font-size:26px;
        margin-bottom:28px;
      }

      .title{
        font-size:28px;
      }

      .signup-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="auth-container">

  <!-- IMAGE -->
  <div class="auth-image">
    <div class="image-content">
      <h2>BodyReset</h2>
      <p>
        Build a stronger body.<br>
        Build a healthier life.
      </p>
    </div>
  </div>


  <!-- LOGIN -->
  <div class="auth-box">

    <div class="logo">
      Body<span>Reset</span>
    </div>

    <div id="loginSection">

      <h1 class="title">Login</h1>

      <div class="switch-text">
        Don't have an account?
        <button onclick="showSignup()">Sign up</button>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            id="loginUsername"
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="form-group">
          <label>Password</label>

          <div class="password-box">
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('loginPassword',this)"
            >
              Show
            </button>
          </div>
        </div>

        <button class="main-btn" type="submit">
          Login
        </button>

      </form>

      <div class="divider">
        OR
      </div>

      <div class="social-buttons">

        <!-- GOOGLE -->
        <button
          class="social-btn"
          type="button"
          onclick="loginGoogle()"
        >
          <img
            class="google-logo"
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google"
          >
          <span>Continue with Google</span>
        </button>


        <!-- APPLE -->
        <button
          class="social-btn"
          type="button"
          onclick="loginApple()"
        >
          <svg
            class="apple-logo"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="white"
              d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.39 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.96-2.52 4.09zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"
            />
          </svg>

          <span>Continue with Apple</span>
        </button>

      </div>

    </div>


    <!-- SIGN UP -->
    <div id="signupSection" class="signup-form">

      <h1 class="title">Create Account</h1>

      <div class="switch-text">
        Already have an account?
        <button onclick="showLogin()">Login</button>
      </div>

      <form id="signupForm">

        <div class="signup-grid">

          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Full Name"
              required
            >
          </div>

          <div class="form-group">
            <label>Username</label>
            <input
              type="text"
              id="username"
              placeholder="Username"
              required
            >
          </div>

          <div class="form-group">
            <label>Age</label>
            <input
              type="number"
              id="age"
              placeholder="Age"
              min="10"
              max="100"
              required
            >
          </div>

          <div class="form-group">
            <label>Gender</label>
            <select id="gender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label>Height</label>
            <input
              type="number"
              id="height"
              placeholder="Height (cm)"
              required
            >
          </div>

          <div class="form-group">
            <label>Weight</label>
            <input
              type="number"
              id="weight"
              placeholder="Weight (kg)"
              required
            >
          </div>

          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              placeholder="Email"
              required
            >
          </div>

          <div class="form-group">
            <label>Password</label>

            <div class="password-box">
              <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('signupPassword',this)"
              >
                Show
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>

            <div class="password-box">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword',this)"
              >
                Show
              </button>
            </div>
          </div>

        </div>

        <button class="main-btn" type="submit">
          Create Account
        </button>

      </form>

    </div>

    <div id="message" class="message"></div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://byodeoaluspphqduxmlh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const DASHBOARD_URL =
    "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html";


  const AUTH_URL =
    "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html";


  function showSignup(){

    document.getElementById("loginSection").style.display = "none";

    document.getElementById("signupSection").style.display = "block";

    document.getElementById("message").textContent = "";

  }


  function showLogin(){

    document.getElementById("signupSection").style.display = "none";

    document.getElementById("loginSection").style.display = "block";

    document.getElementById("message").textContent = "";

  }


  function togglePassword(id,button){

    const input =
      document.getElementById(id);

    if(input.type === "password"){

      input.type = "text";

      button.textContent = "Hide";

    }else{

      input.type = "password";

      button.textContent = "Show";

    }

  }


  // LOGIN
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e){

      e.preventDefault();

      const username =
        document
          .getElementById("loginUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const message =
        document.getElementById("message");

      message.textContent = "Logging in...";


      /*
        Supabase Auth logs in with EMAIL + PASSWORD.
        The Username field is currently used as the email
        so existing Supabase accounts can log in.
      */

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: username,

          password: password

        });


      if(error){

        message.textContent =
          error.message;

        return;

      }


      window.location.href =
        DASHBOARD_URL;

    });


  // SIGN UP
  document
    .getElementById("signupForm")
    .addEventListener("submit", async function(e){

      e.preventDefault();

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const age =
        document
          .getElementById("age")
          .value;

      const gender =
        document
          .getElementById("gender")
          .value;

      const height =
        document
          .getElementById("height")
          .value;

      const weight =
        document
          .getElementById("weight")
          .value;

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;

      const message =
        document.getElementById("message");


      if(password !== confirmPassword){

        message.textContent =
          "Passwords do not match.";

        return;

      }


      if(password.length < 6){

        message.textContent =
          "Password must be at least 6 characters.";

        return;

      }


      message.textContent =
        "Creating account...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo: AUTH_URL,

            data: {

              full_name: fullName,

              username: username,

              age: Number(age),

              gender: gender,

              height: Number(height),

              weight: Number(weight)

            }

          }

        });


      if(error){

        message.textContent =
          error.message;

        return;

      }


      /*
        If email confirmation is enabled,
        Supabase sends a confirmation email.
      */

      if(!data.session){

        message.textContent =
          "Account created. Check your email to confirm your account.";

        return;

      }


      window.location.href =
        DASHBOARD_URL;

    });


  // GOOGLE
  async function loginGoogle(){

    const { error } =
      await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{

          redirectTo:DASHBOARD_URL

        }

      });


    if(error){

      document.getElementById("message").textContent =
        error.message;

    }

  }


  // APPLE
  async function loginApple(){

    const { error } =
      await supabaseClient.auth.signInWithOAuth({

        provider:"apple",

        options:{

          redirectTo:DASHBOARD_URL

        }

      });


    if(error){

      document.getElementById("message").textContent =
        error.message;

    }

  }


  // CHECK EXISTING SESSION
  async function checkSession(){

    const { data } =
      await supabaseClient.auth.getSession();

    if(data.session){

      window.location.href =
        DASHBOARD_URL;

    }

  }

  checkSession();

</script>

</body>
              </html>
