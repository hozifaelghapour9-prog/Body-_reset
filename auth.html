<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyReset - Auth</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f1f5f9;
      color:#071a33;
      min-height:100vh;
    }

    header{
      background:#071a33;
      padding:22px 7%;
    }

    .top-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      color:white;
      font-size:30px;
      font-weight:bold;
    }

    .logo span{
      color:#2563eb;
    }

    .home-link{
      color:#2563eb;
      text-decoration:none;
      font-size:17px;
      font-weight:bold;
    }

    .auth-section{
  min-height:calc(100vh - 85px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 20px 45px;
    }

    .auth-box{
      width:100%;
      max-width:1050px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 15px 45px rgba(7,26,51,.15);
    }

    /* الصورة ملتصقة بالعمود بالكامل */

    .auth-image{
      min-height:620px;
      width:100%;
      height:100%;
      padding:45px;
      color:white;
      display:flex;
      align-items:flex-end;

      background:
        linear-gradient(
          rgba(7,26,51,.35),
          rgba(7,26,51,.55)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85")
        center center / cover no-repeat;
    }

    .image-content h2{
      font-size:38px;
      margin-bottom:12px;
      line-height:1.3;
    }

    .image-content p{
      font-size:18px;
      line-height:1.8;
      max-width:400px;
    }

    .auth-form{
      padding:45px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .form-title{
      font-size:32px;
      font-weight:bold;
      margin-bottom:25px;
      color:#071a33;
    }

    .input-group{
      margin-bottom:17px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:16px;
      font-weight:bold;
      color:#071a33;
      text-align:left;
    }

    .input-wrapper{
      position:relative;
    }

    .input-wrapper input,
    .input-wrapper select{
      width:100%;
      height:52px;
      background:#071a33;
      color:white;
      border:2px solid #071a33;
      border-radius:9px;
      padding:0 15px;
      font-size:16px;
      outline:none;
      text-align:left;
    }

    .input-wrapper input::placeholder{
      color:#cbd5e1;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .input-wrapper select{
      color:white;
    }

    .password-toggle{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      color:white;
      cursor:pointer;
      font-size:13px;
      font-weight:bold;
    }

    .main-btn{
      width:100%;
      height:54px;
      border:none;
      border-radius:9px;
      background:#071a33;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    .main-btn:hover{
      background:#102a4a;
    }

    .switch-account{
      text-align:center;
      margin:18px 0 4px;
      color:#64748b;
      font-size:15px;
    }

    .switch-account button{
      border:none;
      background:none;
      color:#2563eb;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:23px 0 17px;
      color:#94a3b8;
      font-size:14px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#cbd5e1;
    }

    .social-btn{
      width:100%;
      height:52px;
      border-radius:9px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:12px;
      transition:.2s;
    }

    .google-btn,
    .apple-btn{
      background:#071a33;
      color:white;
      border:2px solid #071a33;
    }

    .google-btn:hover,
    .apple-btn:hover{
      background:#102a4a;
    }

    .google-logo{
      width:20px;
      height:20px;
      flex-shrink:0;
    }

    .apple-logo{
      width:21px;
      height:21px;
      fill:white;
      flex-shrink:0;
    }

    .message{
      min-height:24px;
      text-align:center;
      margin-top:10px;
      font-size:14px;
      line-height:1.6;
    }

    .success{
      color:#15803d;
    }

    .error{
      color:#dc2626;
    }

    #signupForm{
      display:none;
    }

    .two-fields{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    /* الموبايل */

    @media(max-width:800px){

      .auth-section{
        padding:25px 12px;
      }

      .auth-box{
        grid-template-columns:1fr;
      }

      .auth-image{
        min-height:300px;
        height:300px;
        padding:30px;
      }

      .image-content h2{
        font-size:28px;
      }

      .image-content p{
        font-size:16px;
      }

      .auth-form{
        padding:32px 24px;
      }
    }

    @media(max-width:500px){

      header{
        padding:19px 5%;
      }

      .logo{
        font-size:25px;
      }

      .home-link{
        font-size:15px;
      }

      .auth-section{
        padding:20px 10px;
      }

      .auth-form{
        padding:28px 20px;
      }

      .form-title{
        font-size:27px;
      }

      .two-fields{
        grid-template-columns:1fr;
        gap:0;
      }

      .auth-image{
        min-height:230px;
        height:230px;
      }
    }

  </style>
</head>

<body>

  <header>
    <div class="top-header">

      <div class="logo">
        Body<span>Reset</span>
      </div>

      <a href="index.html" class="home-link">
        Home
      </a>

    </div>
  </header>


  <section class="auth-section">

    <div class="auth-box">

      <!-- الصورة -->

      <div class="auth-image">

        <div class="image-content">

          <h2>ابدأ تغيير جسمك</h2>

          <p>
            التزم بخطتك، تابع تقدمك، وابني نظام حياة صحي يناسب هدفك.
          </p>

        </div>

      </div>


      <!-- الفورم -->

      <div class="auth-form">

        <!-- LOGIN -->

        <div id="loginForm">

          <div class="form-title">
            Login
          </div>


          <div class="input-group">

            <label>
              Username
            </label>

            <div class="input-wrapper">

              <input
                type="text"
                id="loginUsername"
                placeholder="Enter your username"
              >

            </div>

          </div>


          <div class="input-group">

            <label>
              Password
            </label>

            <div class="input-wrapper">

              <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                style="padding-right:75px"
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('loginPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <button
            class="main-btn"
            onclick="loginUser()"
          >
            Login
          </button>


          <div class="switch-account">

            Don't have an account?

            <button onclick="showSignup()">
              Sign up
            </button>

          </div>


          <div class="divider">
            <span>OR</span>
          </div>


          <!-- GOOGLE -->

          <button
            class="social-btn google-btn"
            onclick="googleLogin()"
          >

            <svg
              class="google-logo"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >

              <path
                fill="#4285F4"
                d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.45a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.56-5.17 3.56-8.64z"
              />

              <path
                fill="#34A853"
                d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.44 1.15-4.06 1.15-3.12 0-5.76-2.11-6.71-4.95H1.29v3.09A12 12 0 0 0 12 24z"
              />

              <path
                fill="#FBBC05"
                d="M5.29 14.29A7.2 7.2 0 0 1 4.91 12c0-.8.14-1.57.38-2.29V6.62H1.29A12 12 0 0 0 0 12c0 1.93.46 3.75 1.29 5.38l4-3.09z"
              />

              <path
                fill="#EA4335"
                d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.13 15.24 0 12 0A12 12 0 0 0 1.29 6.62l4 3.09C6.24 6.87 8.88 4.76 12 4.76z"
              />

            </svg>

            Continue with Google

          </button>


          <!-- APPLE -->

          <button
            class="social-btn apple-btn"
            onclick="appleLogin()"
          >

            <svg
              class="apple-logo"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >

              <path d="M18.71 19.5c-.77 1.12-1.61 2.21-2.89 2.23-1.25.03-1.67-.73-3.13-.73-1.47 0-1.94.71-3.13.76-1.23.04-2.16-1.2-2.93-2.31-1.58-2.27-2.78-6.4-1.16-9.21.8-1.4 2.23-2.29 3.79-2.32 1.2-.02 2.34.81 3.13.81.79 0 2.27-1 3.82-.85.65.03 2.48.26 3.65 1.98-.09.06-2.18 1.27-2.16 3.78.03 3.01 2.64 4.01 2.67 4.02-.02.07-.42 1.46-1.66 2.84zM15.96 4.69c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.81 1.43-.61.7-1.14 1.84-.99 2.93 1.07.08 2.16-.54 2.81-1.32z"/>

            </svg>

            Continue with Apple

          </button>


          <div
            id="loginMessage"
            class="message"
          ></div>

        </div>


        <!-- SIGN UP -->

        <div id="signupForm">

          <div class="form-title">
            Create Account
          </div>


          <div class="input-group">

            <label>Full Name</label>

            <div class="input-wrapper">

              <input
                type="text"
                id="fullName"
                placeholder="Full name"
              >

            </div>

          </div>


          <div class="input-group">

            <label>Username</label>

            <div class="input-wrapper">

              <input
                type="text"
                id="signupUsername"
                placeholder="Username"
              >

            </div>

          </div>


          <div class="two-fields">

            <div class="input-group">

              <label>Age</label>

              <div class="input-wrapper">

                <input
                  type="number"
                  id="age"
                  placeholder="Age"
                >

              </div>

            </div>


            <div class="input-group">

              <label>Gender</label>

              <div class="input-wrapper">

                <select id="gender">

                  <option value="">
                    Select
                  </option>

                  <option value="Male">
                    Male
                  </option>

                  <option value="Female">
                    Female
                  </option>

                </select>

              </div>

            </div>

          </div>


          <div class="two-fields">

            <div class="input-group">

              <label>Height (cm)</label>

              <div class="input-wrapper">

                <input
                  type="number"
                  id="height"
                  placeholder="Height"
                >

              </div>

            </div>


            <div class="input-group">

              <label>Weight (kg)</label>

              <div class="input-wrapper">

                <input
                  type="number"
                  id="weight"
                  placeholder="Weight"
                >

              </div>

            </div>

          </div>


          <div class="input-group">

            <label>Email</label>

            <div class="input-wrapper">

              <input
                type="email"
                id="signupEmail"
                placeholder="Email"
              >

            </div>

          </div>


          <div class="input-group">

            <label>Password</label>

            <div class="input-wrapper">

              <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                style="padding-right:75px"
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('signupPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <div class="input-group">

            <label>Confirm Password</label>

            <div class="input-wrapper">

              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                style="padding-right:75px"
              >

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword',this)"
              >
                Show
              </button>

            </div>

          </div>


          <button
            class="main-btn"
            onclick="createAccount()"
          >
            Create Account
          </button>


          <div class="switch-account">

            Already have an account?

            <button onclick="showLogin()">
              Login
            </button>

          </div>


          <div
            id="signupMessage"
            class="message"
          ></div>

        </div>

      </div>

    </div>

  </section>


  <script type="module">

    import { createClient }
    from "https://esm.sh/@supabase/supabase-js@2";


    const supabase = createClient(
      "https://byodeoaluspphqduxmlh.supabase.co",
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtUOzKvg92"
    );


    /* SHOW / HIDE PASSWORD */

    window.togglePassword = function(id,button){

      const input =
        document.getElementById(id);

      if(input.type === "password"){

        input.type = "text";
        button.textContent = "Hide";

      }else{

        input.type = "password";
        button.textContent = "Show";

      }

    };


    /* SHOW SIGN UP */

    window.showSignup = function(){

      document.getElementById("loginForm").style.display =
        "none";

      document.getElementById("signupForm").style.display =
        "block";

    };


    /* SHOW LOGIN */

    window.showLogin = function(){

      document.getElementById("signupForm").style.display =
        "none";

      document.getElementById("loginForm").style.display =
        "block";

    };


    /* CREATE ACCOUNT */

    window.createAccount = async function(){

      const fullName =
        document.getElementById("fullName").value.trim();

      const username =
        document.getElementById("signupUsername").value.trim();

      const age =
        document.getElementById("age").value;

      const gender =
        document.getElementById("gender").value;

      const height =
        document.getElementById("height").value;

      const weight =
        document.getElementById("weight").value;

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("signupMessage");


      message.textContent = "";
      message.className = "message";


      if(
        !fullName ||
        !username ||
        !age ||
        !gender ||
        !height ||
        !weight ||
        !email ||
        !password ||
        !confirmPassword
      ){

        message.textContent =
          "Please fill in all fields.";

        message.className =
          "message error";

        return;
      }


      if(password !== confirmPassword){

        message.textContent =
          "Passwords do not match.";

        message.className =
          "message error";

        return;
      }


      if(password.length < 6){

        message.textContent =
          "Password must be at least 6 characters.";

        message.className =
          "message error";

        return;
      }


      const { data, error } =
        await supabase.auth.signUp({

          email:email,

          password:password,

          options:{

            emailRedirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/auth.html",

            data:{

              full_name:fullName,
              username:username,
              age:age,
              gender:gender,
              height:height,
              weight:weight

            }

          }

        });


      if(error){

        message.textContent =
          error.message;

        message.className =
          "message error";

        return;
      }


      if(data.session){

        window.location.href =
          "dashboard.html";

      }else{

        message.textContent =
          "Account created successfully. Please check your email to confirm your account.";

        message.className =
          "message success";

      }

    };


    /* LOGIN */

    window.loginUser = async function(){

      const message =
        document.getElementById("loginMessage");

      message.textContent =
        "Username login will be connected to the database next.";

      message.className =
        "message";

    };


    /* GOOGLE */

    window.googleLogin = async function(){

      const { error } =
        await supabase.auth.signInWithOAuth({

          provider:"google",

          options:{

            redirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"

          }

        });


      if(error){

        const message =
          document.getElementById("loginMessage");

        message.textContent =
          error.message;

        message.className =
          "message error";

      }

    };


    /* APPLE */

    window.appleLogin = async function(){

      const { error } =
        await supabase.auth.signInWithOAuth({

          provider:"apple",

          options:{

            redirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/dashboard.html"

          }

        });


      if(error){

        const message =
          document.getElementById("loginMessage");

        message.textContent =
          error.message;

        message.className =
          "message error";

      }

    };

  </script>

</body>
  </html>
