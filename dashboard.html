<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BodyReset | Workouts</title>

<style>

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{
background:linear-gradient(135deg,#0066cc 0%,#00a6b2 100%);
color:#071a33;
min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
height:75px;
padding:0 25px;
display:flex;
justify-content:space-between;
align-items:center;
background:#000;
border-bottom:1px solid #071a33;
}

.logo{
font-size:25px;
font-weight:bold;
color:#fff;
}

.logo span{
color:#2563eb;
}

.header-left{
display:flex;
align-items:center;
gap:18px;
}

.profile{
width:40px;
height:40px;
border-radius:50%;
background:#f97316;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.menu-btn{
background:none;
border:none;
color:#fff;
font-size:30px;
cursor:pointer;
}


/* =========================
   CONTAINER
========================= */

.container{
max-width:1100px;
margin:auto;
padding:28px 20px 110px;
}


/* =========================
   PAGE TITLE
========================= */

.page-heading{
margin-bottom:25px;
}

.page-heading h1{
font-size:30px;
color:#fff;
margin-bottom:8px;
}

.page-heading p{
font-size:14px;
color:#eaf6ff;
line-height:1.7;
}


/* =========================
   WORKOUT FILTER
========================= */

.workout-tabs{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:8px;
margin-bottom:25px;
scrollbar-width:none;
}

.workout-tabs::-webkit-scrollbar{
display:none;
}

.workout-tab{
flex:0 0 auto;
padding:11px 20px;
border-radius:10px;
background:#fff;
border:1px solid #d7dee8;
color:#071a33;
font-weight:bold;
cursor:pointer;
}

.workout-tab.active{
background:#071a33;
color:#fff;
}


/* =========================
   WORKOUT SECTION
========================= */

.workout-section{
background:#fff;
border:1px solid #d7dee8;
border-radius:20px;
padding:20px;
margin-bottom:25px;
}

.workout-section-title{
font-size:24px;
font-weight:bold;
color:#071a33;
margin-bottom:20px;
}


/* =========================
   EXERCISES
========================= */

.exercise-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.exercise-card{
background:#f8fafc;
border:1px solid #d7dee8;
border-radius:16px;
overflow:hidden;
}

.exercise-name{
background:#fff;
padding:16px;
text-align:center;
}

.exercise-name h3{
font-size:19px;
color:#071a33;
}

.exercise-card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.exercise-content{
padding:15px;
}

.exercise-info{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.exercise-info span{
font-size:13px;
color:#64748b;
}

.start-btn{
display:block;
width:100%;
background:#2563eb;
color:#fff;
text-align:center;
text-decoration:none;
padding:12px;
border-radius:9px;
font-size:14px;
font-weight:bold;
transition:0.2s;
}

.start-btn:hover{
background:#1d4ed8;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:#fff;
border-top:1px solid #d7dee8;
display:flex;
justify-content:space-around;
align-items:center;
z-index:1000;
}

.nav-item{
width:25%;
height:72px;
color:#071a33;
text-decoration:none;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
font-size:11px;
font-weight:bold;
}

.nav-icon{
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
}

.nav-icon svg{
width:27px;
height:27px;
fill:none;
stroke:#2563eb;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}


/* =========================
   HOME
========================= */

.home-nav .nav-icon{
width:40px;
height:40px;
border-radius:50%;
background:#071a33;
}

.home-nav .nav-icon svg{
width:23px;
height:23px;
stroke:#fff;
}


/* =========================
   WORKOUT DUMBBELL
========================= */

.workout-nav .nav-icon svg{
width:32px;
height:32px;
stroke:#071a33;
stroke-width:2.4;

/* الميل الجديد */
transform:rotate(12deg);
}


/* =========================
   PROGRESS
========================= */

.progress-nav .nav-icon{
width:32px;
height:32px;
}

.progress-nav .nav-icon svg{
width:29px;
height:29px;
stroke:#2563eb;
stroke-width:2;
}


/* =========================
   PROFILE
========================= */

.profile-nav .nav-icon svg{
width:28px;
height:28px;
stroke:#2563eb;
}


/*
مهم:
مفيش تغيير في شكل الزر
لما تدخل الصفحة.
*/


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

.exercise-grid{
grid-template-columns:1fr;
}

}


@media(max-width:600px){

header{
height:68px;
padding:0 16px;
}

.logo{
font-size:21px;
}

.container{
padding:20px 14px 110px;
}

.page-heading h1{
font-size:25px;
}

.workout-section{
padding:15px;
}

.exercise-card img{
height:200px;
}

.bottom-nav{
height:72px;
}

.nav-item{
height:72px;
font-size:10px;
}

.nav-icon{
width:29px;
height:29px;
}

.nav-icon svg{
width:25px;
height:25px;
}

.home-nav .nav-icon{
width:37px;
height:37px;
}

.home-nav .nav-icon svg{
width:21px;
height:21px;
}

.workout-nav .nav-icon svg{
width:30px;
height:30px;
}

}

</style>

</head>
