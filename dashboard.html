<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>BodyReset | لوحة التحكم</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 90px;
    }


    /* HEADER */

    header {
      height: 75px;
      padding: 0 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #080808;
      border-bottom: 1px solid #292929;
    }


    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: .5px;
    }


    .logo span {
      color: #00f56a;
    }


    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .profile {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #3d3d3d,
          #151515
        );

      border: 1px solid #4a4a4a;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #00f56a;
      font-weight: bold;
    }


    #logoutBtn {
      background: #1d1d1d;
      color: #ffffff;

      border: 1px solid #444444;

      padding: 9px 15px;

      border-radius: 9px;

      cursor: pointer;

      transition: .2s;
    }


    #logoutBtn:hover {
      border-color: #00f56a;
      color: #00f56a;
    }


    /* MAIN */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 28px 20px 50px;
    }


    /* WELCOME */

    .welcome {
      background:
        linear-gradient(
          135deg,
          #303030 0%,
          #222222 45%,
          #0b0b0b 100%
        );

      border: 1px solid #444444;

      border-radius: 22px;

      padding: 30px;

      position: relative;

      overflow: hidden;

      margin-bottom: 25px;
    }


    .welcome h1 {
      font-size: 31px;
      margin-bottom: 9px;
    }


    .welcome h1 span {
      color: #00f56a;
    }


    .welcome p {
      color: #a5a5a5;
      line-height: 1.8;
      margin-bottom: 20px;
    }


    .account {
      color: #00f56a;
      font-weight: bold;
    }


    /* PROGRESS BAR */

    .progress-area {
      max-width: 600px;
    }


    .progress-top {
      display: flex;
      justify-content: space-between;

      margin-bottom: 8px;

      color: #bdbdbd;

      font-size: 14px;
    }


    .progress-top strong {
      color: #00f56a;
    }


    .progress-bar {
      width: 100%;
      height: 9px;

      background: #111111;

      border-radius: 20px;

      overflow: hidden;

      border: 1px solid #333333;
    }


    .progress-fill {
      width: 68%;
      height: 100%;

      background: #00f56a;

      border-radius: 20px;

      box-shadow:
        0 0 12px
        rgba(0,245,106,.35);
    }


    /* DASHBOARD STATS */

    .stats {
      display: flex;

      flex-direction: row;

      gap: 18px;

      margin-bottom: 30px;

      width: 100%;

      overflow-x: auto;

      overflow-y: hidden;

      scroll-snap-type: x mandatory;

      scroll-behavior: smooth;

      padding-bottom: 8px;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;

      direction: ltr;
    }


    .stats::-webkit-scrollbar {
      display: none;
    }


    .stat {
      flex: 0 0 calc(
        (100% - 36px) / 3
      );

      background:
        linear-gradient(
          145deg,
          #3a3a3a 0%,
          #242424 40%,
          #111111 100%
        );

      border: 1px solid #484848;

      border-radius: 16px;

      padding: 22px 18px;

      min-height: 235px;

      text-align: right;

      scroll-snap-align: start;

      position: relative;

      overflow: hidden;

      direction: rtl;

      transition: .25s;
    }


    .stat:hover {
      border-color: #00f56a;

      box-shadow:
        0 0 20px
        rgba(0,245,106,.08);
    }


    .stat-title {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 15px;
    }


    .stat-title h3 {
      font-size: 17px;

      font-weight: bold;
    }


    .stat-arrow {
      color: #999999;

      font-size: 22px;

      line-height: 1;
    }


    /* WEEKLY ACTIVITY */

    .activity-content {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 20px;

      direction: ltr;

      margin-top: 15px;
    }


    .circle-box {
      text-align: center;

      direction: rtl;
    }


    .circle {
      width: 82px;
      height: 82px;

      border-radius: 50%;

      background:
        conic-gradient(
          #00f56a 0 60%,
          #3b3b3b 60% 100%
        );

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      margin: auto;
    }


    .circle.small {
      width: 65px;
      height: 65px;

      background:
        conic-gradient(
          #00f56a 0 0%,
          #3b3b3b 0 100%
        );
    }


    .circle::after {
      content: "";

      position: absolute;

      width: 63px;
      height: 63px;

      background: #202020;

      border-radius: 50%;
    }


    .circle.small::after {
      width: 49px;
      height: 49px;
    }


    .circle-value {
      position: relative;

      z-index: 2;

      color: white;

      font-size: 18px;

      font-weight: bold;
    }


    .circle.small .circle-value {
      font-size: 14px;
    }


    .circle-label {
      display: block;

      margin-top: 9px;

      color: #9d9d9d;

      font-size: 13px;
    }


    /* CALORIE BURN */

    .calorie-number {
      display: flex;

      align-items: center;

      gap: 8px;

      direction: rtl;

      margin-bottom: 10px;
    }


    .calorie-fire {
      color: #00f56a;

      font-size: 23px;
    }


    .calorie-number strong {
      font-size: 24px;

      color: white;
    }


    .calorie-number span {
      color: #9d9d9d;

      font-size: 15px;
    }


    .chart {
      height: 105px;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 7px;

      direction: ltr;

      padding: 0 3px;
    }


    .bar-wrap {
      height: 100%;

      flex: 1;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      position: relative;
    }


    .bar-bg {
      position: absolute;

      bottom: 18px;

      width: 14px;

      height: 78px;

      background: #363636;

      border-radius: 8px 8px 0 0;
    }


    .bar {
      width: 14px;

      background: #00f56a;

      border-radius: 8px 8px 0 0;

      position: relative;

      z-index: 2;

      box-shadow:
        0 0 10px
        rgba(0,245,106,.16);
    }


    .day {
      position: absolute;

      bottom: 0;

      color: #888888;

      font-size: 10px;
    }


    /* WEEKLY PROGRESS */

    .weekly-progress {
      display: flex;

      align-items: center;

      justify-content: center;

      margin-top: 12px;
    }


    .big-progress {
      width: 135px;
      height: 135px;

      border-radius: 50%;

      background:
        conic-gradient(
          #00f56a 0 68%,
          #3a3a3a 68% 100%
        );

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      box-shadow:
        0 0 20px
        rgba(0,245,106,.08);
    }


    .big-progress::after {
      content: "";

      position: absolute;

      width: 103px;
      height: 103px;

      background: #202020;

      border-radius: 50%;
    }


    .big-progress-value {
      position: relative;

      z-index: 2;

      color: #00f56a;

      font-size: 28px;

      font-weight: bold;
    }


    /* SECTION TITLE */

    .section-title {
      font-size: 23px;

      margin-bottom: 18px;
    }


    /* DASHBOARD CARDS */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 17px;

      margin-bottom: 30px;
    }


    .card {
      background:
        linear-gradient(
          145deg,
          #3d3d3d 0%,
          #292929 35%,
          #151515 65%,
          #090909 100%
        );

      border: 1px solid #4a4a4a;

      border-radius: 18px;

      padding: 23px;

      transition: .25s;
    }


    .card:hover {
      transform: translateY(-4px);

      border-color: #00f56a;

      box-shadow:
        0 0 22px
        rgba(0,245,106,.08);
    }


    .icon {
      font-size: 34px;

      margin-bottom: 14px;
    }


    .card h3 {
      margin-bottom: 9px;

      font-size: 19px;
    }


    .card p {
      color: #a0a0a0;

      line-height: 1.7;

      font-size: 14px;

      margin-bottom: 18px;
    }


    .card a {
      display: inline-block;

      text-decoration: none;

      background: #00f56a;

      color: #06100a;

      padding: 10px 16px;

      border-radius: 9px;

      font-weight: bold;

      font-size: 14px;

      transition: .2s;
    }


    .card a:hover {
      background: #18ff78;

      box-shadow:
        0 0 18px
        rgba(0,245,106,.22);
    }


    /* SUBSCRIPTION */

    .subscription-box {
      background:
        linear-gradient(
          145deg,
          #3d3d3d 0%,
          #292929 35%,
          #151515 65%,
          #090909 100%
        );

      border: 1px solid #4a4a4a;

      border-radius: 20px;

      padding: 28px;

      text-align: center;
    }


    .subscription-box h2 {
      font-size: 24px;

      margin-bottom: 10px;
    }


    .subscription-box p {
      color: #a5a5a5;

      margin-bottom: 10px;

      line-height: 1.7;
    }


    .plan-price {
      color: #00f56a;

      font-size: 34px;

      font-weight: bold;

      margin: 16px 0;

      text-shadow:
        0 0 12px
        rgba(0,245,106,.18);
    }


    .complete-subscription {
      background: #00f56a;

      color: #06100a;

      padding: 12px 24px;

      border-radius: 10px;

      font-weight: bold;

      border: none;

      cursor: pointer;

      font-size: 16px;

      transition: .2s;
    }


    .complete-subscription:hover {
      background: #18ff78;

      box-shadow:
        0 0 20px
        rgba(0,245,106,.25);
    }


    .no-plan {
      color: #999999;
    }


    #message {
      margin-top: 15px;

      text-align: center;
    }


    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;

      bottom: 0;

      left: 0;

      width: 100%;

      height: 76px;

      background:
        rgba(8,8,8,.97);

      border-top: 1px solid #2c2c2c;

      display: flex;

      align-items: center;

      justify-content: space-around;

      z-index: 9999;

      direction: ltr;

      box-shadow:
        0 -8px 25px
        rgba(0,0,0,.35);
    }


    .nav-item {
      flex: 1;

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 5px;

      text-decoration: none;

      color: #8d8d8d;

      font-size: 12px;

      transition: .2s;

      direction: rtl;
    }


    .nav-icon {
      width: 27px;

      height: 27px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 24px;

      line-height: 1;
    }


    .nav-item.active {
      color: #00f56a;

      text-shadow:
        0 0 10px
        rgba(0,245,106,.35);
    }


    .nav-item.active .nav-icon {
      filter:
        drop-shadow(
          0 0 6px
          rgba(0,245,106,.35)
        );
    }


    /* BELL */

    .dashboard-heading {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

      direction: rtl;
    }


    .dashboard-heading h2 {
      font-size: 27px;
    }


    .notification {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #ffffff;

      background: #111111;

      border: 1px solid #333333;

      position: relative;
    }


    .notification::after {
      content: "";

      width: 7px;
      height: 7px;

      background: #00f56a;

      border-radius: 50%;

      position: absolute;

      top: 8px;
      right: 10px;

      box-shadow:
        0 0 8px
        rgba(0,245,106,.5);
    }


    .bell-icon {
      width: 20px;
      height: 20px;

      position: relative;

      border: 2px solid #eeeeee;

      border-top-left-radius: 11px;

      border-top-right-radius: 11px;

      border-bottom: none;
    }


    .bell-icon::before {
      content: "";

      position: absolute;

      left: -5px;

      bottom: -3px;

      width: 26px;

      height: 2px;

      background: #eeeeee;

      border-radius: 5px;
    }


    .bell-icon::after {
      content: "";

      position: absolute;

      bottom: -7px;

      left: 6px;

      width: 6px;

      height: 6px;

      background: #eeeeee;

      border-radius: 50%;
    }


    /* TABLET */

    @media(max-width: 800px) {

      .stat {
        flex: 0 0 280px;

        min-height: 235px;

        padding: 22px 18px;
      }


      .cards {
        grid-template-columns: 1fr;
      }

    }


    /* MOBILE */

    @media(max-width: 600px) {

      body {
        padding-bottom: 82px;
      }


      header {
        height: 68px;

        padding: 0 16px;
      }


      .logo {
        font-size: 21px;
      }


      .header-left {
        gap: 8px;
      }


      .profile {
        width: 36px;
        height: 36px;
      }


      #logoutBtn {
        padding: 8px 10px;

        font-size: 13px;
      }


      .container {
        padding: 20px 14px 40px;
      }


      .welcome {
        padding: 23px 20px;

        border-radius: 18px;
      }


      .welcome h1 {
        font-size: 25px;
      }


      .dashboard-heading h2 {
        font-size: 25px;
      }


      .notification {
        width: 40px;
        height: 40px;
      }


      .stat {
        flex: 0 0 300px;

        min-height: 225px;

        padding: 22px 18px;
      }


      .subscription-box {
        padding: 23px 18px;
      }


      .bottom-nav {
        height: 72px;
      }


      .nav-item {
        font-size: 11px;
      }


      .nav-icon {
        font-size: 22px;
      }

    }

  </style>

</head>
