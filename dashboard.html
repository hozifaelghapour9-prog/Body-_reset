<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset | Dashboard</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    html{
      background:#000;
      scroll-behavior:smooth;
    }

    body{
      background:#000;
      color:#fff;
      min-height:100vh;
      padding-bottom:92px;
      overflow-x:hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header{
      height:76px;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .logo{
      color:#fff;
      font-size:24px;
      font-weight:700;
      letter-spacing:.3px;
    }

    .logo span{
      color:#19f57a;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .profile-button{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#292929;
      border:1px solid #4b4b4b;
      color:#19f57a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:bold;
    }

    .logout-button{
      border:1px solid #454545;
      background:#191919;
      color:#fff;
      border-radius:9px;
      padding:9px 13px;
      cursor:pointer;
      font-size:12px;
    }

    .logout-button:hover{
      border-color:#19f57a;
      color:#19f57a;
    }

    /* =========================
       MAIN
    ========================= */

    .container{
      width:100%;
      max-width:1100px;
      margin:auto;
      padding:25px 20px 35px;
    }

    .top-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:22px;
    }

    .top-title h1{
      color:#fff;
      font-size:36px;
      font-weight:700;
    }

    /* =========================
       NOTIFICATION
    ========================= */

    .notification{
      width:44px;
      height:44px;
      border-radius:50%;
      background:#0b0b0b;
      border:1px solid #383838;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .bell{
      width:19px;
      height:20px;
      border:2px solid #fff;
      border-bottom:0;
      border-radius:12px 12px 4px 4px;
      position:relative;
    }

    .bell:before{
      content:"";
      position:absolute;
      left:-5px;
      bottom:-3px;
      width:25px;
      height:2px;
      background:#fff;
      border-radius:5px;
    }

    .bell:after{
      content:"";
      position:absolute;
      left:6px;
      bottom:-8px;
      width:5px;
      height:5px;
      background:#fff;
      border-radius:50%;
    }

    .notification-dot{
      position:absolute;
      top:7px;
      right:8px;
      width:7px;
      height:7px;
      background:#19f57a;
      border-radius:50%;
      box-shadow:0 0 8px rgba(25,245,122,.7);
    }

    /* =========================
       STATS
    ========================= */

    .stats{
      width:100%;
      display:flex;
      gap:17px;
      overflow-x:auto;
      overflow-y:hidden;
      padding-bottom:7px;
      scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }

    .stats::-webkit-scrollbar{
      display:none;
    }

    .stat-card{
      flex:0 0 calc((100% - 34px) / 3);
      min-height:245px;
      background:linear-gradient(
        145deg,
        #3a3a3a 0%,
        #262626 45%,
        #111 100%
      );
      border:1px solid #4a4a4a;
      border-radius:17px;
      padding:19px;
      scroll-snap-align:start;
      overflow:hidden;
    }

    .stat-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .stat-head h2{
      font-size:18px;
      color:#fff;
      font-weight:600;
    }

    .arrow{
      color:#a8a8a8;
      font-size:25px;
    }

    /* =========================
       ACTIVITY CIRCLES
    ========================= */

    .activity{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:22px;
      margin-top:10px;
    }

    .circle-box{
      text-align:center;
    }

    .progress-circle{
      width:92px;
      height:92px;
      border-radius:50%;
      background:conic-gradient(
        #19f57a 0 60%,
        #3a3a3a 60% 100%
      );
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .progress-circle.small{
      width:72px;
      height:72px;
      background:conic-gradient(
        #19f57a 0 0%,
        #3a3a3a 0 100%
      );
    }

    .progress-circle:after{
      content:"";
      position:absolute;
      width:70px;
      height:70px;
      border-radius:50%;
      background:#202020;
    }

    .progress-circle.small:after{
      width:54px;
      height:54px;
    }

    .circle-number{
      position:relative;
      z-index:2;
      color:#fff;
      font-size:22px;
      font-weight:bold;
    }

    .small .circle-number{
      font-size:16px;
    }

    .circle-label{
      display:block;
      margin-top:10px;
      color:#a8a8a8;
      font-size:13px;
    }

    /* =========================
       CALORIE
    ========================= */

    .calorie{
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:8px;
    }

    .fire{
      color:#19f57a;
      font-size:24px;
    }

    .calorie strong{
      color:#fff;
      font-size:26px;
    }

    .calorie span{
      color:#9c9c9c;
      font-size:15px;
    }

    .chart{
      height:130px;
      display:flex;
      align-items:flex-end;
      gap:9px;
      margin-top:8px;
    }

    .chart-column{
      flex:1;
      height:100%;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:flex-end;
    }

    .chart-bg{
      position:absolute;
      bottom:21px;
      width:15px;
      height:100px;
      border-radius:8px 8px 0 0;
      background:#3a3a3a;
    }

    .chart-bar{
      width:15px;
      background:#19f57a;
      border-radius:8px 8px 0 0;
      position:relative;
      z-index:2;
      box-shadow:0 0 10px rgba(25,245,122,.18);
    }

    .day{
      position:absolute;
      bottom:0;
      color:#858585;
      font-size:10px;
    }

    /* =========================
       WEEKLY PROGRESS
    ========================= */

    .weekly{
      display:flex;
      align-items:center;
      justify-content:center;
      height:170px;
    }

    .big-circle{
      width:142px;
      height:142px;
      border-radius:50%;
      background:conic-gradient(
        #19f57a 0 68%,
        #393939 68% 100%
      );
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .big-circle:after{
      content:"";
      position:absolute;
      width:108px;
      height:108px;
      border-radius:50%;
      background:#202020;
    }

    .big-number{
      position:relative;
      z-index:2;
      color:#19f57a;
      font-size:30px;
      font-weight:bold;
    }

    /* =========================
       SECTION TITLES
    ========================= */

    .section-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:28px;
      margin-bottom:15px;
    }

    .section-header h2{
      font-size:27px;
      color:#fff;
    }

    .see-all{
      color:#19f57a;
      text-decoration:none;
      font-size:16px;
    }

    .see-all:hover{
      color:#fff;
    }

    /* =========================
       TODAY'S WORKOUT
    ========================= */

    .workout-slider{
      width:100%;
      overflow:hidden;
    }

    .workout-card{
      min-height:220px;
      width:100%;
      background:linear-gradient(
        135deg,
        #333 0%,
        #222 42%,
        #101010 100%
      );
      border:1px solid #505050;
      border-radius:18px;
      display:flex;
      align-items:center;
      padding:25px;
      gap:25px;
    }

    .workout-visual{
      width:42%;
      min-height:165px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .dumbbell{
      width:150px;
      height:70px;
      position:relative;
      filter:drop-shadow(
        0 0 13px rgba(25,245,122,.5)
      );
    }

    .handle{
      position:absolute;
      width:72px;
      height:12px;
      background:#19f57a;
      border-radius:10px;
      left:39px;
      top:29px;
      box-shadow:0 0 10px rgba(25,245,122,.7);
    }

    .weight{
      position:absolute;
      width:17px;
      height:62px;
      border:5px solid #19f57a;
      border-radius:8px;
      top:4px;
      box-shadow:0 0 10px rgba(25,245,122,.55);
    }

    .weight.left{
      left:23px;
    }

    .weight.right{
      right:23px;
    }

    .weight2{
      position:absolute;
      width:17px;
      height:48px;
      border:5px solid #19f57a;
      border-radius:8px;
      top:11px;
      box-shadow:0 0 10px rgba(25,245,122,.55);
    }

    .weight2.left{
      left:5px;
    }

    .weight2.right{
      right:5px;
    }

    .workout-info{
      flex:1;
    }

    .workout-label{
      color:#19f57a;
      font-size:16px;
      margin-bottom:8px;
    }

    .workout-info h3{
      color:#fff;
      font-size:26px;
      margin-bottom:9px;
    }

    .workout-info p{
      color:#a8a8a8;
      font-size:16px;
      margin-bottom:20px;
    }

    .start-button{
      display:inline-block;
      background:#19f57a;
      color:#06100a;
      border:none;
      border-radius:25px;
      padding:12px 28px;
      text-decoration:none;
      font-weight:bold;
      font-size:16px;
      box-shadow:0 0 18px rgba(25,245,122,.16);
    }

    .start-button:hover{
      background:#fff;
    }

    .slider-dots{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:9px;
      margin-top:17px;
    }

    .slider-dot{
      width:8px;
      height:8px;
      background:#555;
      border-radius:50%;
    }

    .slider-dot.active{
      width:32px;
      border-radius:8px;
      background:#19f57a;
    }

    /* =========================
       COMMUNITY NEWS
    ========================= */

    .news-slider{
      width:100%;
      display:flex;
      gap:14px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-bottom:5px;
    }

    .news-slider::-webkit-scrollbar{
      display:none;
    }

    .news-card{
      flex:0 0 76%;
      background:linear-gradient(
        145deg,
        #303030,
        #171717
      );
      border:1px solid #484848;
      border-radius:17px;
      padding:18px;
    }

    .news-row{
      display:flex;
      align-items:center;
      gap:14px;
      padding:10px 0;
    }

    .news-row + .news-row{
      border-top:1px solid #3b3b3b;
    }

    .news-icon{
      width:46px;
      height:46px;
      flex:0 0 46px;
      border-radius:50%;
      background:#3b3b3b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#19f57a;
      font-size:21px;
      border:1px solid #505050;
    }

    .news-content{
      flex:1;
    }

    .news-content h3{
      color:#fff;
      font-size:16px;
      margin-bottom:5px;
    }

    .news-content p{
      color:#929292;
      font-size:13px;
    }

    .news-arrow{
      color:#aaa;
      font-size:25px;
    }

    /* =========================
       SUBSCRIPTION
    ========================= */

    .subscription-box{
      margin-top:30px;
      background:linear-gradient(
        145deg,
        #303030,
        #141414
      );
      border:1px solid #484848;
      border-radius:18px;
      padding:25px;
      text-align:center;
    }

    .subscription-box h2{
      color:#fff;
      font-size:23px;
      margin-bottom:10px;
    }

    .subscription-box p{
      color:#999;
      line-height:1.7;
      margin-bottom:8px;
    }

    .plan-price{
      color:#19f57a;
      font-size:30px;
      font-weight:bold;
      margin:12px 0;
    }

    .complete-button{
      display:none;
      border:0;
      background:#19f57a;
      color:#06100a;
      padding:12px 22px;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    #message{
      text-align:center;
      margin-top:15px;
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:78px;
      background:rgba(8,8,8,.98);
      border-top:1px solid #303030;
      display:flex;
      align-items:center;
      justify-content:space-around;
      z-index:9999;
      box-shadow:0 -8px 25px rgba(0,0,0,.45);
    }

    .nav-item{
      flex:1;
      height:100%;
      color:#858585;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:12px;
      transition:.2s;
    }

    .nav-icon{
      width:27px;
      height:27px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      line-height:1;
    }

    .nav-item.active{
      color:#19f57a;
    }

    .nav-item:hover{
      color:#19f57a;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:800px){

      header{
        height:65px;
        padding:0 15px;
      }

      .logo{
        font-size:20px;
      }

      .profile-button{
        width:36px;
        height:36px;
      }

      .logout-button{
        display:none;
      }

      .container{
        padding:22px 14px 30px;
      }

      .top-title h1{
        font-size:32px;
      }

      .notification{
        width:42px;
        height:42px;
      }

      .stat-card{
        flex:0 0 285px;
        min-height:245px;
      }

      .workout-card{
        min-height:215px;
        padding:20px;
        gap:12px;
      }

      .workout-visual{
        width:40%;
      }

      .dumbbell{
        transform:scale(.82);
      }

      .workout-info h3{
        font-size:22px;
      }

      .workout-info p{
        font-size:13px;
      }

      .start-button{
        padding:11px 20px;
        font-size:14px;
      }

      .news-card{
        flex:0 0 88%;
      }

      .section-header h2{
        font-size:24px;
      }

      .bottom-nav{
        height:73px;
      }

      .nav-item{
        font-size:11px;
      }
    }

    @media(max-width:430px){

      .top-title h1{
        font-size:31px;
      }

      .stat-card{
        flex-basis:285px;
      }

      .workout-card{
        padding:17px;
      }

      .workout-visual{
        width:37%;
      }

      .dumbbell{
        transform:scale(.68);
      }

      .workout-info h3{
        font-size:20px;
      }

      .workout-info p{
        font-size:12px;
      }

      .start-button{
        padding:10px 17px;
        font-size:13px;
      }
    }

  </style>
</head>


<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      Body<span>Reset</span>
    </div>

    <div class="header-actions">

      <div
        class="profile-button"
        id="profileButton">
        BR
      </div>

      <button
        class="logout-button"
        id="logoutBtn">
        Logout
      </button>

    </div>

  </header>


  <!-- MAIN -->
  <main class="container">


    <!-- TITLE -->
    <div class="top-title">

      <h1>
        Dashboard
      </h1>

      <div class="notification">

        <div class="bell"></div>

        <span class="notification-dot"></span>

      </div>

    </div>


    <!-- =========================
         3 STATS
    ========================= -->

    <section class="stats">


      <!-- WEEKLY ACTIVITY -->
      <div class="stat-card">

        <div class="stat-head">

          <h2>
            Weekly Activity
          </h2>

          <span class="arrow">
            ›
          </span>

        </div>


        <div class="activity">


          <div class="circle-box">

            <div class="progress-circle">

              <span class="circle-number">
                60
              </span>

            </div>

            <span class="circle-label">
              Progress
            </span>

          </div>


          <div class="circle-box">

            <div class="progress-circle small">

              <span class="circle-number">
                0%
              </span>

            </div>

            <span class="circle-label">
              Burn
            </span>

          </div>


        </div>

      </div>


      <!-- CALORIE BURN -->
      <div class="stat-card">

        <div class="stat-head">

          <h2>
            Calorie Burn
          </h2>

          <span class="arrow">
            ›
          </span>

        </div>


        <div class="calorie">

          <span class="fire">
            ♨
          </span>

          <strong>
            280
          </strong>

          <span>
            kcal
          </span>

        </div>


        <div class="chart">


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:38px;">
            </div>

            <span class="day">
              Mo
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:62px;">
            </div>

            <span class="day">
              Tu
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:43px;">
            </div>

            <span class="day">
              We
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:55px;">
            </div>

            <span class="day">
              Th
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:68px;">
            </div>

            <span class="day">
              Fr
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:50px;">
            </div>

            <span class="day">
              Sa
            </span>

          </div>


          <div class="chart-column">

            <div class="chart-bg"></div>

            <div
              class="chart-bar"
              style="height:74px;">
            </div>

            <span class="day">
              Su
            </span>

          </div>


        </div>

      </div>


      <!-- WEEKLY PROGRESS -->
      <div class="stat-card">

        <div class="stat-head">

          <h2>
            Weekly Progress
          </h2>

          <span class="arrow">
            ›
          </span>

        </div>


        <div class="weekly">

          <div class="big-circle">

            <span class="big-number">
              68%
            </span>

          </div>

        </div>

      </div>


    </section>


    <!-- =========================
         TODAY'S WORKOUT
    ========================= -->

    <div class="section-header">

      <h2>
        Today's Workout
      </h2>

      <a
        href="workout.html"
        class="see-all">
        See All
