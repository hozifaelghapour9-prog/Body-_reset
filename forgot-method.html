<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - BodyReset</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #071a33;
      margin-bottom: 25px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      margin: 0 0 10px;
      color: #071a33;
      text-align: center;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .method {
      width: 100%;
      padding: 18px;
      margin-bottom: 15px;
      border: 2px solid #071a33;
      border-radius: 10px;
      background: #071a33;
      color: white;
      cursor: pointer;
      text-align: right;
      transition: .2s;
    }

    .method:hover {
      background: #0b2547;
      border-color: #2563eb;
    }

    .method-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .method-text {
      font-size: 14px;
      color: #cbd5e1;
      direction: ltr;
      text-align: left;
      word-break: break-word;
    }

    .disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.7;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Body<span>Reset</span>
    </div>

    <h1>
      Choose a method
    </h1>

    <p>
      اختر طريقة استلام رمز التحقق
    </p>

    <div class="method" id="emailMethod" onclick="sendEmailCode()">

      <div class="method-title">
        Send code to Email
      </div>

      <div class="method-text" id="emailText">
        Loading...
      </div>

    </div>

    <div class="method disabled" id="phoneMethod" onclick="sendPhoneCode()">

      <div class="method-title">
        Send code to Phone
      </div>

      <div class="method-text" id="phoneText">
        SMS verification
      </div>

    </div>

    <div id="message"></div>

    <a class="back" href="forgot-password.html">
      Back
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const phoneEmail =
      sessionStorage.getItem("reset_phone_email");


    const emailMethod =
      document.getElementById("emailMethod");

    const phoneMethod =
      document.getElementById("phoneMethod");

    const emailText =
      document.getElementById("emailText");

    const phoneText =
      document.getElementById("phoneText");

    const message =
      document.getElementById("message");


    if (!phoneEmail) {

      message.style.color = "#dc2626";

      message.textContent =
        "بيانات الاستعادة غير موجودة. ارجع وحاول مرة أخرى.";

      emailMethod.style.display = "none";
      phoneMethod.style.display = "none";

    } else {

      const isEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(phoneEmail);


      if (isEmail) {

        emailText.textContent =
          phoneEmail;

        phoneMethod.style.display =
          "none";

      } else {

        phoneMethod.classList.remove("disabled");

        phoneText.textContent =
          phoneEmail;

        emailMethod.style.display =
          "none";

      }

    }


    async function sendEmailCode() {

      if (!phoneEmail) {
        return;
      }


      message.style.color = "#64748b";

      message.textContent =
        "جاري إرسال رمز التحقق...";


      const { error } =
        await supabaseClient.auth.signInWithOtp({

          email: phoneEmail,

          options: {
            shouldCreateUser: false
          }

        });


      if (error) {

        message.style.color = "#dc2626";

        message.textContent =
          "حصل خطأ أثناء إرسال الرمز: " +
          error.message;

        return;

      }


      sessionStorage.setItem(
        "reset_method",
        "email"
      );


      sessionStorage.setItem(
        "reset_email",
        phoneEmail
      );


      window.location.href =
        "reset-otp.html";

    }


    function sendPhoneCode() {

      message.style.color = "#dc2626";

      message.textContent =
        "إرسال رمز SMS سيتم تفعيله بعد ربط خدمة التحقق بالهاتف.";

    }

  </script>

</body>
</html>
