<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - BodyReset</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071a33;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .box {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      padding: 70px 25px 40px;
    }

    .content {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .title {
      text-align: center;
      margin-bottom: 45px;
    }

    .title h1 {
      margin: 0 0 12px;
      color: #071a33;
      font-size: 30px;
      font-weight: 700;
    }

    .title-line {
      width: 55px;
      height: 4px;
      background: #2563eb;
      border-radius: 10px;
      margin: 0 auto;
    }

    .method {
      width: 100%;
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      background: #ffffff;
      color: #071a33;
      cursor: pointer;
      text-align: right;
      transition: .2s ease;
      box-shadow: 0 6px 18px rgba(7, 26, 51, .07);
    }

    .method:hover {
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, .12);
    }

    .method-top {
      display: flex;
      align-items: center;
      gap: 15px;
      direction: rtl;
    }

    .icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      background: #071a33;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .method-info {
      flex: 1;
    }

    .method-title {
      font-size: 18px;
      font-weight: bold;
      color: #071a33;
      margin-bottom: 7px;
    }

    .method-text {
      font-size: 14px;
      color: #64748b;
      direction: ltr;
      text-align: left;
      word-break: break-word;
    }

    .arrow {
      color: #2563eb;
      font-size: 24px;
      font-weight: bold;
    }

    .disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .disabled:hover {
      transform: none;
      border-color: #dbe3ee;
      box-shadow: 0 6px 18px rgba(7, 26, 51, .07);
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-size: 15px;
      line-height: 1.7;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .back:hover {
      color: #1d4ed8;
    }

    @media (max-width: 500px) {

      .box {
        padding: 55px 18px 35px;
      }

      .title {
        margin-bottom: 35px;
      }

      .title h1 {
        font-size: 27px;
      }

      .method {
        padding: 18px;
        border-radius: 14px;
      }

      .icon {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }

      .icon svg {
        width: 22px;
        height: 22px;
      }

      .method-title {
        font-size: 17px;
      }

      .method-text {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="content">

      <div class="title">
        <h1>اختر طريقة التحقق</h1>
        <div class="title-line"></div>
      </div>


      <div
        class="method"
        id="emailMethod"
        onclick="sendEmailCode()"
      >

        <div class="method-top">

          <div class="icon">

            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M3 7l9 6 9-6"></path>
            </svg>

          </div>

          <div class="method-info">

            <div class="method-title">
              إرسال رمز إلى البريد الإلكتروني
            </div>

            <div
              class="method-text"
              id="emailText"
            >
              Loading...
            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </div>

      </div>


      <div
        class="method disabled"
        id="phoneMethod"
        onclick="sendPhoneCode()"
      >

        <div class="method-top">

          <div class="icon">

            <svg viewBox="0 0 24 24">
              <rect x="7" y="3" width="10" height="18" rx="2"></rect>
              <path d="M10 18h4"></path>
            </svg>

          </div>

          <div class="method-info">

            <div class="method-title">
              إرسال رمز إلى الهاتف
            </div>

            <div
              class="method-text"
              id="phoneText"
            >
              SMS verification
            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </div>

      </div>


      <div id="message"></div>


      <a
        class="back"
        href="forgot-password.html"
      >
        العودة
      </a>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const phoneEmail =
      sessionStorage.getItem(
        "reset_phone_email"
      );


    const emailMethod =
      document.getElementById(
        "emailMethod"
      );

    const phoneMethod =
      document.getElementById(
        "phoneMethod"
      );

    const emailText =
      document.getElementById(
        "emailText"
      );

    const phoneText =
      document.getElementById(
        "phoneText"
      );

    const message =
      document.getElementById(
        "message"
      );


    if (!phoneEmail) {

      message.style.color =
        "#dc2626";

      message.textContent =
        "بيانات الاستعادة غير موجودة. ارجع وحاول مرة أخرى.";

      emailMethod.style.display =
        "none";

      phoneMethod.style.display =
        "none";

    } else {

      const isEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          phoneEmail
        );


      if (isEmail) {

        emailText.textContent =
          phoneEmail;

        phoneMethod.style.display =
          "none";

      } else {

        phoneMethod.classList.remove(
          "disabled"
        );

        phoneText.textContent =
          phoneEmail;

        emailMethod.style.display =
          "none";
      }

    }


    async function sendEmailCode() {

      if (!phoneEmail) {
        return;
      }


      message.style.color =
        "#64748b";

      message.textContent =
        "جاري إرسال رمز التحقق...";


      const { error } =
        await supabaseClient.auth.signInWithOtp({

          email: phoneEmail,

          options: {
            shouldCreateUser: false
          }

        });


      if (error) {

        message.style.color =
          "#dc2626";

        message.textContent =
          "حصل خطأ أثناء إرسال الرمز: " +
          error.message;

        return;
      }


      sessionStorage.setItem(
        "reset_method",
        "email"
      );


      sessionStorage.setItem(
        "reset_email",
        phoneEmail
      );


      window.location.href =
        "reset-otp.html";

    }


    function sendPhoneCode() {

      message.style.color =
        "#dc2626";

      message.textContent =
        "إرسال رمز SMS سيتم تفعيله بعد ربط خدمة التحقق بالهاتف.";

    }

  </script>

</body>
</html>
