<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - BodyReset</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #071a33;
      margin-bottom: 25px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      margin: 0 0 10px;
      color: #071a33;
      text-align: center;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 2px solid #071a33;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 16px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b2547;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }

    .code-input {
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      direction: ltr;
    }

    .password-input {
      direction: ltr;
      text-align: left;
    }

    .small-text {
      font-size: 14px;
      color: #64748b;
      margin-top: -5px;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Body<span>Reset</span>
    </div>


    <!-- STEP 1 -->

    <div id="step1">

      <h1>
        Find your account
      </h1>

      <p>
        اكتب اسم المستخدم أو الإيميل المرتبط بحسابك
      </p>

      <input
        type="text"
        id="accountInput"
        placeholder="Username or Email"
        autocomplete="username"
      >

      <button
        id="sendButton"
        onclick="sendOTP()"
      >
        إرسال كود التحقق
      </button>

    </div>


    <!-- STEP 2 -->

    <div id="step2" class="hidden">

      <h1>
        Verify your email
      </h1>

      <p>
        تم إرسال كود مكون من 6 أرقام إلى الإيميل المرتبط بحسابك.
      </p>

      <input
        type="text"
        id="otpInput"
        class="code-input"
        placeholder="000000"
        inputmode="numeric"
        maxlength="6"
        autocomplete="one-time-code"
      >

      <button
        id="verifyButton"
        onclick="verifyOTP()"
      >
        تأكيد الكود
      </button>

      <p class="small-text">
        أدخل الكود كما وصلك في الإيميل.
      </p>

    </div>


    <!-- STEP 3 -->

    <div id="step3" class="hidden">

      <h1>
        Create new password
      </h1>

      <p>
        اكتب كلمة السر الجديدة لحسابك.
      </p>

      <input
        type="password"
        id="newPassword"
        class="password-input"
        placeholder="New Password"
        autocomplete="new-password"
      >

      <input
        type="password"
        id="confirmPassword"
        class="password-input"
        placeholder="Confirm Password"
        autocomplete="new-password"
      >

      <button
        id="passwordButton"
        onclick="changePassword()"
      >
        حفظ كلمة السر
      </button>

    </div>


    <div id="message"></div>

    <a
      class="back"
      href="auth.html"
    >
      Back to login
    </a>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let accountEmail = "";


    const message =
      document.getElementById("message");


    function showMessage(text, color) {

      message.style.color = color;
      message.textContent = text;

    }


    function showStep(step) {

      document
        .getElementById("step1")
        .classList.add("hidden");

      document
        .getElementById("step2")
        .classList.add("hidden");

      document
        .getElementById("step3")
        .classList.add("hidden");


      document
        .getElementById("step" + step)
        .classList.remove("hidden");

    }


    // STEP 1
    window.sendOTP = async function() {

      const input =
        document
          .getElementById("accountInput")
          .value
          .trim();


      const button =
        document.getElementById("sendButton");


      message.textContent = "";


      if (!input) {

        showMessage(
          "اكتب Username أو Email أولاً.",
          "#dc2626"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "جاري الإرسال...";


      try {

        // If the user entered an email
        if (input.includes("@")) {

          accountEmail = input;

        }

        // If the user entered a username
        else {

          const {
            data,
            error
          } =
            await supabase.rpc(
              "get_email_by_username",
              {
                username_input: input
              }
            );


          if (error) {

            console.error(error);

            showMessage(
              "حدث خطأ أثناء البحث عن الحساب.",
              "#dc2626"
            );

            return;

          }


          if (!data) {

            showMessage(
              "لم يتم العثور على الحساب.",
              "#dc2626"
            );

            return;

          }


          accountEmail = data;

        }


        // Send Supabase email OTP
        const {
          error
        } =
          await supabase.auth.signInWithOtp({

            email: accountEmail,

            options: {
              shouldCreateUser: false
            }

          });


        if (error) {

          console.error(error);

          showMessage(
            "حدث خطأ أثناء إرسال الكود. حاول مرة أخرى.",
            "#dc2626"
          );

          return;

        }


        showMessage(
          "تم إرسال كود التحقق إلى الإيميل.",
          "#16a34a"
        );


        showStep(2);


        setTimeout(() => {

          message.textContent = "";

        }, 3000);


      }

      catch (error) {

        console.error(error);

        showMessage(
          "حدث خطأ غير متوقع. حاول مرة أخرى.",
          "#dc2626"
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "إرسال كود التحقق";

      }

    };


    // STEP 2
    window.verifyOTP = async function() {

      const code =
        document
          .getElementById("otpInput")
          .value
          .trim();


      const button =
        document.getElementById("verifyButton");


      message.textContent = "";


      if (!code) {

        showMessage(
          "اكتب كود التحقق.",
          "#dc2626"
        );

        return;

      }


      if (!/^\d{6}$/.test(code)) {

        showMessage(
          "كود التحقق يجب أن يكون 6 أرقام.",
          "#dc2626"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "جاري التحقق...";


      try {

        const {
          data,
          error
        } =
          await supabase.auth.verifyOtp({

            email: accountEmail,

            token: code,

            type: "email"

          });


        if (error) {

          console.error(error);

          showMessage(
            "الكود غير صحيح أو انتهت صلاحيته.",
            "#dc2626"
          );

          return;

        }


        if (!data.session) {

          showMessage(
            "تم التحقق لكن لم يتم إنشاء جلسة. حاول مرة أخرى.",
            "#dc2626"
          );

          return;

        }


        showMessage(
          "تم التحقق بنجاح. أنشئ كلمة السر الجديدة.",
          "#16a34a"
        );


        showStep(3);


      }

      catch (error) {

        console.error(error);

        showMessage(
          "حدث خطأ أثناء التحقق.",
          "#dc2626"
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "تأكيد الكود";

      }

    };


    // STEP 3
    window.changePassword = async function() {

      const password =
        document
          .getElementById("newPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const button =
        document.getElementById("passwordButton");


      message.textContent = "";


      if (!password || !confirmPassword) {

        showMessage(
          "اكتب كلمة السر وتأكيدها.",
          "#dc2626"
        );

        return;

      }


      if (password.length < 6) {

        showMessage(
          "كلمة السر يجب أن تكون 6 أحرف أو أرقام على الأقل.",
          "#dc2626"
        );

        return;

      }


      if (password !== confirmPassword) {

        showMessage(
          "كلمتا السر غير متطابقتين.",
          "#dc2626"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "جاري الحفظ...";


      try {

        const {
          error
        } =
          await supabase.auth.updateUser({

            password: password

          });


        if (error) {

          console.error(error);

          showMessage(
            "حدث خطأ أثناء تغيير كلمة السر.",
            "#dc2626"
          );

          return;

        }


        showMessage(
          "تم تغيير كلمة السر بنجاح. جاري الدخول...",
          "#16a34a"
        );


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 1200);


      }

      catch (error) {

        console.error(error);

        showMessage(
          "حدث خطأ غير متوقع.",
          "#dc2626"
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "حفظ كلمة السر";

      }

    };

  </script>

</body>
  </html>
