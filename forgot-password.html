<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Forgot Password - BodyReset</title>  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #071a33;
      margin-bottom: 25px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      margin: 0 0 10px;
      color: #071a33;
      text-align: center;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 2px solid #071a33;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 16px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b2547;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.7;
    }
  </style></head><body>  <div class="box"><div class="logo">
  Body<span>Reset</span>
</div>

<h1>
  Find your account
</h1>

<p>
  اكتب اسم المستخدم أو الإيميل المرتبط بحسابك
</p>

<input
  type="text"
  id="accountInput"
  placeholder="Username or Email"
  autocomplete="username"
>

<button onclick="sendReset()">
  Continue
</button>

<div id="message"></div>

<a class="back" href="auth.html">
  Back to login
</a>

  </div>  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    window.sendReset = async function() {

      const input =
        document.getElementById("accountInput").value.trim();

      const message =
        document.getElementById("message");


      message.textContent = "";


      if (!input) {

        message.style.color = "#dc2626";

        message.textContent =
          "اكتب Username أو Email أولاً.";

        return;

      }


      message.style.color = "#071a33";

      message.textContent =
        "جاري إرسال رابط استعادة كلمة السر...";


      let email = "";


      if (input.includes("@")) {

        email = input;

      } else {

        const {
          data,
          error
        } = await supabase.rpc(
          "get_email_by_username",
          {
            username_input: input
          }
        );


        if (error) {

          message.style.color = "#dc2626";

          message.textContent =
            "حدث خطأ. حاول مرة أخرى.";

          return;

        }


        if (!data) {

          message.style.color = "#dc2626";

          message.textContent =
            "لم يتم العثور على الحساب.";

          return;

        }


        email = data;

      }


      const {
        error
      } =
        await supabase.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://hozifaelghapour9-prog.github.io/Body-_reset/reset-password.html"
          }
        );


      if (error) {

        message.style.color = "#dc2626";

        message.textContent =
          "حدث خطأ أثناء إرسال الإيميل. حاول مرة أخرى.";

        return;

      }


      message.style.color = "#16a34a";

      message.textContent =
        "تم إرسال رابط استعادة كلمة السر إلى الإيميل المرتبط بالحساب. افتح الإيميل واضغط على الرابط.";

    };

  </script></body></html>
