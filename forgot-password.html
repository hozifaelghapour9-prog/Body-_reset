<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - BodyReset</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071a33;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
      background: #071a33;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      margin: 0 0 10px;
      color: #071a33;
      text-align: center;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 2px solid #071a33;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 16px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Body<span>Reset</span>
    </div>

    <h1>
      Find your account
    </h1>

    <p>
      اكتب الإيميل أو رقم الهاتف المرتبط بحسابك
    </p>

    <input
      type="text"
      id="phoneEmail"
      placeholder="Phone/Email"
      autocomplete="email"
    >

    <button onclick="continueReset()">
      Continue
    </button>

    <div id="message"></div>

    <a class="back" href="auth.html">
      Back to login
    </a>

  </div>

  <script>

    function continueReset() {

      const phoneEmail =
        document.getElementById("phoneEmail").value.trim();

      const message =
        document.getElementById("message");


      message.textContent = "";


      if (!phoneEmail) {

        message.style.color = "#dc2626";

        message.textContent =
          "اكتب الإيميل أو رقم الهاتف أولاً.";

        return;
      }


      // Save the entered information
      sessionStorage.setItem(
        "reset_phone_email",
        phoneEmail
      );


      // Go to the next page
      window.location.href =
        "forgot-method.html";

    }

  </script>

</body>
</html>
