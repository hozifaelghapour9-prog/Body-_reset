<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BodyReset - كلمة مرور جديدة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #071a33;
      margin-bottom: 30px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      text-align: center;
      color: #071a33;
      font-size: 27px;
      margin-bottom: 12px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #334155;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .field {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      line-height: 1.6;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Body<span>Reset</span>
    </div>

    <h1>إنشاء كلمة مرور جديدة</h1>

    <p class="description">
      اكتب كلمة المرور الجديدة لحسابك، ثم أكدها مرة أخرى.
    </p>

    <div class="field">
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input
        type="password"
        id="newPassword"
        placeholder="اكتب كلمة المرور الجديدة"
        autocomplete="new-password"
      >
    </div>

    <div class="field">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        autocomplete="new-password"
      >
    </div>

    <button id="saveButton">
      حفظ كلمة المرور
    </button>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <a href="auth.html" class="back">
      العودة لتسجيل الدخول
    </a>

  </div>

  <script>

    const SUPABASE_URL =
      "https://byodeoaluspphqduxmlh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const saveButton =
      document.getElementById("saveButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");


    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
      successMessage.style.display = "none";
    }


    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.style.display = "block";
      errorMessage.style.display = "none";
    }


    async function checkResetSession() {

      const verified =
        sessionStorage.getItem("reset_verified");

      if (verified !== "true") {
        window.location.href = "auth.html";
        return;
      }

      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error || !session) {
        showError(
          "جلسة التحقق غير صالحة. من فضلك ابدأ عملية استعادة كلمة المرور مرة أخرى."
        );

        saveButton.disabled = true;
      }
    }


    saveButton.addEventListener("click", async function () {

      errorMessage.style.display = "none";
      successMessage.style.display = "none";

      const password =
        newPassword.value.trim();

      const confirm =
        confirmPassword.value.trim();


      if (!password || !confirm) {
        showError("من فضلك اكتب كلمة المرور وأكدها.");
        return;
      }


      if (password.length < 6) {
        showError(
          "كلمة المرور يجب أن تكون 6 أحرف أو أكثر."
        );
        return;
      }


      if (password !== confirm) {
        showError(
          "كلمتا المرور غير متطابقتين."
        );
        return;
      }


      saveButton.disabled = true;
      saveButton.textContent = "جاري الحفظ...";


      const {
        data,
        error
      } = await supabaseClient.auth.updateUser({
        password: password
      });


      if (error) {

        showError(
          "حدث خطأ أثناء تغيير كلمة المرور: " +
          error.message
        );

        saveButton.disabled = false;
        saveButton.textContent = "حفظ كلمة المرور";

        return;
      }


      sessionStorage.removeItem("reset_verified");

      showSuccess(
        "تم تغيير كلمة المرور بنجاح. جاري فتح حسابك..."
      );


      setTimeout(function () {
        window.location.href = "dashboard.html";
      }, 1200);

    });


    checkResetSession();

  </script>

</body>
  </html>
