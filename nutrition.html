<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التغذية | BodyReset</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#0066cc 0%,#00a6b2 100%);
  color:#071a33;
  min-height:100vh;
  padding:18px;
}

.container{
  max-width:1100px;
  margin:auto;
}

/* Header */

.header{
  background:#071a33;
  color:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.logo span{
  color:#2563eb;
}

.back{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:10px 15px;
  border-radius:9px;
  font-size:14px;
}

.header h1{
  margin-top:22px;
  font-size:30px;
}

.header p{
  margin-top:8px;
  color:#cbd5e1;
  line-height:1.7;
}

/* Search */

.search-box{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.search{
  position:relative;
}

.search input{
  width:100%;
  border:1px solid #dbe2ea;
  background:#f8fafc;
  border-radius:11px;
  padding:15px 45px 15px 15px;
  font-size:16px;
  outline:none;
}

.search input:focus{
  border-color:#2563eb;
  background:white;
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:19px;
}

/* Categories */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:18px;
}

.category{
  border:none;
  background:white;
  color:#071a33;
  padding:11px 17px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-weight:bold;
}

.category.active{
  background:#071a33;
  color:white;
}

/* Results */

.results-info{
  color:white;
  margin-bottom:12px;
  font-size:15px;
}

.food-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.food-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  cursor:pointer;
  transition:.2s;
}

.food-card:hover{
  transform:translateY(-3px);
}

.food-image{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.food-content{
  padding:17px;
}

.food-category{
  color:#2563eb;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.food-title{
  font-size:19px;
  margin-bottom:8px;
}

.food-description{
  color:#64748b;
  font-size:14px;
  line-height:1.6;
  min-height:44px;
}

.macros{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:13px;
}

.macro{
  background:#f1f5f9;
  padding:9px 4px;
  border-radius:8px;
  text-align:center;
}

.macro span{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-bottom:3px;
}

.macro strong{
  font-size:13px;
}

.calories{
  margin-top:12px;
  background:#071a33;
  color:white;
  text-align:center;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}

/* Empty */

.empty{
  display:none;
  background:white;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  margin-top:10px;
}

.empty h3{
  margin-bottom:7px;
}

.empty p{
  color:#64748b;
}

/* Modal */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:15px;
  overflow-y:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:100%;
  max-width:750px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  max-height:94vh;
  overflow-y:auto;
}

.modal-image{
  width:100%;
  height:270px;
  object-fit:cover;
}

.modal-content{
  padding:22px;
}

.close{
  position:absolute;
  left:15px;
  top:15px;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:white;
  color:#071a33;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.modal-category{
  color:#2563eb;
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

.modal-title{
  font-size:27px;
  margin-bottom:8px;
}

.modal-description{
  color:#64748b;
  line-height:1.8;
  margin-bottom:18px;
}

.nutrition-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:22px;
}

.nutrition-box{
  background:#071a33;
  color:white;
  border-radius:10px;
  padding:13px 7px;
  text-align:center;
}

.nutrition-box span{
  display:block;
  color:#cbd5e1;
  font-size:11px;
  margin-bottom:5px;
}

.nutrition-box strong{
  font-size:15px;
}

.section-title{
  font-size:20px;
  margin:20px 0 10px;
}

.ingredients{
  list-style:none;
}

.ingredients li{
  background:#f1f5f9;
  margin-bottom:7px;
  padding:11px 13px;
  border-radius:8px;
  color:#334155;
}

.instructions{
  list-style:none;
  counter-reset:steps;
}

.instructions li{
  counter-increment:steps;
  position:relative;
  padding:11px 45px 11px 10px;
  margin-bottom:8px;
  background:#f8fafc;
  border-radius:8px;
  line-height:1.7;
}

.instructions li::before{
  content:counter(steps);
  position:absolute;
  right:10px;
  top:10px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:13px;
}

/* Responsive */

@media(max-width:850px){

  .food-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .header{
    padding:18px;
  }

  .header h1{
    font-size:25px;
  }

  .food-grid{
    grid-template-columns:1fr;
  }

  .food-image{
    height:200px;
  }

  .nutrition-summary{
    grid-template-columns:repeat(2,1fr);
  }

  .modal{
    padding:8px;
  }

  .modal-image{
    height:210px;
  }

  .modal-content{
    padding:17px;
  }

  .modal-title{
    font-size:24px;
  }

}
</style>
</head>

<body>

<div class="container">

    </p>

  </div>

</div>


<!-- نافذة الوصفة -->

<div

  onclick="closeOutside(event)"
>

    <button

        طريقة التحضير
      </h3>

      <ol
        class="instructions"

    </div>

  </div>

</div>

/*
====================================
المتغيرات
====================================
*/

let currentCategory = "all";


/*
====================================
عرض الأكلات
====================================
*/

function renderFoods(){

  const grid =
    document.getElementById("foodGrid");

  const empty =
    document.getElementById("empty");

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    foods.filter(function(food){

      const matchesCategory =
        currentCategory === "all" ||
        food.category === currentCategory;


      const text =
        (
          food.name +
          " " +
          food.description +
          " " +
          food.type
        ).toLowerCase();


      const matchesSearch =
        search === "" ||
        text.includes(search);


      return (
        matchesCategory &&
        matchesSearch
      );

    });


  grid.innerHTML = "";


  if(filtered.length === 0){

    empty.style.display = "block";

    document.getElementById(
      "resultsCount"
    ).textContent =
      "لا توجد نتائج";

    return;

  }


  empty.style.display = "none";


  document.getElementById(
    "resultsCount"
  ).textContent =
    "تم العثور على " +
    filtered.length +
    " نتيجة";


  filtered.forEach(function(food){

    const card =
      document.createElement("div");

    card.className =
      "food-card";


    card.onclick =
      function(){

        openFood(food.id);

      };


    card.innerHTML = `

      <img
        class="food-image"
        src="${food.image}"
        alt="${food.name}"
      >

      <div class="food-content">

        <div class="food-category">
          ${food.type}
        </div>

        <h3 class="food-title">
          ${food.name}
        </h3>

        <p class="food-description">
          ${food.description}
        </p>

        <div class="macros">

          <div class="macro">
            <span>بروتين</span>
            <strong>${food.protein}g</strong>
          </div>

          <div class="macro">
            <span>كارب</span>
            <strong>${food.carbs}g</strong>
          </div>

          <div class="macro">
            <span>دهون</span>
            <strong>${food.fat}g</strong>
          </div>

        </div>

        <div class="calories">
          ${food.calories} kcal
        </div>

      </div>

    `;


    grid.appendChild(card);

  });

}


/*
====================================
البحث
====================================
*/

function searchFoods(){

  renderFoods();

}


/*
====================================
التصنيف
====================================
*/

function filterCategory(
  category,
  button
){

  currentCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(function(item){

      item.classList.remove("active");

    });


  button.classList.add("active");


  renderFoods();

}


/*
====================================
فتح الوصفة
====================================
*/

function openFood(id){

  const food =
    foods.find(function(item){

      return item.id === id;

    });


  if(!food) return;


  document.getElementById(
    "modalImage"
  ).src = food.image;


  document.getElementById(
    "modalImage"
  ).alt = food.name;


  document.getElementById(
    "modalCategory"
  ).textContent =
    food.type;


  document.getElementById(
    "modalTitle"
  ).textContent =
    food.name;


  document.getElementById(
    "modalDescription"
  ).textContent =
    food.description;


  document.getElementById(
    "modalCalories"
  ).textContent =
    food.calories;


  document.getElementById(
    "modalProtein"
  ).textContent =
    food.protein;


  document.getElementById(
    "modalCarbs"
  ).textContent =
    food.carbs;


  document.getElementById(
    "modalFat"
  ).textContent =
    food.fat;


  const ingredients =
    document.getElementById(
      "modalIngredients"
    );


  ingredients.innerHTML = "";


  food.ingredients.forEach(
    function(item){

      const li =
        document.createElement("li");

      li.textContent =
        item;

      ingredients.appendChild(li);

    }
  );


  const instructions =
    document.getElementById(
      "modalInstructions"
    );


  instructions.innerHTML = "";


  food.instructions.forEach(
    function(item){

      const li =
        document.createElement("li");

      li.textContent =
        item;

      instructions.appendChild(li);

    }
  );


  document
    .getElementById("modal")
    .classList.add("show");


  document.body.style.overflow =
    "hidden";

}


/*
====================================
إغلاق الوصفة
====================================
*/

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");


  document.body.style.overflow =
    "";

}


function closeOutside(event){

  if(
    event.target ===
    document.getElementById("modal")
  ){

    closeModal();

  }

}


/*
====================================
زر ESC
====================================
*/

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeModal();

    }

  }
);


/*
====================================
تشغيل الصفحة
====================================
*/

renderFoods();

</script>
