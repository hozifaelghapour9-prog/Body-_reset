
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout | BODYRESET</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --white: #fff;
      --text: #fff;
      --muted: #e0e0e0;
      --panel: rgba(20, 20, 20, .78);
      --border: rgba(255, 255, 255, .18);
      --accent: #d6d6d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      color: var(--text);
      background: linear-gradient(
        180deg,
        #000000 0%,
        #3a3a3a 50%,
        #a0a0a0 100%
      );
      background-attachment: fixed;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button { cursor: pointer; }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .logo span { color: #aaa; }

    .nav-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: white;
      transition: .2s;
    }

    .btn:hover { background: rgba(255,255,255,.17); }

    .btn.light {
      color: #111;
      background: #fff;
      border-color: white;
      font-weight: 700;
    }

    main { padding: 30px 0 60px; }

    .page-title {
      margin: 0 0 5px;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
    }

    .subtitle {
      color: #e1e1e1;
      margin: 0 0 26px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.35);
      margin-bottom: 18px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      color: white;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 12px;
    }

    input::placeholder, textarea::placeholder {
      color: #c8c8c8;
    }

    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin: 0 0 24px;
    }

    .filter {
      border: 1px solid var(--border);
      color: white;
      background: rgba(0,0,0,.22);
      border-radius: 999px;
      padding: 9px 15px;
    }

    .filter.active {
      background: white;
      color: #111;
      border-color: white;
      font-weight: 700;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 16px;
    }

    .section-heading h2 { margin: 0; font-size: 22px; }

    .count {
      color: #eee;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .video-card {
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(18,18,18,.82);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .video-card video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: contain;
      background: #090909;
    }

    .card-body { padding: 16px; }

    .tag {
      display: inline-block;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.08);
      color: #eee;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .card-body h3 {
      margin: 0 0 8px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .description {
      color: #dedede;
      font-size: 14px;
      line-height: 1.8;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty, .loading, .error {
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 30px 16px;
      text-align: center;
      color: #f1f1f1;
      grid-column: 1 / -1;
    }

    .admin-panel {
      background: rgba(0,0,0,.55);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .admin-panel h2 { margin: 0 0 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full { grid-column: 1 / -1; }

    .field label { font-size: 14px; color: #eee; }

    .field input, .field textarea, .field select {
      width: 100%;
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
    }

    .field select option { color: #111; }

    .field textarea {
      resize: vertical;
      min-height: 85px;
    }

    .admin-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .hidden { display: none !important; }

    .notice {
      margin-top: 12px;
      font-size: 14px;
      color: #eee;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 22px 0;
      border-top: 1px solid var(--border);
      color: #eee;
      text-align: center;
      font-size: 13px;
      background: rgba(0,0,0,.15);
    }

    @media (max-width: 850px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .grid, .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .nav { padding: 12px 0; align-items: flex-start; flex-direction: column; }
      .page-title { font-size: 29px; }
      main { padding-top: 24px; }
    }
  </style>
</head>

<body>
<header>
  <div class="container nav">
    <a class="logo" href="#">BODY<span>RESET</span></a>
    <div class="nav-actions">
      <button class="btn" id="adminToggle" type="button">دخول الأدمن</button>
      <button class="btn hidden" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Workout</h1>
  <p class="subtitle">اختار العضلة وابحث عن التمرين المناسب ليك.</p>

  <section class="admin-panel hidden" id="adminPanel">
    <h2 id="adminHeading">إدارة فيديوهات التمارين</h2>

    <form id="videoForm">
      <div class="form-grid">
        <div class="field">
          <label for="videoTitle">اسم التمرين</label>
          <input id="videoTitle" maxlength="120" placeholder="مثال: تمرين الصدر" required>
        </div>

        <div class="field">
          <label for="muscleGroup">العضلة</label>
          <select id="muscleGroup" required>
            <option value="chest">الصدر</option>
            <option value="back">الظهر</option>
            <option value="shoulders">الأكتاف</option>
            <option value="arms">الذراعين</option>
            <option value="legs">الرجلين</option>
            <option value="abs">البطن</option>
            <option value="cardio">كارديو</option>
            <option value="fullbody">الجسم بالكامل</option>
          </select>
        </div>

        <div class="field full">
          <label for="videoDescription">وصف التمرين</label>
          <textarea id="videoDescription" maxlength="1000" placeholder="اكتب وصفًا مختصرًا للتمرين"></textarea>
        </div>

        <div class="field full">
          <label for="videoFile">ملف الفيديو</label>
          <input id="videoFile" type="file" accept="video/*">
          <small>اختار فيديو جديدًا، أو اترك الحقل فارغًا عند تعديل الاسم والوصف فقط.</small>
        </div>
      </div>

      <div class="admin-buttons">
        <button class="btn light" type="submit" id="saveVideoBtn">حفظ الفيديو</button>
        <button class="btn hidden" type="button" id="cancelEditBtn">إلغاء التعديل</button>
      </div>
      <p class="notice" id="adminMessage" role="status"></p>
    </form>
  </section>

  <div class="search-box">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" type="search" placeholder="ابحث باسم التمرين أو العضلة..." aria-label="البحث عن تمرين">
    <button class="btn" id="clearSearch" type="button">مسح</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter active" data-muscle="all">الكل</button>
    <button class="filter" data-muscle="chest">الصدر</button>
    <button class="filter" data-muscle="back">الظهر</button>
    <button class="filter" data-muscle="shoulders">الأكتاف</button>
    <button class="filter" data-muscle="arms">الذراعين</button>
    <button class="filter" data-muscle="legs">الرجلين</button>
    <button class="filter" data-muscle="abs">البطن</button>
    <button class="filter" data-muscle="cardio">كارديو</button>
    <button class="filter" data-muscle="fullbody">الجسم بالكامل</button>
  </div>

  <div class="section-heading">
    <h2>فيديوهات التمارين</h2>
    <span class="count" id="videoCount">0 فيديو</span>
  </div>

  <section class="grid" id="videoGrid" aria-live="polite">
    <div class="loading">جاري تحميل التمارين...</div>
  </section>
</main>

<footer>
  BODYRESET — تمرّن بانتظام، وتقدّم خطوة بخطوة.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // إعدادات Supabase المستخدمة في النسخة السابقة
  const SUPABASE_URL = "https://byodeoaluspphqduxmlh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_uB0eFh3HfRwUI9eWS73AtA_uOzKvg92";
  const TABLE = "workout_videos";
  const BUCKET = "workout-videos";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const muscleNames = {
    chest: "الصدر",
    back: "الظهر",
    shoulders: "الأكتاف",
    arms: "الذراعين",
    legs: "الرجلين",
    abs: "البطن",
    cardio: "كارديو",
    fullbody: "الجسم بالكامل"
  };

  const grid = document.getElementById("videoGrid");
  const count = document.getElementById("videoCount");
  const searchInput = document.getElementById("searchInput");
  const adminPanel = document.getElementById("adminPanel");
  const adminToggle = document.getElementById("adminToggle");
  const logoutBtn = document.getElementById("logoutBtn");
  const adminMessage = document.getElementById("adminMessage");
  const videoForm = document.getElementById("videoForm");

  let videos = [];
  let activeMuscle = "all";
  let editingVideo = null;
  let isAdmin = false;

  function normalize(value) {
    return String(value || "").trim().toLocaleLowerCase("ar");
  }

  function setAdminMessage(message) {
    adminMessage.textContent = message;
  }

  function escapeText(value) {
    return String(value ?? "");
  }

  async function loadVideos() {
    grid.innerHTML = '<div class="loading">جاري تحميل التمارين...</div>';

    const { data, error } = await supabaseClient
      .from(TABLE)
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = '<div class="error">تعذر تحميل الفيديوهات. راجع إعدادات الجدول وصلاحيات القراءة في Supabase.</div>';
      count.textContent = "—";
      console.error(error);
      return;
    }

    videos = data || [];
    renderVideos();
  }

  function getVideoUrl(video) {
    // يدعم أسماء الحقول الشائعة المستخدمة لتخزين رابط الفيديو
    return video.video_url || video.url || video.public_url || "";
  }

  function getMuscle(video) {
    return video.muscle_group || video.muscle || video.category || "";
  }

  function renderVideos() {
    const query = normalize(searchInput.value);

    const filtered = videos.filter(video => {
      const muscle = getMuscle(video);
      const title = video.title || video.name || "";
      const description = video.description || "";

      const matchesMuscle =
        activeMuscle === "all" || muscle === activeMuscle;

      const searchContent = normalize(
        title + " " +
        description + " " +
        (muscleNames[muscle] || muscle)
      );

      return matchesMuscle && (!query || searchContent.includes(query));
    });

    count.textContent = filtered.length + " فيديو";

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty">مفيش فيديوهات مطابقة للبحث حاليًا.</div>';
      return;
    }

    grid.innerHTML = "";

    filtered.forEach(video => {
      const url = getVideoUrl(video);
      const muscle = getMuscle(video);
      const title = video.title || video.name || "تمرين";
      const description = video.description || "";

      const card = document.createElement("article");
      card.className = "video-card";

      if (url) {
        const player = document.createElement("video");
        player.controls = true;
        player.preload = "metadata";
        player.playsInline = true;
        player.src = url;
        player.setAttribute("aria-label", title);
        card.appendChild(player);
      } else {
        const missing = document.createElement("div");
        missing.className = "empty";
        missing.textContent = "رابط الفيديو غير متوفر";
        card.appendChild(missing);
      }

      const body = document.createElement("div");
      body.className = "card-body";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = muscleNames[muscle] || muscle || "تمرين";

      const heading = document.createElement("h3");
      heading.textContent = title;

      const desc = document.createElement("p");
      desc.className = "description";
      desc.textContent = description;

      body.append(tag, heading, desc);

      if (isAdmin) {
        const controls = document.createElement("div");
        controls.className = "admin-buttons";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "btn";
        editBtn.textContent = "تعديل";
        editBtn.addEventListener("click", () => startEdit(video));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn";
        deleteBtn.textContent = "حذف";
        deleteBtn.addEventListener("click", () => deleteVideo(video));

        controls.append(editBtn, deleteBtn);
        body.appendChild(controls);
      }

      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  document.getElementById("filters").addEventListener("click", event => {
    const button = event.target.closest("[data-muscle]");
    if (!button) return;

    activeMuscle = button.dataset.muscle;

    document.querySelectorAll(".filter").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderVideos();
  });

  searchInput.addEventListener("input", renderVideos);

  document.getElementById("clearSearch").addEventListener("click", () => {
    searchInput.value = "";
    renderVideos();
    searchInput.focus();
  });

  async function refreshAdminState() {
    const { data } = await supabaseClient.auth.getSession();
    const session = data?.session;

    isAdmin = false;

    if (session?.user) {
      const { data: admin, error } = await supabaseClient
        .from("workout_admins")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      isAdmin = !error && !!admin;
    }

    adminPanel.classList.toggle("hidden", !isAdmin);
    logoutBtn.classList.toggle("hidden", !session);
    adminToggle.classList.toggle("hidden", !!session);

    renderVideos();
  }

  adminToggle.addEventListener("click", async () => {
    const email = prompt("اكتب إيميل الأدمن:");
    if (!email) return;

    const password = prompt("اكتب كلمة المرور:");
    if (!password) return;

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email.trim(),
      password
    });

    if (error) {
      alert("فشل تسجيل الدخول: " + error.message);
      return;
    }

    await refreshAdminState();

    if (!isAdmin) {
      alert("الحساب ده مش موجود في قائمة الأدمن.");
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    isAdmin = false;
    adminPanel.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    adminToggle.classList.remove("hidden");
    resetForm();
    renderVideos();
  });

  function startEdit(video) {
    editingVideo = video;

    document.getElementById("videoTitle").value =
      video.title || video.name || "";

    document.getElementById("videoDescription").value =
      video.description || "";

    document.getElementById("muscleGroup").value =
      getMuscle(video) || "chest";

    document.getElementById("saveVideoBtn").textContent =
      "حفظ التعديلات";

    document.getElementById("cancelEditBtn").classList.remove("hidden");
    document.getElementById("adminHeading").textContent = "تعديل التمرين";

    adminPanel.scrollIntoView({ behavior: "smooth" });
  }

  function resetForm() {
    videoForm.reset();
    editingVideo = null;
    document.getElementById("saveVideoBtn").textContent = "حفظ الفيديو";
    document.getElementById("cancelEditBtn").classList.add("hidden");
    document.getElementById("adminHeading").textContent =
      "إدارة فيديوهات التمارين";
    setAdminMessage("");
  }

  document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

  videoForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (!isAdmin) {
      setAdminMessage("سجّل دخولك كأدمن أولًا.");
      return;
    }

    const title = document.getElementById("videoTitle").value.trim();
    const description = document.getElementById("videoDescription").value.trim();
    const muscle_group = document.getElementById("muscleGroup").value;
    const file = document.getElementById("videoFile").files[0];

    if (!title) {
      setAdminMessage("اكتب اسم التمرين.");
      return;
    }

    if (!editingVideo && !file) {
      setAdminMessage("اختار ملف الفيديو أولًا.");
      return;
    }

    if (file && !file.type.startsWith("video/")) {
      setAdminMessage("الملف لازم يكون فيديو.");
      return;
    }

    if (file && file.size > 100 * 1024 * 1024) {
      setAdminMessage("حجم الفيديو أكبر من 100 ميجابايت.");
      return;
    }

    const saveButton = document.getElementById("saveVideoBtn");
    saveButton.disabled = true;
    setAdminMessage("جاري الحفظ...");

    try {
      let videoUrl = editingVideo ? getVideoUrl(editingVideo) : "";

      if (file) {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const filePath = Date.now() + "_" + safeName;

        const { error: uploadError } = await supabaseClient.storage
          .from(BUCKET)
          .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { data: publicData } = supabaseClient.storage
          .from(BUCKET)
          .getPublicUrl(filePath);

        videoUrl = publicData.publicUrl;
      }

      const payload = {
        title,
        description,
        muscle_group,
        video_url: videoUrl
      };

      let result;

      if (editingVideo) {
        result = await supabaseClient
          .from(TABLE)
          .update(payload)
          .eq("id", editingVideo.id);
      } else {
        result = await supabaseClient
          .from(TABLE)
          .insert(payload);
      }

      if (result.error) throw result.error;

      setAdminMessage("تم الحفظ بنجاح.");
      resetForm();
      await loadVideos();
    } catch (error) {
      console.error(error);
      setAdminMessage(
        "تعذر الحفظ: " + (error.message || "راجع إعدادات Supabase.")
      );
    } finally {
      saveButton.disabled = false;
    }
  });

  async function deleteVideo(video) {
    if (!isAdmin) return;

    const confirmed = confirm("متأكد إنك عايز تحذف التمرين ده؟");
    if (!confirmed) return;

    const { error } = await supabaseClient
      .from(TABLE)
      .delete()
      .eq("id", video.id);

    if (error) {
      alert("تعذر حذف التمرين: " + error.message);
      return;
    }

    await loadVideos();
  }

  supabaseClient.auth.onAuthStateChange(() => {
    setTimeout(refreshAdminState, 0);
  });

  (async function init() {
    await refreshAdminState();
    await loadVideos();
  })();
</script>
</body>
</html>
